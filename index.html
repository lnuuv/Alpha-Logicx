      font: 700 13px var(--font-main);
      cursor: pointer;
      transition: .15s;
    }

    .hs-topic i {
      font-style: normal;
      font-size: 18px;
    }

    .hs-topic:hover {
      border-color: var(--cyan);
    }

    .hs-topic.on {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .hs-genrow {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      margin: 10px 0 14px;
    }

    .hs-genrow label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 700;
    }

    .hs-inrow {
      display: flex;
      gap: 6px;
    }

    @media (max-width: 560px) {
      .hs-genrow {
        grid-template-columns: 1fr 1fr;
      }

      .hs-genrow label:first-child {
        grid-column: 1 / -1;
      }

      .hs-hero {
        flex-direction: column;
      }
    }

    /* الواجب المولّد بشكل ورقة */
    .hs-brief {
      border-color: rgba(250, 204, 21, .45);
    }

    .hs-brief-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .hs-brief-badge {
      padding: 5px 12px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      font-weight: 800;
      font-size: 12.5px;
      color: #1c1917;
      background: linear-gradient(135deg, #facc15, #fb923c);
    }

    .hs-paper {
      position: relative;
      padding: 22px 24px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      color: #1e293b;
      line-height: 1.9;
      font-size: 14.5px;
      background: linear-gradient(#fffdf7, #fffdf7) padding-box, linear-gradient(135deg, var(--a2l), var(--a1)) border-box;
      border: 2px solid transparent;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .25);
    }

    .hs-paper::before {
      content: "BTEC · PRACTICE";
      position: absolute;
      top: 12px;
      inset-inline-end: 16px;
      font: 800 10.5px var(--font-mono);
      letter-spacing: .14em;
      color: var(--a2l);
      direction: ltr;
    }

    .hs-paper h3 {
      margin: 0 0 4px;
      font-size: 20px;
      color: var(--a2d);
    }

    .hs-paper h4 {
      margin: 16px 0 4px;
      color: var(--a2);
      font-size: 15.5px;
    }

    .hs-paper h4 small {
      color: #64748b;
      font-weight: 600;
    }

    .hs-paper .hs-meta {
      color: #475569;
    }

    .hs-paper p {
      margin: 0 0 6px;
    }

    .hs-paper .hs-ul li::marker {
      color: var(--a2);
    }

    .hs-pact {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: #f5f3ff;
      border-inline-start: 4px solid var(--a2);
    }

    .hs-pact h4 {
      margin-top: 0;
    }

    .hs-sub {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: #0f766e;
    }

    .hs-crit-t {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .hs-crit-t th,
    .hs-crit-t td {
      padding: 7px 8px;
      border-bottom: 1px solid #e2e8f0;
      text-align: start;
      vertical-align: top;
    }

    .hs-crit-t th {
      color: #64748b;
      font-size: 12.5px;
    }

    .hs-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 6px 0;
    }

    .hs-code {
      display: inline-block;
      padding: 2px 9px;
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
      font: 800 12px var(--font-mono);
      direction: ltr;
      border: 1px solid rgba(52, 211, 153, .6);
      color: #10b981;
      background: rgba(52, 211, 153, .1);
    }

    .hs-code.M {
      border-color: rgba(var(--a1-rgb), .6);
      color: var(--a1d);
      background: rgba(var(--a1-rgb), .1);
    }

    .hs-code.D {
      border-color: rgba(245, 158, 11, .7);
      color: #d97706;
      background: rgba(245, 158, 11, .12);
    }

    .hs-cw {
      display: inline-block;
      padding: 2px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      font-size: 12px;
      font-weight: 700;
      color: var(--a3);
      border: 1px solid rgba(var(--a3-rgb), .45);
      background: rgba(var(--a3-rgb), .08);
    }

    /* مساحة العمل */
    .hs-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .hs-file-n {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .hs-file-n b {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 46vw;
    }

    .hs-tabs {
      display: flex;
      overflow-x: auto;
      gap: 4px;
      padding: 5px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      background: var(--card-bg);
      border: 1px solid var(--border);
      scrollbar-width: thin;
    }

    .hs-tabs button {
      flex: none;
      padding: 10px 14px;
      border: 0;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: transparent;
      color: var(--muted);
      font: 800 13.5px var(--font-main);
      cursor: pointer;
      white-space: nowrap;
    }

    .hs-tabs button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .05);
    }

    .hs-tabs button.on {
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .hs-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hs-det {
      border: 1px solid var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .02);
    }

    .hs-det>summary {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      list-style: none;
    }

    .hs-det>summary::-webkit-details-marker {
      display: none;
    }

    .hs-det>summary::after {
      content: "▾";
      color: var(--muted);
      transition: transform .2s;
      margin-inline-start: auto;
    }

    .hs-det[open]>summary::after {
      transform: rotate(180deg);
    }

    .hs-det>summary small {
      color: var(--muted);
      font-weight: 600;
    }

    .hs-det-b {
      padding: 0 14px 12px;
      line-height: 1.85;
    }

    .hs-det-b p {
      margin: 0;
    }

    .hs-src {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid;
    }

    .hs-src.doc {
      color: var(--a1d);
      border-color: rgba(var(--a1-rgb), .5);
      background: rgba(var(--a1-rgb), .08);
    }

    .hs-src.ai {
      color: var(--a2l);
      border-color: rgba(var(--a2l-rgb), .5);
      background: rgba(var(--a2-rgb), .1);
    }

    .hs-src.gen {
      color: #d97706;
      border-color: rgba(245, 158, 11, .5);
      background: rgba(245, 158, 11, .08);
    }

    .hs-src.example {
      color: var(--a3);
      border-color: rgba(var(--a3-rgb), .45);
      background: rgba(var(--a3-rgb), .08);
    }

    .hs-src.notfound {
      color: var(--bad);
      border-color: rgba(251, 113, 133, .5);
      background: rgba(251, 113, 133, .08);
    }

    .hs-crit {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hs-crit li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 10px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .025);
      line-height: 1.7;
    }

    .hs-crit small {
      display: block;
    }

    .hs-acts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .hs-acts button {
      padding: 8px 14px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font: 700 13px var(--font-main);
      cursor: pointer;
    }

    .hs-acts button.on {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--a1d), var(--a1d));
    }

    .hs-quote {
      margin: 8px 0;
      padding: 8px 12px;
      border-inline-start: 3px solid var(--cyan);
      background: rgba(var(--a1-rgb), .06);
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
      font-size: 13.5px;
    }

    .hs-first {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(250, 204, 21, .55);
      background: linear-gradient(135deg, rgba(250, 204, 21, .14), rgba(251, 146, 60, .06));
    }

    .hs-first p {
      margin: 6px 0 0;
      font-size: 15px;
      line-height: 1.9;
    }

    .hs-actbtn,
    .hs-lesson,
    .hs-lcard {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: start;
      padding: 11px 13px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: .15s;
    }

    .hs-actbtn:hover,
    .hs-lesson:hover,
    .hs-lcard:hover {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .06);
      transform: translateY(-1px);
    }

    .hs-actbtn small,
    .hs-lesson small {
      display: block;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.7;
      margin-top: 2px;
    }

    .hs-go {
      color: var(--cyan);
      font-weight: 800;
      white-space: nowrap;
      font-size: 13px;
    }

    .hs-l-i {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      display: grid;
      place-items: center;
      font-size: 18px;
      background: rgba(var(--a2-rgb), .15);
    }

    .hs-lgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .hs-lcard {
      flex-direction: column;
      align-items: stretch;
    }

    .hs-lcard p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.8;
    }

    .hs-prog {
      height: 8px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a2l-rgb), .15);
      overflow: hidden;
      margin: 10px 0;
    }

    .hs-prog i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--ok));
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      transition: width .3s;
    }

    .hs-checks {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hs-checks label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 9px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      cursor: pointer;
      line-height: 1.75;
    }

    .hs-checks input {
      width: 18px;
      height: 18px;
      margin-top: 4px;
      accent-color: var(--ok);
      flex: none;
    }

    .hs-checks input:checked+span {
      opacity: .6;
      text-decoration: line-through;
    }

    .hs-sortcard {
      padding: 18px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(var(--a2-rgb), .08);
      margin: 8px 0 12px;
    }

    .hs-sortcard.ok {
      border-color: var(--ok);
      background: rgba(52, 211, 153, .1);
    }

    .hs-sortcard.bad {
      border-color: var(--bad);
      background: rgba(251, 113, 133, .1);
    }

    .hs-opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0;
    }

    .hs-opts.two {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    .hs-opt {
      text-align: start;
      padding: 10px 14px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      color: var(--text);
      font: 600 14px var(--font-main);
      cursor: pointer;
    }

    .hs-opt:hover:not(:disabled) {
      border-color: var(--cyan);
    }

    .hs-opt.right {
      border-color: var(--ok);
      background: rgba(52, 211, 153, .14);
    }

    .hs-opt.wrong {
      border-color: var(--bad);
      background: rgba(251, 113, 133, .12);
    }

    .hs-q {
      font-weight: 800;
      font-size: 15px;
      margin: 4px 0;
    }

    .hs-fb {
      padding: 10px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.8;
    }

    .hs-fb.ok {
      background: rgba(52, 211, 153, .12);
      border: 1px solid rgba(52, 211, 153, .5);
    }

    .hs-fb.bad {
      background: rgba(251, 113, 133, .1);
      border: 1px solid rgba(251, 113, 133, .5);
    }

    .hs-match {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      margin-bottom: 6px;
    }

    .hs-match small {
      grid-column: 1 / -1;
      color: var(--muted);
    }

    .hs-match.ok {
      border-color: var(--ok);
    }

    .hs-match.bad {
      border-color: var(--bad);
    }

    .hs-cwc p {
      margin: 6px 0 0;
      font-size: 13.5px;

      gap: 10px;
      padding: 14px 16px;

    .hs-chat-h small {

    .hs-msg {

    }

    .hs-msg.user {
      justify-content: flex-start;
    }

    .hs-msg.bot {
      justify-content: flex-end;
    }

    .hs-bub {
      max-width: 82%;

      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));

      font-size: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
    }

      background: linear-gradient(135deg, rgba(var(--a2-rgb), .35), rgba(var(--a3-rgb), .25));
      border-color: transparent;

    .hs-bub p {
      margin: 0 0 6px;

    .hs-bub ul {
      margin: 4px 0;

    .hs-chat-f {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 0 16px 14px;
    }

    .hs-chat-f .hs-ta {
      min-height: 52px;

    }

    .hs-chat>.hs-muted {

    .hs-toast {
      position: fixed;

      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 30px);

      transition: .3s;
      padding: 12px 18px;

        padding: 6px

    .ns {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 22px 30px
    }

    .ns-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px
    }

    .ns h2 {
      font: 900 clamp(24px, 4vw, 38px) var(--font-mono)
    }

    .ns-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      background: var(--card-bg);
      backdrop-filter: blur(10px)
    }

    .ns-tools button {
      font: 600 13px var(--font-main);
      color: var(--text);
      background: none;
      border: 1px solid transparent;
      border-radius: min(calc(9px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 7px 11px;
      cursor: pointer;
      transition: .2s
    }

    .ns-tools button:hover {
      background: rgba(var(--a2-rgb), .18)
    }

    .ns-tools button.on {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .12);
      box-shadow: 0 0 16px rgba(var(--a1-rgb), .3)
    }

    .ns-tools i {
      width: 1px;
      background: var(--border);
      margin: 2px 4px
    }

    .cd {
      display: inline-block;
      width: 22px;
      height: 5px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle
    }

    .ns-main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 14px
    }

    .ns-canvas {
      position: relative;
      border: 1px solid var(--border);
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      overflow: hidden;
      background: var(--card-bg);
      box-shadow: 0 20px 70px rgba(var(--a2-rgb), .25)
    }

    #ns-svg {
      display: block;
      width: 100%;
      height: min(72vh, 680px);
      min-height: 380px;
      touch-action: none;
      background-image: radial-gradient(rgba(var(--a2l-rgb), .25) 1px, transparent 1px);
      background-size: 24px 24px
    }

    .ns-hint {
      position: absolute;
      left: 12px;
      bottom: 10px;
      font: 600 12px var(--font-mono);
      color: var(--cyan);
      background: rgba(var(--bg-rgb), .65);
      padding: 5px 12px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      pointer-events: none
    }

    .ns-cl {
      stroke-width: 3.5;
      stroke-linecap: round;
      opacity: .9
    }

    .ns-cl.m {
      stroke-width: 2.5;
      stroke-dasharray: 2 7
    }

    .ns-cl.w {
      stroke-width: 2.5;
      stroke-dasharray: 7 6;
      animation: ns-flow 1s linear infinite
    }

    .ns-cl.x {
      stroke-dasharray: 3 8;
      opacity: .5
    }

    @keyframes ns-flow {
      to {
        stroke-dashoffset: -13
      }
    }

    .ns-hit {
      stroke: transparent;
      stroke-width: 18;
      cursor: pointer
    }

    .ns-ip {
      font: 600 10px var(--font-mono);
      fill: var(--muted);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 3px
    }

    .ns-pt {
      font: 600 9px var(--font-mono);
      fill: var(--a2l);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 3px
    }

    .ns-dev {
      cursor: grab
    }

    .ns-dev rect {
      fill: var(--card-bg);
      stroke: var(--purple);
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(var(--a2-rgb), .6))
    }

    .ns-dev.sel rect {
      stroke: var(--cyan);
      filter: drop-shadow(0 0 12px var(--cyan))
    }

    .ns-dev.from rect {
      stroke: var(--pink)
    }

    .ns-dev.bad rect {
      stroke: var(--bad);
      filter: drop-shadow(0 0 14px var(--bad))
    }

    .ns-dev.pulse rect {
      animation: ns-pulse .5s
    }

    @keyframes ns-pulse {
      50% {
        stroke: var(--ok);
        stroke-width: 5
      }
    }

    .ns-ico {
      font-size: 30px
    }

    .ns-nm {
      font: 700 13px var(--font-mono);
      fill: var(--text)
    }

    .ns-side {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .ns-box {
      border: 1px solid var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      background: var(--card-bg);
      padding: 14px;
      backdrop-filter: blur(10px)
    }

    .ns input,
    .ns textarea,
    .ns select {
      width: 100%;
      font: 500 13px var(--font-mono);
      color: var(--text);
      background: rgba(0, 0, 0, .25);
      border: 1px solid var(--border);
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 7px 9px;
      outline: 0;
      direction: ltr
    }

    .ns input:focus,
    .ns textarea:focus,
    .ns select:focus {
      border-color: var(--cyan)
    }

    .ns select {
      width: 42%;
      flex: none
    }

    .ns h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .ns h3 small {
      color: var(--muted);
      font: 600 11px var(--font-mono);

    }

    .ns-if>div {
      display: flex;
      gap: 6px
    }

    .ns-if input.m {

    }

    .ns-l,

      margin: 8px 0 3px;

      color: var(--muted)
    }

    .ns-mut {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7
    }

    .ns-go {
      width: 100%;
      margin-top: 10px;
      font: 700 14px var(--font-main);
      color: #fff;
      border: 0;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 10px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      box-shadow: 0 8px 28px rgba(var(--a2-rgb), .4);
      transition: .2s
    }

    .ns-go:hover {
      transform: translateY(-2px)
    }

    #ns-log {
      max-height: 150px;
      overflow: auto;
      font: 500 12px/1.6 var(--font-mono)
    }

    #ns-log div {
      padding: 4px 0;
      border-bottom: 1px solid var(--border)
    }

    #ns-log .ok,
    #ns-term .ok {
      color: var(--ok)
    }

    #ns-log .bad,
    #ns-term .bad {

    #ns-term {

      background: #02020a;

      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px)) min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px)) 0 0;

      font: 500 12px/1.5 var(--font-mono);

    .ns-tin {

      background: #02020a;

    $ {
      styles
    }

    /* ===== لمسة التصميم الاحترافي: البنية التحتية لتكنولوجيا المعلومات ===== */
    ::selection {
      background: rgba(var(--a1-rgb), .35)
    }

    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: var(--a2) transparent
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--a2), var(--a1));
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px))
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .5;
      background-image: linear-gradient(rgba(var(--a2l-rgb), .07) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--a2l-rgb), .07) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 25%, transparent 75%);
      mask-image: radial-gradient(ellipse at 50% 30%, #000 25%, transparent 75%);
      animation: alx-grid 40s linear infinite
    }

    @keyframes alx-grid {
      to {
        background-position: 44px 44px, 44px 44px
      }
    }

    body>nav {
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      box-shadow: 0 1px 0 rgba(var(--a1-rgb), .28), 0 10px 34px rgba(0, 0, 0, .35)
    }

    .tab {
      transition: background .25s, color .25s, box-shadow .25s, transform .2s
    }

    .tab:hover {
      transform: translateY(-1px)
    }

    .tab.on {

    /* الستيكرات */

      animation: alx-bob var(--d, 6s) ease-in-out var(--dl, 0s) infinite
    }

    .stk svg {
      width: 100%;
      height: 100%;
      display: block
    }

    @keyframes alx-bob {

    /* ===== هوية الشعار + تهدئة الزخرفة ===== */

    .alx-word b {
      font-weight: 700;
      background: linear-gradient(90deg, var(--a1), var(--a2));
      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent

    .alx-mark {
      display: block;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(var(--a1-rgb), .45)) drop-shadow(0 0 18px rgba(var(--a2-rgb), .35));
      transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), filter .3s

    }

    .cover-brand::before {
      content: "";

      }
    }

    .cover-mark {
      position: relative;

    @keyframes alx-float {

    }

    @keyframes alx-rise {

        transform: translateY(18px) scale(.92)

      to {

        transform: none
      }
    }

      min-height: 0;
      position: relative;
      background: rgba(var(--ink-rgb), .6);
      background: radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--ta) 26%, transparent), transparent 52%), radial-gradient(circle at 92% 92%, color-mix(in srgb, var(--tb) 22%, transparent), transparent 48%), rgba(var(--ink-rgb), .6)
    }

    .sx-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: rgba(var(--ink-rgb), .5)
    }

    .sx-th {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, color-mix(in srgb, var(--ta) 22%, transparent), color-mix(in srgb, var(--tb) 14%, transparent));
      flex: none
    }

    .sx-thu {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
      color: inherit;
      text-decoration: none
    }

    .sx-thn {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1
    }

    .sx-thn b {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sx-thn small {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sx-tools {
      display: flex;
      gap: 6px
    }

    .sx-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative
    }

    /* الرسائل */
    .sx-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth
    }

    .sx-msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 100%
    }

    .sx-msg.mine {
      flex-direction: row
    }

    .sx-msg.theirs {
      flex-direction: row-reverse;
      justify-content: flex-end
    }

    .sx-msg.mine {
      justify-content: flex-start
    }

    .sx-msg.theirs {
      justify-content: flex-start
    }

    .sx-bub {
      max-width: min(78%, 520px);
      padding: 8px 12px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      line-height: 1.7;
      word-break: break-word;
      position: relative;
      font-size: 14.5px
    }

    .sx-msg.mine .sx-bub {
      background: linear-gradient(135deg, var(--ta), var(--tb));
      color: #fff;
      border-end-end-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25)
    }

    .sx-msg.theirs .sx-bub {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(var(--a2l-rgb), .22);
      border: 1px solid color-mix(in srgb, var(--ta) 38%, transparent);
      border-end-start-radius: 4px
    }

    .sx-bub a {
      color: inherit;
      text-decoration: underline
    }

    .sx-who {
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 2px;
      cursor: pointer
    }

    .sx-ava {
      cursor: pointer
    }

    .sx-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      font-size: 10.5px;
      opacity: .7;
      margin-top: 2px
    }

    .sx-del {
      background: none;
      border: 0;
      color: inherit;
      cursor: pointer;
      opacity: 0;
      font-size: 12px;
      padding: 0;
      transition: opacity .15s
    }

    .sx-bub:hover .sx-del {
      opacity: .9
    }

    .sx-day {
      display: flex;
      justify-content: center;
      margin: 10px 0 4px
    }

    .sx-day span {
      font-size: 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, .06);
      padding: 2px 12px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px))
    }

    .sx-hello {
      margin: auto;
      color: var(--muted);
      text-align: center;
      padding: 30px 10px
    }

    .sx-more {
      align-self: center;
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 5px 14px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      margin-bottom: 6px
    }

    .sx-pending {
      padding: 6px 16px;
      font-size: 12px;
      color: var(--cyan);
      border-top: 1px solid var(--border)
    }

    .sx-ld {
      opacity: .7;
      font-size: 12px
    }

    .sx-img img {
      display: block;
      max-width: 100%;
      max-height: 300px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      cursor: zoom-in;
      margin-bottom: 4px
    }

    .sx-vid video {
      display: block;
      max-width: 100%;
      max-height: 320px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      margin-bottom: 4px;
      background: #000
    }

    .sx-aud audio {
      display: block;
      max-width: 100%;
      margin-bottom: 4px
    }

    .sx-fl {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(0, 0, 0, .25);
      text-decoration: none !important;
      color: inherit
    }

    .sx-fi {
      font-size: 24px
    }

    .sx-fn {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0
    }

    .sx-fn b {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sx-fn small {
      opacity: .75
    }

    .sx-short {
      display: flex;
      gap: 10px;
      align-items: stretch;
      padding: 6px;
      margin-bottom: 4px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(0, 0, 0, .28);
      min-width: 240px
    }

    .sx-sth {
      width: 74px;
      min-height: 96px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(160deg, var(--a2d), #be185d) center/cover;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none
    }

    .sx-sth span {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .55);
      display: grid;
      place-items: center;
      font-size: 14px
    }

    .sx-sti {
      display: flex;
      flex-direction: column;
      gap: 3px;
      justify-content: center;
      min-width: 0
    }

    .sx-sti b {
      font-size: 13.5px
    }

    .sx-sti small {
      opacity: .8
    }

    .sx-mini {
      border: 0;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 4px 11px;
      font: 700 12px var(--font-main);
      color: #fff;
      cursor: pointer;
      background: linear-gradient(90deg, var(--purple), var(--cyan))
    }

    .sx-mini.ghost {
      background: none;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    /* الكتابة */
    .sx-comp {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, .2);
      flex: none
    }

    .sx-ta {
      flex: 1;
      resize: none;
      font: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 9px 13px;
      outline: none;
      max-height: 140px;
      line-height: 1.6
    }

    .sx-ta:focus {
      border-color: var(--ta, var(--cyan));
      box-shadow: 0 0 0 3px rgba(var(--a1-rgb), .12)
    }

    .sx-send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      flex: none;
      background: linear-gradient(135deg, var(--ta), var(--tb));
      transition: transform .15s
    }

    .sx-send:hover {
      transform: scale(1.08) rotate(-8deg)
    }

    .sx-emo {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, .28)
    }

    .sx-emo[hidden] {
      display: none
    }

    .sx-emo button {
      background: none;
      border: 0;
      font-size: 22px;
      cursor: pointer;
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 2px 5px
    }

    .sx-emo button:hover {
      background: rgba(255, 255, 255, .12)
    }

    /* السيرفرات */
    .sx-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      overflow-y: auto;
      background: rgba(0, 0, 0, .35);
      border-inline-end: 1px solid var(--border)
    }

    .sx-sv {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 22px;
      overflow: hidden;
      flex: none;
      background: var(--c, var(--a2));
      transition: border-radius .2s, transform .2s;
      opacity: .9
    }

    .sx-sv img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .sx-sv b {
      font-weight: 400
    }

    .sx-sv:hover {
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      transform: translateY(-1px);
      opacity: 1
    }

    .sx-sv.on {
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      opacity: 1;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c, var(--a2))
    }

    .sx-sv.add {
      background: rgba(52, 211, 153, .15);
      color: var(--ok);
      font-size: 26px;
      border: 1px dashed var(--ok)
    }

    .sx-pip {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--pink);
      border: 2px solid var(--bg)
    }

    .sx-chans,
    .sx-mem {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: rgba(255, 255, 255, .025)
    }

    .sx-chans {
      border-inline-end: 1px solid var(--border)
    }

    .sx-mem {
      border-inline-start: 1px solid var(--border)
    }

    .sx-chh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: none;
      color: var(--text);
      font: 700 15px var(--font-main);
      cursor: pointer;
      text-align: right;
      flex: none
    }

    .sx-chh:hover {
      background: rgba(255, 255, 255, .05)
    }

    .sx-chn {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sx-chs {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px
    }

    .sx-cat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6px 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted)
    }

    .sx-chr {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .sx-ch {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 0;
      border-radius: min(calc(9px * var(--xrk, .7)), var(--xrmax, 999px));
      background: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      text-align: right;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sx-ch:hover {
      background: rgba(255, 255, 255, .07);
      color: var(--text)
    }

    .sx-ch.on {
      background: rgba(var(--a2-rgb), .3);
      color: #fff
    }

    .sx-ch.unread {
      color: #fff;
      font-weight: 700
    }

    .sx-ch.live {
      color: var(--ok)
    }

    .sx-cog {
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 3px 6px;
      border-radius: min(calc(7px * var(--xrk, .7)), var(--xrmax, 999px))
    }

    .sx-cog:hover {
      background: rgba(255, 255, 255, .1);
      color: var(--text)
    }

    .sx-vcl {
      padding: 0 26px 4px
    }

    .sx-vcu {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      padding: 2px 0;
      color: var(--text);
      cursor: pointer
    }

    .sx-meb {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, .25);
      flex: none
    }

    .sx-memh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 12px 8px;
      border-bottom: 1px solid var(--border);
      flex: none
    }

    .sx-mrow {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 6px 8px;
      border: 0;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: right
    }

    .sx-mrow:hover {
      background: rgba(255, 255, 255, .07)
    }

    /* النوافذ */
    .sx-ov {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(2, 1, 14, .72);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: sx-in .15s ease-out
    }

    @keyframes sx-in {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .sx-modal {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow: auto;
      background: var(--ink);
      border: 1px solid var(--border);
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .6);
      color: var(--text);
      font-family: var(--font-main)
    }

    .sx-modal.wide {
      max-width: 760px
    }

    .sx-mh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 17px
    }

    .sx-x {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: min(calc(9px * var(--xrk, .7)), var(--xrmax, 999px))
    }

    .sx-x:hover {
      background: rgba(255, 255, 255, .1);
      color: var(--text)
    }

    .sx-ul {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 50vh;
      overflow-y: auto;
      margin-top: 10px
    }

    .sx-urow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 0;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: right
    }

    .sx-urow:hover {
      background: rgba(255, 255, 255, .08)
    }

    .sx-urow.done {
      opacity: .55;
      cursor: default
    }

    .sx-opts {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .sx-opt {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .04);
      color: var(--text);
      font: 600 14px var(--font-main);
      cursor: pointer;
      text-align: right
    }

    .sx-opt:hover {
      background: rgba(255, 255, 255, .1)
    }

    .sx-opt.bad {
      color: var(--bad);
      border-color: var(--bad)
    }

    .sx-mini-p {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px
    }

    .sx-themes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px
    }

    .sx-tsw {
      height: 64px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 2px solid transparent;
      color: #fff;
      font: 700 12px var(--font-main);
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 6px
    }

    .sx-tsw.on {
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .25)
    }

    .sx-tsw span {
      text-shadow: 0 1px 4px rgba(0, 0, 0, .6)
    }

    .sx-lb {
      text-align: center
    }

    .sx-lb img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px))
    }

    .sx-player {
      display: flex;
      justify-content: center;
      background: #000;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      overflow: hidden
    }

    .sx-player video {
      max-width: 100%;
      max-height: 70vh
    }

    .sx-player iframe {
      width: 100%;
      aspect-ratio: 9/16;
      max-height: 70vh;
      border: 0
    }

    .sx-sharev {
      padding: 10px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a2-rgb), .18);
      margin-bottom: 10px
    }

    .sx-drop {
      text-align: center;
      padding: 22px;
      border: 2px dashed var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      margin-bottom: 10px
    }

    #sx-vprev {
      width: 100%;
      max-height: 260px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: #000;
      margin-bottom: 10px
    }

    .sx-prog {
      height: 6px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      margin: 6px 0 10px
    }

    .sx-prog i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      animation: sx-prog 1.1s ease-in-out infinite alternate
    }

    @keyframes sx-prog {
      from {
        margin-inline-start: 0
      }

      to {
        margin-inline-start: 60%
      }
    }

    .sx-emg {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .sx-emg button {
      font-size: 24px;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 2px solid transparent;
      background: rgba(255, 255, 255, .06);
      cursor: pointer
    }

    .sx-emg button.on,
    .sx-emg button:hover {
      border-color: var(--cyan)
    }

    .sx-sw {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px
    }

    .sx-sw button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .3);
      cursor: pointer
    }

    .sx-cinp,
    .sx-col input[type=color] {
      width: 42px;
      height: 34px;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer
    }

    .sx-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted)
    }

    .sx-rd {
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: pointer
    }

    /* الملف الشخصي */
    .sx-pwrap {
      max-width: 640px;
      margin: 0 auto
    }

    .sx-pcard {
      background: var(--ink);
      border: 1px solid var(--border);
      border-radius: min(calc(20px * var(--xrk, .7)), var(--xrmax, 999px));
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .45), 0 0 0 1px color-mix(in srgb, var(--acc, var(--a1)) 30%, transparent)
    }

    .sx-banner {
      height: 130px;
      position: relative;

    /* زر إخفاء الشريط الجانبي وإرجاعه: يظهر فقط عندما يكون الشريط جانبياً (الوضع الجانبي أو المصغّر)،

    (function () {
      var hide = document.getElementById("nav-hide"), show = document.getElementById("nav-show");
      if (!hide || !show) return;
      var root = document.documentElement, body = document.body;
      var b = document.createElement("button");
      b.id = "x-side-tog"; b.type = "button"; b.setAttribute("data-no-i18n", "");
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
      body.appendChild(b);
      function en() {return root.getAttribute("lang") === "en" || root.dir === "ltr";}
      function label() {
        var hidden = body.classList.contains("nav-hidden");
        var t = hidden ? (en() ? "Show sidebar" : "إظهار الشريط الجانبي") : (en() ? "Hide sidebar" : "إخفاء الشريط الجانبي");
        b.title = t; b.setAttribute("aria-label", t); b.setAttribute("aria-expanded", hidden ? "false" : "true");
      }
      b.addEventListener("click", function () {
        (body.classList.contains("nav-hidden") ? show : hide).click();

        setTimeout(function () {window.dispatchEvent(new Event("resize"));}, 380);

      window.addEventListener("langchange", label);

      /* السهم يشير لاتجاه الحركة: للخارج عند الإخفاء، وللداخل عند الإظهار */
      html[dir=ltr] #x-side-tog svg {
        transform: scaleX(-1);
      }

      html[dir=rtl] body.nav-hidden #x-side-tog svg {
        transform: scaleX(-1);
      }

      html[dir=ltr] body.nav-hidden #x-side-tog svg {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      html.x-nav-side body,
      html.x-nav-side body>nav,
      html.x-nav-side #x-side-tog,
      html.x-nav-side #x-pres {
        transition: none !important;
      }
    }
  </style>
  <style>
    .it-store {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 2, 10, .72);
      backdrop-filter: blur(6px);
    }

    .it-store.on {
      display: flex;
      animation: fade-up .25s ease;
    }

    .store-panel {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 16px;
      border: 1px solid rgba(251, 191, 36, .45);
      border-radius: 18px;
      background: #0d1124;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
      color: #eef;
    }

    .st-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .st-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .st-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      background: rgba(255,255,255,.02);
    }

    .st-item .ic { font-size: 26px; }
    .st-item small { color: #a7b0d7; }
    .st-row { display:flex; justify-content:space-between; gap:8px; }
    .small-btn {
      border: 1px solid rgba(34,211,238,.35);
      background: rgba(34,211,238,.08);
      color: #fff;
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
    }

    .local-quiz-wrap {
      max-width: 980px;
      margin: 20px auto;
      padding: 18px;
      border: 1px solid rgba(34,211,238,.2);
      border-radius: 18px;
      background: rgba(7, 10, 22, .8);
    }

    .local-quiz-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .quiz-card {
      background: rgba(15,20,36,.82);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 18px;
      margin-top: 12px;
    }

    .quiz-question { font-size: 1.1rem; margin-bottom: 14px; }
    .quiz-options { display: grid; gap: 8px; }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: rgba(255,255,255,.02);
      color: #eef;
      cursor: pointer;
    }
    .quiz-option.correct { border-color: #34d399; background: rgba(52,211,153,.12); }
    .quiz-option.wrong { border-color: #f87171; background: rgba(248,113,113,.12); }
    .quiz-option:disabled { cursor: default; }
    .quiz-explanation {
      margin-top: 14px;
      padding: 12px 14px;
      border-left: 3px solid #22d3ee;
      background: rgba(34,211,238,.08);
      border-radius: 10px;
      color: #dfeaff;
    }
    .quiz-meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:#a7b0d7; }
  </style>
  <script>
    (() => {
      const buildLocalQuestions = () => {
        const topics = [
          { title: 'المادة', level: 'سهل', q: 'ما هي الوظيفة الأساسية للحاسوب في معالجة البيانات؟', opts: ['استقبال البيانات ومعالجتها وإعادة إنتاج النتائج', 'إغلاق البرامج تلقائياً', 'تبديل اللغة فقط', 'حفظ الإشارات فقط'], answer: 0, exp: 'الحاسوب يستقبل البيانات ويُعالجها ثم يعرض أو يرسل النتائج.' },
          { title: 'المادة', level: 'سهل', q: 'أي من الآتي يعتبر جهاز إدخال؟', opts: ['الماوس', 'الشاشة', 'المعالج', 'الطابعة'], answer: 0, exp: 'الماوس يدخل أوامر المستخدم إلى النظام.' },
          { title: 'المادة', level: 'سهل', q: 'ما الذي يميز الملف المضغوط؟', opts: ['أن حجمه يصبح أصغر غالباً', 'أنه لا يمكن فتحه', 'أنه لا يحتوي على بيانات', 'أنه دائمًا نوع PDF'], answer: 0, exp: 'الضغط يقلل حجم الملف لتخزينه أو إرساله بسهولة.' },
          { title: 'الشبكات', level: 'متوسط', q: 'ما معنى LAN؟', opts: ['شبكة محلية داخل موقع واحد', 'شبكة تخزين خارجية', 'منفذ صغير', 'نظام تشفير'], answer: 0, exp: 'LAN هي شبكة محلية تُستخدم عادة داخل المؤسسة أو المنزل.' },
          { title: 'الشبكات', level: 'متوسط', q: 'ما دور البروتوكول في الشبكات؟', opts: ['يحدد قواعد التواصل بين الأجهزة', 'يمنع الاتصال تماماً', 'يغير نوع المعالج', 'يخفض سعة التخزين'], answer: 0, exp: 'البروتوكول يضع قواعد تبادل البيانات بين الأجهزة.' },
          { title: 'الشبكات', level: 'متوسط', q: 'ما الفرق بين Wi‑Fi وBluetooth؟', opts: ['Wi‑Fi أقوى وأكثر مناسبة للشبكات المنزلية', 'Bluetooth أسرع من Wi‑Fi', 'Wi‑Fi لا يحتاج شبكة', 'Bluetooth يستخدم فقط في الطابعات'], answer: 0, exp: 'Wi‑Fi يُستخدم للشبكات والاتصال الشبكي، بينما Bluetooth أقرب للتوصيل القصير بين الأجهزة.' },
          { title: 'الأمن', level: 'متوسط', q: 'ما المقصود بـ Malware؟', opts: ['برمجيات ضارة قد تسرق أو تدمر البيانات', 'ملف نصي آمن', 'نوع من المعالجات', 'عنصر في الشبكة'], answer: 0, exp: 'البرمجيات الخبيثة تستخدم لإيذاء النظام أو سرقة البيانات.' },
          { title: 'الأمن', level: 'متوسط', q: 'ما الفائدة الأساسية للنسخ الاحتياطي؟', opts: ['استعادة البيانات عند الفقد أو الحذف', 'تسهيل تشغيل الألعاب', 'تسريع المعالج', 'إيقاف الإنترنت'], answer: 0, exp: 'النسخ الاحتياطي يحمي البيانات من الفقد أو الفشل.' },
          { title: 'البيانات', level: 'صعب', q: 'ما الفرق بين البيانات والملف؟', opts: ['البيانات هي المحتوى، والملف هو الحاوية التي تحفظه', 'البيانات لا يمكن حفظها', 'الملف هو نوع من المعالج', 'البيانات دائمًا صور فقط'], answer: 0, exp: 'الملف هو شكل من أشكال حفظ البيانات في جهاز الحاسوب.' },
          { title: 'البيانات', level: 'صعب', q: 'لماذا يُستخدم Codec؟', opts: ['لترميز وفك تشفير البيانات الصوتية أو المرئية', 'لإغلاق الأجهزة', 'منفذ USB فقط', 'لأغراض الطباعة'], answer: 0, exp: 'Codec يقوم بترميز البيانات وفك تشفيرها عند التشغيل أو النقل.' },
          { title: 'البرمجيات', level: 'سهل', q: 'ما هو نظام التشغيل؟', opts: ['برنامج يدير الموارد ويتيح استخدام الحاسوب', 'نوع من الملفات', 'لوحة مفاتيح', 'بطاقة رسومية'], answer: 0, exp: 'نظام التشغيل يوزع الموارد ويعمل كواجهة بين المستخدم والآلة.' },
          { title: 'البرمجيات', level: 'سهل', q: 'أي من الآتي مثال على تطبيق معالجة نصوص؟', opts: ['Word', 'Excel فقط', 'Bluetooth', 'Router'], answer: 0, exp: 'معالج النصوص يُستخدم لإنشاء وتحرير المستندات النصية.' },
          { title: 'البرمجيات', level: 'متوسط', q: 'ماذا يعني تحديث البرامج؟', opts: ['إضافة تحسينات أو إصلاحات أو أمان', 'حذف كل الملفات', 'تغيير شاشة الحاسوب', 'إيقاف الإنترنت'], answer: 0, exp: 'التحديثات تجلب تصحيحات وتحسينات للأمان والأداء.' },
          { title: 'الأجهزة', level: 'متوسط', q: 'ما دور RAM؟', opts: ['تخزين مؤقت للبيانات قيد الاستخدام', 'تخزين دائم للأفلام', 'بديل عن المعالج', 'قوة الطاقة'], answer: 0, exp: 'RAM يُستخدم لتخزين البيانات المؤقتة التي يحتاجها النظام فورياً.' },
          { title: 'الأجهزة', level: 'متوسط', q: 'ما المقصود بالـ SSD؟', opts: ['تخزين إلكتروني سريع مقارنة مع HDD', 'نوع من الشاشة', 'طريقة للاتصال بالإنترنت', 'بروتوكول أمن'], answer: 0, exp: 'SSD يوفر سرعة أعلى وأداء أفضل من HDD التقليدي.' },
          { title: 'الذكاء', level: 'صعب', q: 'ماذا يعني التمييز بين البيانات والمعلومة؟', opts: ['البيانات خام، والمعلومة هي البيانات بعد التفسير', 'هما الشيء نفسه', 'المعلومة لا تحتاج تحليل', 'البيانات لا تُستخدم في الحاسوب'], answer: 0, exp: 'بعد تنظيم البيانات وتحليلها تصبح معلومة ذات معنى.' },
          { title: 'الذكاء', level: 'صعب', q: 'لماذا نستخدم المرئيات أو القوائم في عرض المعلومات؟', opts: ['لأنها تجعل المعلومات أسهل للفهم والتمييز', 'لأنها تقلل سرعة الحاسوب', 'لأنها لا تحتاج تفسيراً', 'لأنها تمنع التخزين'], answer: 0, exp: 'التمثيل البصري يساعد في فهم العلاقات والمقارنات بسرعة.' },
          { title: 'الأمن', level: 'صعب', q: 'ما المقصود بالتحقق الثنائي؟', opts: ['إثبات هوية المستخدم بخطوتين بدل خطوة واحدة', 'تغيير كلمة المرور في كل مرة', 'لعبة إلكترونية', 'حذف الملفات'], answer: 0, exp: 'التحقق الثنائي يضيف طبقة إضافية من الأمان.' },
          { title: 'الموضوع', level: 'متوسط', q: 'أي من الآتي يعتبر وسيلة للتخزين المؤقت؟', opts: ['ذاكرة الوصول العشوائي RAM', 'الطابعة', 'الماوس', 'الشبكة'], answer: 0, exp: 'RAM تعمل كذاكرة مؤقتة بين المعالج والتخزين الطويل.' },
          { title: 'الموضوع', level: 'سهل', q: 'ما الذي يحدث عندما يخطئ المستخدم في الإجابة؟', opts: ['يُظهر النظام شرحاً يشرح السبب الصحيح', 'يُغلق التطبيق فوراً', 'يتم حذف السؤال', 'يتم تخزين نقطة صفر'], answer: 0, exp: 'الشرح يساعد المتعلم على فهم الخطأ وتصحيحه.' },
          { title: 'الموضوع', level: 'سهل', q: 'ما أفضل طريقة لاجتياز اختبار مراجعة سريع؟', opts: ['التركيز على الفهم وليس الحفظ فقط', 'تكرار الضغط على الزر', 'تجاهل الشرح', 'إغلاق التطبيق'], answer: 0, exp: 'الفهم الجيد يجعل الإجابات أسرع وأكثر دقة.' },
        ];
        return topics;
      };

      const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
      const roundSize = 15;

      const ensureQuizUI = () => {
        if (document.getElementById('local-quiz-app')) return;
        const quizWrap = document.createElement('section');
        quizWrap.id = 'local-quiz-app';
        quizWrap.className = 'local-quiz-wrap';
        quizWrap.innerHTML = `
          <div class="local-quiz-head">
            <div>
              <div class="tag">// LOCAL REVIEW · 15 QUESTIONS</div>
              <h2>اختبار المراجعة السريع</h2>
            </div>
            <div class="quiz-meta">
              <button class="small-btn" id="generate-quiz" type="button">✨ ابدأ جولة جديدة (15 سؤالًا)</button>
              <button class="small-btn" id="open-store" type="button">🛒 المتجر</button>
            </div>
          </div>
          <div id="quiz-status" class="quiz-meta"></div>
          <div id="quiz"></div>
        `;
        document.body.appendChild(quizWrap);
      };

      const ensureStoreUI = () => {
        if (document.getElementById('it-store')) return;
        const overlay = document.createElement('div');
        overlay.id = 'it-store';
        overlay.className = 'it-store';
        overlay.innerHTML = `
          <div class="store-panel" role="dialog" aria-modal="true">
            <div class="st-head">
              <b>🛒 متجر IT</b>
              <button class="small-btn" type="button" data-st="close" aria-label="إغلاق">✕</button>
            </div>
            <p>تكسب IT من كل إجابة صحيحة، وبهذه النقود تشتري أدوات في الاختبار.</p>
            <div class="st-grid">
              <div class="st-item"><span class="ic">💡</span><b>تلميح</b><small>يظهر خياراً إضافياً</small><div class="st-row"><span>🪙 15</span><span>لديك: 0</span></div><button class="small-btn" type="button" data-buy="hint">اشترِ</button></div>
              <div class="st-item"><span class="ic">✨</span><b>مضاعف</b><small>يضاعف مكافأة السؤال</small><div class="st-row"><span>🪙 20</span><span>لديك: 0</span></div><button class="small-btn" type="button" data-buy="double">اشترِ</button></div>
              <div class="st-item"><span class="ic">🛡️</span><b>درع</b><small>يحميك من سؤال واحد</small><div class="st-row"><span>🪙 25</span><span>لديك: 0</span></div><button class="small-btn" type="button" data-buy="shield">اشترِ</button></div>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', e => {
          if (e.target === overlay || e.target.closest('[data-st="close"]')) {
            overlay.classList.remove('on');
          }
        });
      };

      const updateStoreUI = () => {
        const overlay = document.getElementById('it-store');
        const state = window.__localQuizState || { it: 0, inventory: {} };
        if (!overlay) return;
        const head = overlay.querySelector('.st-head b');
        if (head) head.textContent = '🛒 متجر IT • ' + state.it + ' IT';
        const map = { hint: 15, double: 20, shield: 25 };
        overlay.querySelectorAll('.st-item').forEach(item => {
          const btn = item.querySelector('[data-buy]');
          const id = btn.dataset.buy;
          const row = item.querySelector('.st-row');
          const owned = state.inventory[id] || 0;
          if (row) {
            const ownEl = row.querySelector('span:last-child');
            if (ownEl) ownEl.textContent = 'لديك: ' + owned;
          }
          btn.disabled = state.it < map[id];
        });
      };

      const ensureQuizLogic = () => {
        const bank = buildLocalQuestions();
        const state = {
          it: 20,
          inventory: {},
          round: [],
          current: 0,
          score: 0,
          answered: false,
        };
        window.__localQuizState = state;

        const statusEl = () => document.getElementById('quiz-status');
        const quizEl = () => document.getElementById('quiz');

        const renderRound = () => {
          const q = state.round[state.current];
          const el = quizEl();
          if (!q || !el) return;
          const options = q.opts.map((option, index) => {
            return `<button class="quiz-option" data-index="${index}" type="button" ${state.answered ? 'disabled' : ''}>${String.fromCharCode(65 + index)}. ${option}</button>`;
          }).join('');

          el.innerHTML = `
            <div class="quiz-card">
              <div class="quiz-meta"><span>السؤال ${state.current + 1}/${state.round.length}</span><span>•</span><span>الموضوع: ${q.title}</span><span>•</span><span>الصعوبة: ${q.level}</span></div>
              <div class="quiz-question">${q.q}</div>
              <div class="quiz-options">${options}</div>
              ${state.answered ? `<div class="quiz-explanation">${q.exp}</div>` : ''}
            </div>
          `;

          el.querySelectorAll('.quiz-option').forEach(btn => {
            btn.addEventListener('click', () => {
              if (state.answered) return;
              const chosen = Number(btn.dataset.index);
              const correct = chosen === q.answer;
              state.answered = true;
              if (correct) {
                state.score += 1;
                state.it += 3;
              }
              const buttons = el.querySelectorAll('.quiz-option');
              buttons.forEach((btn2, idx) => {
                btn2.disabled = true;
                btn2.classList.toggle('correct', idx === q.answer);
                btn2.classList.toggle('wrong', idx === chosen && !correct);
              });
              const next = () => {
                state.current += 1;
                state.answered = false;
                if (state.current >= state.round.length) {
                  const pct = Math.round((state.score / state.round.length) * 100);
                  statusEl().textContent = `تمت الجولة: ${state.score}/${state.round.length} • نسبة النجاح ${pct}%`;
                  el.innerHTML = `<div class="quiz-card"><h3>انتهت الجولة</h3><p>النتيجة: ${state.score}/${state.round.length}</p><button class="small-btn" id="restart-quiz" type="button">ابدأ جولة جديدة</button></div>`;
                  const restart = document.getElementById('restart-quiz');
                  if (restart) restart.addEventListener('click', createRound);
                  return;
                }
                renderRound();
              };
              setTimeout(next, 1100);
            });
          });
        };

        const createRound = () => {
          const selected = shuffle(bank).slice(0, roundSize);
          state.round = selected;
          state.current = 0;
          state.score = 0;
          state.answered = false;
          if (statusEl()) statusEl().textContent = 'جولة جديدة جاهزة • 15 سؤالاً';
          renderRound();
          updateStoreUI();
        };

        const generateBtn = document.getElementById('generate-quiz');
        if (generateBtn) {
          generateBtn.addEventListener('click', createRound);
        }
        const storeTrigger = document.getElementById('open-store');
        if (storeTrigger) {
          storeTrigger.addEventListener('click', () => {
            const overlay = document.getElementById('it-store');
            if (overlay) {
              overlay.classList.add('on');
              updateStoreUI();
            }
          });
        }
        const overlay = document.getElementById('it-store');
        if (overlay) {
          overlay.addEventListener('click', e => {
            const buyBtn = e.target.closest('[data-buy]');
            if (!buyBtn) return;
            const id = buyBtn.dataset.buy;
            const priceMap = { hint: 15, double: 20, shield: 25 };
            const price = priceMap[id];
            if (!price || state.it < price) return;
            state.it -= price;
            state.inventory[id] = (state.inventory[id] || 0) + 1;
            updateStoreUI();
          });
        }
        createRound();
      };

      ensureQuizUI();
      ensureStoreUI();
      ensureQuizLogic();
    })();
  </script>
