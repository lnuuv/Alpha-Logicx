      background: linear-gradient(90deg, #22d3ee, #f43f8e);
    }

    .rl-time {
      position: absolute;
      z-index: 6;
      right: 14px;
      bottom: 7px;
      font: 700 10px var(--font-mono);
      opacity: .8;
    }

    .rl-hint {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: 84px;
      translate: -50% 0;
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      color: #fff;
      background: rgba(0, 0, 0, .7);
      transition: opacity .6s;
      pointer-events: none;
    }

    .rl-hint.off {
      opacity: 0;
    }

    .rl-toast {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 52px;
      translate: -50% -10px;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      background: rgba(124, 58, 237, .92);
      opacity: 0;
      transition: opacity .25s, translate .25s;
      pointer-events: none;
      white-space: nowrap;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rl-toast.on {
      opacity: 1;
      translate: -50% 0;
    }

    .rl-reel.paused *,
    .rl-reel.paused *::before {
      animation-play-state: paused !important;
    }

    @keyframes rl-pop {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.85);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes rl-scene {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes rl-cap {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes rl-float {
      50% {
        transform: translate(14px, -22px) scale(1.12);
      }
    }

    @keyframes rl-bounce {
      50% {
        transform: translateY(4px);
      }
    }

    @keyframes rl-glow {
      50% {
        text-shadow: 0 0 40px rgba(244, 63, 142, .9);
      }
    }

    @keyframes rl-blink {
      50% {
        opacity: .25;
      }
    }

    @keyframes rl-state {
      0% {
        opacity: 0;
        transform: scale(.6);
      }

      25% {
        opacity: 1;
        transform: scale(1.1);
      }

      100% {
        opacity: 0;
        transform: scale(1);
      }
    }

    @media (max-width: 700px) {
      .rl-navs {
        display: none;
      }

      .rl-phone {
        width: 100%;
        height: min(80vh, 680px);
        border-radius: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .rl-bg i,
      .rl-bigv,
      .rl-arrow,
      .rl-srv i {
        animation: none !important;
      }
    }

    /* فيديوهات يوتيوب الحقيقية داخل الريلز */
    .rl-video {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .rl-video>div,
    .rl-video iframe {
      width: 100%;
      height: 100%;
    }

    .rl-video iframe {
      border: 0;
      opacity: 0;
      transition: opacity .4s;
    }

    .rl-reel.vready .rl-video iframe {
      opacity: 1;
    }

    .rl-reel.real .rl-stage,
    .rl-reel.real .rl-cap {
      display: none;
    }

    .rl-reel.real.vready .rl-poster {
      opacity: 0;
    }

    .rl-reel.real.playing:not(.vready) .rl-poster {
      opacity: 1;
    }

    .rl-reel.real .rl-bottom {
      right: 0;
      left: 0;
      bottom: 0;
      padding: 70px 14px 24px 62px;
      background: linear-gradient(0deg, rgba(0, 0, 0, .85), transparent);
    }

    .rl-info-btn {
      pointer-events: auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0 8px;
      padding: 9px 16px;
      border: 0;
      border-radius: 99px;
      font: 800 13px var(--font-main);
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 0 18px rgba(219, 39, 119, .45);
      transition: transform .15s;
    }

    .rl-info-btn:hover {
      transform: translateY(-2px);
    }

    .rl-vmsg {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 42%;
      translate: -50% -50%;
      width: 78%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      text-align: center;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.7;
      background: rgba(0, 0, 0, .75);
      pointer-events: auto;
    }

    .rl-vmsg[hidden] {
      display: none;
    }

    .rl-vmsg small {
      opacity: .8;
    }

    .rl-vmsg a {
      color: #fff;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 99px;
      text-decoration: none;
      background: linear-gradient(135deg, #7c3aed, #db2777);
    }

    .rl-choose {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(5, 3, 15, .88);
      backdrop-filter: blur(4px);
    }

    .rl-choose-box {
      width: 100%;
      max-height: 100%;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #0e0a24;
      color: #fff;
    }

    .rl-choose-box>small {
      opacity: .75;
      line-height: 1.7;
    }

    .rl-choose-list {
      display: grid;
      gap: 8px;
    }

    .rl-choose-list button {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: start;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .05);
      color: #fff;
      font: 700 13.5px var(--font-main);
      cursor: pointer;
    }

    .rl-choose-list button:hover {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, .1);
    }

    .rl-choose-list em {
      font-style: normal;
      font-size: 11px;
      color: var(--cyan);
    }

    .rl-choose-x {
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: #fff;
      font: 700 13px var(--font-main);
    }

    details.book-section.rl-flash {
      animation: rl-flash 1.1s ease-in-out 3;
    }

    @keyframes rl-flash {
      50% {
        box-shadow: 0 0 0 3px var(--cyan), 0 0 36px rgba(34, 211, 238, .7);
      }
    }

    .rl-reel {
      background: #0b0b1a;
    }

    .rl-poster {
      background-size: cover;
      background-position: center;
    }

    .rl-poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 3, 15, .5), rgba(5, 3, 15, .88));
    }

    .rl-poster>* {
      position: relative;
    }

    .rl-vmsg .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .rl-vmsg button {
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: transparent;
      color: #fff;
      font: 700 13px var(--font-main);
    }

    .rl-spin {
      display: inline-block;
      font-size: 28px;
      animation: rl-spin 1.2s linear infinite;
    }

    @keyframes rl-spin {
      to {
        transform: rotate(360deg);
      }
    }

    #rl-back {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 22px;
      translate: -50% 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border-radius: 99px;
      background: rgba(14, 10, 36, .96);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 24px rgba(34, 211, 238, .4);
    }

    .rl-back-go {
      cursor: pointer;
      border: 0;
      border-radius: 99px;
      padding: 9px 18px;
      font: 800 13.5px var(--font-main);
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #db2777);
    }

    .rl-back-x {
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      color: #fff;
      background: rgba(255, 255, 255, .12);
    }

    /* مطابقة الاختصارات */
    .mt-board {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 14px;
    }

    .mt-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mt-item {
      font: 700 14px var(--font-main);
      color: var(--text);
      text-align: center;
      cursor: pointer;
      padding: 11px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
      transition: transform .2s, border-color .2s, background .2s, opacity .3s;
    }

    .mt-item.abbr {
      font-family: var(--font-mono);
      font-size: 16px;
      direction: ltr;
    }

    .mt-item:hover {
      border-color: var(--cyan);
      transform: translateX(-3px);
    }

    .mt-item.picked {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, .22);
      box-shadow: 0 0 16px rgba(34, 211, 238, .4);
    }

    .mt-item.done {
      opacity: .25;
      pointer-events: none;
      border-color: var(--ok);
      background: rgba(52, 211, 153, .15);
    }

    .mt-item.wrong {
      animation: shake .45s;
      border-color: var(--bad);
      background: rgba(251, 113, 133, .2);
    }

    /* محاكي الجدار الناري */
    .fw-rules {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .fw-rule {
      display: grid;
      gap: 1px;
      text-align: right;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 10px;
      font-family: var(--font-main);
      color: var(--text);
      border: 1px solid var(--border);
      transition: .2s;
    }

    .fw-rule b {
      font: 700 18px var(--font-mono);
      color: var(--cyan);
      direction: ltr;
      text-align: right;
    }

    .fw-rule span {
      font: 700 12px var(--font-mono);
      direction: ltr;
      text-align: right;
    }

    .fw-rule small {
      color: var(--muted);
      font-size: 12px;
    }

    .fw-rule em {
      font-style: normal;
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 3px;
    }

    .fw-rule.allow {
      background: rgba(52, 211, 153, .1);
      border-color: rgba(52, 211, 153, .5);
    }

    .fw-rule.block {
      background: rgba(251, 113, 133, .1);
      border-color: rgba(251, 113, 133, .5);
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .switch-row input {
      accent-color: var(--pink);
      width: 16px;
      height: 16px;
    }

    .fw-meters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 12px;
    }

    .fw-meters span {
      font-size: 13px;
    }

    .meter {
      height: 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
      margin-top: 4px;
    }

    .meter i {
      display: block;
      height: 100%;
      float: right;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--cyan), var(--ok));
      transition: width .5s;
    }

    .fw-lane {
      position: relative;
      height: 96px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: rgba(255, 255, 255, .03);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      direction: ltr;
    }

    .lane-end {
      font-size: 13px;
      font-weight: 700;
      z-index: 2;
    }

    .fw-wall {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 46px;
      margin-left: -23px;
      display: grid;
      place-items: center;
      font-size: 30px;
      background: rgba(244, 63, 142, .18);
      border-left: 2px solid var(--pink);
      border-right: 2px solid var(--pink);
      z-index: 1;
    }

    #fw-packets {
      position: absolute;
      inset: 0;
    }

    .pkt {
      position: absolute;
      top: 50%;
      left: 6%;
      margin-top: -20px;
      font-size: 28px;
      text-align: center;
      line-height: 1;
    }

    .pkt small {
      display: block;
      font: 700 11px var(--font-mono);
    }

    .pkt.bad {
      filter: hue-rotate(300deg) drop-shadow(0 0 6px #f43f8e);
    }

    .pkt.pass {
      animation: pkt-pass 1.1s ease-in-out forwards;
    }

    .pkt.stop {
      animation: pkt-stop 1.1s ease-in forwards;
    }

    @keyframes pkt-pass {
      to {
        left: 88%;
      }
    }

    @keyframes pkt-stop {
      0% {
        left: 6%;
        opacity: 1;
      }

      55% {
        left: 40%;
        opacity: 1;
        transform: scale(1);
      }

      100% {
        left: 41%;
        opacity: 0;
        transform: scale(2) rotate(25deg);
      }
    }

    .fw-log {
      margin-top: 12px;
      max-height: 230px;
      overflow: auto;
      font-size: 13.5px;
    }

    .fw-log div {
      padding: 6px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      border-right: 3px solid;
      line-height: 1.7;
      animation: rise .3s both;
    }

    .fw-log .good {
      border-color: var(--ok);
      background: rgba(52, 211, 153, .08);
    }

    .fw-log .bad {
      border-color: var(--bad);
      background: rgba(251, 113, 133, .09);
    }

    /* ركّب حاسوبك */
    .pc-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }

    .pc-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid rgba(52, 211, 153, .5);
      background: linear-gradient(160deg, rgba(52, 211, 153, .12), rgba(8, 6, 28, .4));
      align-content: start;
    }

    .pc-slot {
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 12px 6px;
      min-height: 84px;
      border-radius: 10px;
      border: 2px dashed var(--border);
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .pc-slot span {
      font-size: 26px;
      opacity: .5;
    }

    .pc-slot small {
      font-size: 12px;
      color: var(--muted);
    }

    .pc-slot:hover {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, .08);
    }

    .pc-slot.filled {
      border-style: solid;
      border-color: var(--ok);
      background: rgba(52, 211, 153, .15);
    }

    .pc-slot.filled span {
      opacity: 1;
    }

    .pc-slot.filled small {
      color: var(--text);
      font-weight: 700;
    }

    .pc-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }

    .pc-part {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 700 13px var(--font-main);
      color: var(--text);
      cursor: grab;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .05);
      transition: .2s;
    }

    .pc-part span {
      font-size: 22px;
    }

    .pc-part:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    .pc-part.sel {
      border-color: var(--pink);
      background: rgba(244, 63, 142, .18);
      box-shadow: 0 0 14px rgba(244, 63, 142, .4);
    }

    .boot-console {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #05050f;
      border: 1px solid var(--border);
      font: 600 13px/1.9 var(--font-mono);
      color: #86efac;
      direction: rtl;
      text-align: right;
    }

    .boot-console div {
      animation: rise .25s both;
    }

    #pc-boot:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    [data-theme="light"] .world-card {
      background: rgba(255, 255, 255, .95);
    }

    [data-theme="light"] .mt-item,
    [data-theme="light"] .pc-part,
    [data-theme="light"] .game-tabs button {
      background: #fff;
    }

    [data-theme="light"] .boot-console {
      background: #0b1020;
    }

    @media (max-width: 860px) {

      .mt-board,
      .pc-layout,
      .fw-meters {
        grid-template-columns: 1fr;
      }

      .mt-board {
        grid-template-columns: 1fr 1.6fr;
      }
    }

    /* ================================================== */
    /* ===== صفحة السحابة ولعبة اكتشف الخطأ ===== */
    /* ================================================== */

    .fw-grid.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .fw-card.mix {
      border-color: rgba(251, 191, 36, .7);
      background: rgba(251, 191, 36, .07);
    }

    .stack-table th,
    .stack-table td {
      text-align: center;
    }

    .stack-table tbody th {
      text-align: right;
      background: rgba(124, 58, 237, .15);
    }

    .stack-table td.you {
      background: rgba(244, 63, 142, .2);
      color: #fda4c8;
      font-weight: 700;
    }

    .stack-table td.prov {
      background: rgba(34, 211, 238, .14);
      color: #67e8f9;
      font-weight: 700;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .calc-field {
      display: grid;
      gap: 4px;
      font-size: 13px;
    }

    .calc-field input {
      font: 700 15px var(--font-mono);
      color: var(--text);
      direction: ltr;
      text-align: right;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .05);
      outline: none;
    }

    .calc-field input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(34, 211, 238, .3);
    }

    .cost-row {
      display: grid;
      grid-template-columns: 80px 1fr 90px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
      font-size: 14px;
    }

    .cost-track {
      height: 16px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }

    .cost-track i {
      display: block;
      height: 100%;
      float: right;
      border-radius: 9px;
      transition: width .5s;
    }

    .cost-track i.cloud {
      background: linear-gradient(90deg, #0891b2, #22d3ee);
    }

    .cost-track i.local {
      background: linear-gradient(90deg, #db2777, #f472b6);
    }

    .cost-row b {
      font-family: var(--font-mono);
      direction: ltr;
      text-align: left;
    }

    .dbg-symptom {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(251, 191, 36, .5);
      background: linear-gradient(90deg, rgba(251, 191, 36, .12), transparent);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.9;
    }

    .dbg-symptom small {
      display: block;
      font-size: 11.5px;
      color: #fbbf24;
    }

    .dbg-options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
    }

    .dbg-opt {
      font: 600 14px var(--font-main);
      color: var(--text);
      text-align: right;
      cursor: pointer;
      line-height: 1.7;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
      transition: .2s;
    }

    .dbg-opt:hover:not(:disabled) {
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    .dbg-opt.right {
      border-color: var(--ok);
      background: rgba(52, 211, 153, .18);
    }

    .dbg-opt.wrong {
      border-color: var(--bad);
      background: rgba(251, 113, 133, .18);
      animation: shake .45s;
    }

    .dbg-opt:disabled:not(.right):not(.wrong) {
      opacity: .5;
    }

    .dbg-why {
      margin: 14px 0;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.95;
      font-size: 14px;
      border-right: 3px solid;
      animation: rise .3s both;
    }

    .dbg-why.good {
      border-color: var(--ok);
      background: rgba(52, 211, 153, .09);
    }

    .dbg-why.bad {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, .09);
    }

    .dbg-why b {
      display: block;
    }

    /* الشريط العلوي: التبويبات تتمرر أفقياً إذا زادت عن العرض */
    .tabs {
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: none;
      white-space: nowrap;
    }

    [data-theme="light"] .stack-table td.you {
      color: #9d174d;
    }

    [data-theme="light"] .stack-table td.prov {
      color: #0e7490;
    }

    [data-theme="light"] .calc-field input,
    [data-theme="light"] .dbg-opt {
      background: #fff;
      color: var(--text);
    }

    @media (max-width: 860px) {
      .fw-grid.three {
        grid-template-columns: 1fr;
      }

      .cost-row {
        grid-template-columns: 64px 1fr 76px;
      }
    }

    /* ===== قائمة «المزيد» في الشريط العلوي ===== */
    .tabs {
      overflow: visible;
    }

    .more-btn {
      font: 600 12.5px var(--font-main);
      color: var(--muted);
      cursor: pointer;
      padding: 5px 13px;
      border: 0;
      border-radius: 99px;
      background: none;
      white-space: nowrap;
      transition: .2s;
    }

    .more-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .06);
    }

    .more-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      box-shadow: 0 4px 18px rgba(124, 58, 237, .5);
    }

    .more-menu {
      width: 220px;
      left: auto;
      right: 0;
    }

    .menu-item.on {
      background: rgba(124, 58, 237, .28);
    }

    /* ===== صفحة الاتصالات ===== */
    .fw-grid.four {
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    }

    .topology {
      width: 100%;
      height: auto;
      max-height: 150px;
      margin-bottom: 6px;
    }

    .tp-line {
      stroke: rgba(34, 211, 238, .7);
      stroke-width: 1.6;
    }

    .tp-node {
      fill: #0c0926;
      stroke: var(--cyan);
      stroke-width: 2;
    }

    .tp-hub {
      fill: rgba(244, 63, 142, .3);
      stroke: var(--pink);
      stroke-width: 2;
    }

    .tp-text {
      fill: var(--text);
      font: 700 8px var(--font-mono);
    }

    .table-scroll {
      overflow-x: auto;
    }

    .inline-pair {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 6px;
    }

    .inline-pair select,
    .calc-field select {
      font: 700 14px var(--font-main);
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }

    .inline-pair select option {
      background: #14103a;
      color: #fff;
    }

    .ip-bits {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      direction: ltr;
    }

    .ip-bits div {
      text-align: center;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
    }

    .ip-bits b {
      display: block;
      font: 700 18px var(--font-mono);
      color: var(--cyan);
    }

    .ip-bits code {
      font: 600 13px var(--font-mono);
      letter-spacing: .08em;
      color: var(--pink);
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .step-card {
      position: relative;
      padding: 12px 14px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
    }

    .step-card em {
      position: absolute;
      top: 8px;
      left: 10px;
      font: 700 12px var(--font-mono);
      font-style: normal;
      color: var(--pink);
    }

    .step-card span {
      font-size: 24px;
    }

    .step-card b {
      display: block;
      color: var(--cyan);
      margin: 2px 0;
    }

    .step-card p {
      font-size: 13px;
      line-height: 1.85;
      color: var(--muted);
    }

    .cmp-table code {
      font-family: var(--font-mono);
      color: var(--pink);
      direction: ltr;
    }

    [data-theme="light"] .tp-node {
      fill: #fff;
    }

    [data-theme="light"] .step-card,
    [data-theme="light"] .ip-bits div {
      background: #fff;
    }

    /* ===== معمل السحابة: التخزين + التشفير (تصميم رسمي مبسّط) ===== */
    .cl,
    .cl-tabs {
      --cl-surface: rgba(255, 255, 255, .035);
      --cl-surface-2: rgba(255, 255, 255, .07);
      --cl-line: var(--border);
      --cl-accent: var(--cyan);
      --cl-accent-soft: rgba(34, 211, 238, .11);
      --cl-accent-line: rgba(34, 211, 238, .45);
      --cl-ok: var(--ok);
      --cl-warn: #fbbf24;
      --cl-bad: var(--bad);
      --cl-dir: rtl;
    }

    html[dir=ltr] .cl,
    html[dir=ltr] .cl-tabs {
      --cl-dir: ltr;
    }

    :root[data-theme="light"] .cl,
    :root[data-theme="light"] .cl-tabs {
      --cl-surface: rgba(80, 60, 180, .045);
      --cl-surface-2: rgba(80, 60, 180, .09);
      --cl-accent-soft: rgba(8, 145, 178, .10);
      --cl-accent-line: rgba(8, 145, 178, .5);
      --cl-ok: #047857;
      --cl-warn: #b45309;
      --cl-bad: #be123c;
    }

    /* التبويبات */
    .cl-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      margin: 4px 0 16px;
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      background: var(--card-bg);
    }

    .cl-tab {
      font: 700 13.5px var(--font-main);
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: 7px;
      padding: 8px 20px;
      cursor: pointer;
      transition: .15s;
    }

    .cl-tab:hover {
      color: var(--text);
    }

    .cl-tab.on {
      color: var(--text);
      background: var(--cl-accent-soft);
      box-shadow: inset 0 -2px 0 var(--cl-accent);
    }

    .cl-tab:focus-visible,
    .cl-btn:focus-visible,
    .cl-server:focus-visible,
    .cx-seg button:focus-visible,
    .cx-chip:focus-visible,
    .cl-link-btn:focus-visible {
      outline: 2px solid var(--cl-accent);
      outline-offset: 2px;
    }

    /* الحاوية العامة */
    .cl {
      position: relative;
      margin-bottom: 26px;
      padding: 20px;
      border: 1px solid var(--cl-line);
      border-radius: 12px;
      background: var(--card-bg);
    }

    .cl[hidden],
    [hidden].cl-root {
      display: none !important;
    }

    .cl,
    .cl>*,
    .cx-field,
    .cx-pane,
    .cl-panel,
    .cl-dc {
      min-width: 0;
    }

    .cl-fly {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9;
      overflow: hidden;
    }

    .cl-dot {
      position: absolute;
      top: -5px;
      left: -5px;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      outline: 1px solid rgba(255, 255, 255, .7);
    }

    .cl-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .cl-head h2 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .cl-head p {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.95;
      max-width: 72ch;
    }

    /* الأزرار والحقول */
    .cl-btn {
      font: 600 13px var(--font-main);
      color: var(--text);
      cursor: pointer;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--cl-line);
      background: var(--cl-surface);
      transition: .15s;
    }

    .cl-btn:hover:not(:disabled) {
      border-color: var(--cl-accent);
      background: var(--cl-accent-soft);
    }

    .cl-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .cl-btn.primary {
      color: #fff;
      border-color: transparent;
      background: #0e7490;
    }

    .cl-btn.primary:hover:not(:disabled) {
      background: #0891b2;
    }

    .cl-btn.danger:hover:not(:disabled) {
      border-color: var(--cl-bad);
      background: rgba(251, 113, 133, .12);
    }

    .cl-btn.sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .cl select,
    .cl textarea,
    .cl input[type=text] {
      font: 600 13.5px var(--font-main);
      color: var(--text);
      background: var(--cl-surface);
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      padding: 7px 10px;
      outline: none;
    }

    .cl select:focus,
    .cl textarea:focus,
    .cl input[type=text]:focus {
      border-color: var(--cl-accent);
    }

    .cl select option {
      background: #14103a;
      color: #fff;
    }

    .cl-link-btn {
      color: var(--cl-accent);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: 0;
      font: inherit;
      padding: 0;
    }

    .cl-hint {
      font-size: 12px;
      color: var(--muted);
    }

    /* --- تبسيط معمل التخزين للجميع --- */
    .cl .cl-explain {
      font-size: 14.5px;
      line-height: 2;
    }

    .cl .cl-explain small {
      color: var(--muted);
      font-size: 12.5px;
    }

    .cl .cl-steps small {
      font-size: 12.5px;
    }

    .cl .cl-steps b {
      font-size: 14.5px;
    }

    .cl-guide {
      margin-bottom: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--cl-accent-line);
      background: var(--cl-accent-soft);
    }

    .cl-guide-t {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .cl-guide ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .cl-guide li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--cl-surface);
      border: 1px solid var(--cl-line);
    }

    .cl-guide li>span {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 800 14px var(--font-mono);
      color: #04141a;
      background: var(--cl-accent);
    }

    .cl-guide li b {
      display: block;
      font-size: 14px;
    }

    .cl-guide li small {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    .cl-analogy,
    .cl-gloss {
      margin-bottom: 14px;
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      background: var(--cl-surface);
    }

    .cl-analogy summary,
    .cl-gloss summary {
      cursor: pointer;
      padding: 11px 14px;
      font-weight: 700;
      font-size: 14px;
    }

    .cl-analogy summary:hover,
    .cl-gloss summary:hover {
      color: var(--cl-accent);
    }

    .cl-analogy p {
      margin: 0;
      padding: 0 14px 14px;
      font-size: 14px;
      line-height: 2;
      color: var(--muted);
    }

    .cl-analogy p b {
      color: var(--text);
    }

    .cl-gloss {
      margin: 16px 0 0;
    }

    .cl-gloss dl {
      margin: 0;
      padding: 0 14px 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .cl-gloss dl>div {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--cl-line);
      background: var(--cl-surface);
    }

    .cl-gloss dt {
      font-weight: 800;
      font-size: 13.5px;
      color: var(--cl-accent);
      margin-bottom: 2px;
    }

    .cl-gloss dd {
      margin: 0;
      font-size: 13px;
      line-height: 1.85;
      color: var(--muted);
    }

    .cl-legend {
      margin: 12px 0 0;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.9;
      color: var(--muted);
      border: 1px dashed var(--cl-line);
    }

    .cl-legend b {
      color: var(--text);
    }

    @media (max-width: 760px) {

      .cl-guide ol,
      .cl-gloss dl {
        grid-template-columns: 1fr;
      }
    }

    .cl .cl-group {
      align-items: center;
    }

    .cl .cl-glabel {
      flex: 0 0 100%;
      font: 800 13.5px var(--font-main);
      letter-spacing: 0;
      word-spacing: 0;
      text-align: start;
      color: var(--text);
      margin-bottom: 2px;
    }

    .cl .cl-stat b {
      font-size: 17px;
    }

    /* ===== اختبرني ===== */
    .qm-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 4px 16px 4px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .qm-open {
      cursor: pointer;
      border: 0;
      border-radius: 99px;
      padding: 9px 20px;
      font: 800 14px var(--font-main);
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 0 16px rgba(219, 39, 119, .3);
      transition: transform .15s, box-shadow .15s;
    }

    .qm-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(219, 39, 119, .5);
    }

    .qm-bar-hint {
      font-size: 12.5px;
      color: var(--muted);
    }

    .qm-panel {
      margin: 10px 16px 6px;
      padding: 14px 16px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(124, 58, 237, .08);
    }

    .qm-panel[hidden] {
      display: none;
    }

    .qm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .qm-head>b {
      font-size: 15px;
    }

    .qm-head-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .qm-head-btns button,
    .qm-next,
    .qm-restart,
    .qm-key,
    .qm-cancel {
      cursor: pointer;
      border-radius: 8px;
      padding: 6px 12px;
      font: 700 12.5px var(--font-main);
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .05);
    }

    .qm-head-btns button:hover:not(:disabled),
    .qm-key:hover,
    .qm-cancel:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .qm-head-btns button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .qm-ai {
      border-color: rgba(34, 211, 238, .6) !important;
      color: var(--cyan) !important;
    }

    .qm-next,
    .qm-restart {
      margin-top: 12px;
      padding: 9px 20px;
      font-size: 14px;
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #7c3aed, #db2777);
    }

    .qm-dots {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .qm-dots i {
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .12);
    }

    .qm-dots i.on {
      background: var(--cyan);
    }

    .qm-dots i.done {
      background: var(--ok);
    }

    .qm-msg {
      margin-bottom: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.8;
    }

    .qm-msg.info {
      background: rgba(34, 211, 238, .1);
      border: 1px solid rgba(34, 211, 238, .4);
    }

    .qm-msg.ok {
      background: rgba(52, 211, 153, .12);
      border: 1px solid rgba(52, 211, 153, .5);
    }

    .qm-msg.bad {
      background: rgba(251, 113, 133, .12);
      border: 1px solid rgba(251, 113, 133, .5);
    }

    .qm-q small,
    .qm-act small {
      color: var(--cyan);
      font: 700 12px var(--font-mono);
    }

    .qm-q h4,
    .qm-act h4 {
      margin: 4px 0 12px;
      font-size: 16px;
      line-height: 1.8;
    }

    .qm-hint {
      margin: -6px 0 12px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .qm-opts {
      display: grid;
      gap: 8px;
    }

    .qm-opt,
    .qm-m,
    .qm-o {
      cursor: pointer;
      text-align: start;
      padding: 11px 14px;
      border-radius: 10px;
      font: 600 14px/1.7 var(--font-main);
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
      transition: border-color .15s, background .15s, transform .1s;
    }

    .qm-opt:hover:not(:disabled),
    .qm-m:hover:not(:disabled),
    .qm-o:hover:not(:disabled) {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, .08);
    }

    .qm-opt.ok,
    .qm-m.done,
    .qm-o.done {
      border-color: var(--ok);
      background: rgba(52, 211, 153, .16);
    }

    .qm-opt.bad,
    .qm-m.wrong,
    .qm-o.wrong {
      border-color: var(--bad);
      background: rgba(251, 113, 133, .18);
      animation: qm-shake .4s;
    }

    .qm-opt.dim {
      opacity: .55;
    }

    .qm-opt:disabled,
    .qm-m:disabled,
    .qm-o:disabled {
      cursor: default;
    }

    .qm-why {
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13.5px;
      line-height: 1.9;
    }

    .qm-why.ok {
      background: rgba(52, 211, 153, .12);
      border: 1px solid rgba(52, 211, 153, .45);
    }

    .qm-why.bad {
      background: rgba(251, 113, 133, .12);
      border: 1px solid rgba(251, 113, 133, .45);
    }

    .qm-match {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .qm-col {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .qm-m.left {
      border-color: rgba(34, 211, 238, .5);
    }

    .qm-m.right {
      border-color: rgba(244, 63, 142, .5);
    }

    .qm-m.sel {
      background: rgba(34, 211, 238, .22);
      box-shadow: 0 0 0 2px var(--cyan);
    }

    .qm-order {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
    }

    .qm-o b {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-inline-end: 8px;
      border-radius: 50%;
      font: 800 12px var(--font-mono);
      color: #04141a;
      background: var(--ok);
    }

    .qm-result {
      text-align: center;
      padding: 10px 0 4px;
    }

    .qm-score {
      font: 800 42px var(--font-mono);
      color: var(--cyan);
    }

    .qm-result p {
      margin: 4px 0;
      font-size: 15px;
    }

    .qm-sub {
      color: var(--muted);
      font-size: 13px !important;
    }

    .qm-empty {
      padding: 14px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--muted);
    }

    @keyframes qm-shake {
      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    @media (max-width: 600px) {
      .qm-match {
        grid-template-columns: 1fr;
      }

      .qm-panel {
        margin-inline: 10px;
      }

      .qm-bar {
        margin-inline: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .qm-opt.bad,
      .qm-m.wrong,
      .qm-o.wrong {
        animation: none;
      }
    }

    /* ===== معمل التخزين ===== */
    .cl-steps {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      overflow: hidden;
    }

    .cl-steps li {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 1px 10px;
      align-items: center;
      background: var(--cl-surface);
      border-inline-start: 1px solid var(--cl-line);
      transition: background .25s;
    }

    .cl-steps li:first-child {
      border-inline-start: 0;
    }

    .cl-steps .n {
      grid-row: span 2;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 700 12px var(--font-mono);
      border: 1px solid var(--cl-line);
      color: var(--muted);
      transition: .25s;
    }

    .cl-steps b {
      font-size: 13.5px;
    }

    .cl-steps small {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.55;
    }

    .cl-steps li.active {
      background: var(--cl-accent-soft);
    }

    .cl-steps li.active .n {
      background: var(--cl-accent);
      border-color: var(--cl-accent);
      color: #04141a;
    }

    .cl-steps li.done .n {
      background: var(--cl-ok);
      border-color: var(--cl-ok);
      color: #04140d;
    }

    .cl-explain {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 11px 14px;
      margin-bottom: 14px;
      border: 1px solid var(--cl-line);
      border-inline-start: 3px solid var(--cl-accent);
      border-radius: 8px;
      background: var(--cl-surface);
      font-size: 13.5px;
      line-height: 1.9;
      min-height: 50px;
    }

    .cl-explain>b {
      white-space: nowrap;
      color: var(--cl-accent);
      font-size: 12px;
      padding-top: 3px;
    }

    .cl code,
    .cx-note code {
      font: 600 12px var(--font-mono);
      direction: ltr;
      unicode-bidi: isolate;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--cl-surface-2);
    }

    .cl-toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cl-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .cl-glabel {
      font: 700 11px var(--font-mono);
      color: var(--muted);
      letter-spacing: .05em;
      min-width: 92px;
    }

    .cl-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .cl-stat {
      padding: 10px 14px;
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      background: var(--cl-surface);
    }

    .cl-stat small {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .cl-stat b {
      display: block;
      font: 700 16px var(--font-mono);
      unicode-bidi: plaintext;
    }

    .cl-stat b.ok {
      color: var(--cl-ok);
    }

    .cl-stat b.warn {
      color: var(--cl-warn);
    }

    .cl-stat b.bad {
      color: var(--cl-bad);
    }

    .cl-diagram {
      display: grid;
      grid-template-columns: 220px 90px 1fr;
      direction: ltr;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .cl-diagram>* {
      direction: var(--cl-dir);
    }

    .cl-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cl-card {
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      background: var(--cl-surface);
      padding: 10px 12px;
      flex: 1;
      transition: border-color .2s, background .2s;
    }

    .cl-card h4 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      margin-bottom: 6px;
    }

    .cl-card h4 svg {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--cl-accent);
    }

    .cl-card .state {
      margin-inline-start: auto;
      font: 600 11px var(--font-mono);
      color: var(--cl-ok);
    }

    .cl-card .state.off {
      color: var(--cl-bad);
    }

    .cl-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 12.5px;
      line-height: 1.9;
    }

    .cl-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px dashed var(--cl-line);
    }

    .cl-list li:last-child {
      border-bottom: 0;
    }

    .cl-list li>span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cl-tag {
      font: 600 10.5px var(--font-mono);
      padding: 0 7px;
      border-radius: 99px;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .cl-tag.ok {
      color: var(--cl-ok);
    }

    .cl-tag.warn {
      color: var(--cl-warn);
    }

    .cl-empty {
      color: var(--muted);
      font-size: 12.5px;
    }

    .cl-wire {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 8px;
      font: 600 10.5px var(--font-mono);
      color: var(--muted);
      text-align: center;
    }

    .cl-wire i {
      display: block;
      width: 100%;
      height: 2px;
      background: repeating-linear-gradient(90deg, var(--cl-line) 0 6px, transparent 6px 10px);
      transition: background .25s;
    }

    .cl-wire.live i {
      background: var(--cl-accent);
    }

    .cl-wire.off i {
      background: repeating-linear-gradient(90deg, var(--cl-bad) 0 4px, transparent 4px 10px);
    }

    .cl-wire.live {
      color: var(--cl-accent);
    }

    .cl-wire.off {
      color: var(--cl-bad);
    }

    .cl-dc {
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      padding: 12px;
      background: var(--cl-surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cl-dc-head {
      display: flex;
      justify-content: space-between;
      font: 700 11px var(--font-mono);
      color: var(--muted);
      letter-spacing: .04em;
    }

    .cl-services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cl-svc {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      background: var(--cl-surface-2);
      transition: .2s;
    }

    .cl-svc svg {
      width: 20px;
      height: 20px;
      color: var(--cl-accent);
      flex: none;
    }

    .cl-svc b {
      display: block;
      font-size: 13px;
    }

    .cl-svc small {
      font-size: 11px;
      color: var(--muted);
    }

    .cl-svc.pulse,
    .cl-card.pulse {
      border-color: var(--cl-accent);
      background: var(--cl-accent-soft);
    }

    .cl-regions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .cl-region {
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      padding: 8px;
      background: var(--cl-surface-2);
    }

    .cl-region.down {
      border-color: var(--cl-bad);
      background: rgba(251, 113, 133, .07);
    }

    .cl-region.down .cl-server {
      opacity: .55;
    }

    .cl-region-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .cl-region-head .badge {
      font: 600 10.5px var(--font-mono);
      color: var(--cl-ok);
    }

    .cl-region.down .badge {
      color: var(--cl-bad);
    }

    .cl-servers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .cl-server {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--cl-line);
      background: var(--cl-surface);
      font: 600 10px var(--font-mono);
      color: var(--muted);
      transition: .15s;
    }

    .cl-server:hover:not(:disabled) {
      border-color: var(--cl-accent);
    }

    .cl-server b {
      font-size: 14px;
      color: var(--text);
    }

    .cl-server.has {
      border-color: var(--cl-accent-line);
    }

    .cl-server.failed {
      border-color: var(--cl-bad);
      background: rgba(251, 113, 133, .1);
      color: var(--cl-bad);
    }

    .cl-server.failed b {
      color: var(--cl-bad);
    }

    .cl-server i {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 5px 5px 0 0;
    }

    .cl-bottom {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
    }

    .cl-panel {
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      background: var(--cl-surface);
      overflow: hidden;
      min-width: 0;
    }

    .cl-panel>h4 {
      font: 700 12px var(--font-main);
      padding: 8px 12px;
      border-bottom: 1px solid var(--cl-line);
      color: var(--muted);
    }

    .cl-panel .body {
      padding: 6px 12px 10px;
      max-height: 290px;
      overflow: auto;
    }

    .cl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .cl-table th {
      text-align: start;
      font-weight: 700;
      font-size: 11.5px;
      color: var(--muted);
      padding: 6px 8px;
      border-bottom: 1px solid var(--cl-line);
      white-space: nowrap;
    }

    .cl-table td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--cl-line);
      vertical-align: middle;
    }

    .cl-table tr:last-child td {
      border-bottom: 0;
    }

    .cl-table td.mono,
    .cl-table th.mono {
      font-family: var(--font-mono);
      direction: ltr;
      text-align: start;
    }

    .cl-status {
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    .cl-status.ok {
      color: var(--cl-ok);
    }

    .cl-status.warn {
      color: var(--cl-warn);
    }

    .cl-status.bad {
      color: var(--cl-bad);
    }

    .cl-sw {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-inline-end: 7px;
    }

    .cl-log-line {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 8px;
      padding: 6px 8px;
      margin: 4px 0;
      border-inline-start: 3px solid var(--cl-accent);
      background: var(--cl-surface);
      border-radius: 4px;
      font-size: 12.5px;
      line-height: 1.8;
      animation: rise .25s both;
    }

    .cl-log-line .t {
      font: 600 10.5px var(--font-mono);
      color: var(--muted);
      padding-top: 2px;
      direction: ltr;
    }

    .cl-log-line.ok {
      border-inline-start-color: var(--cl-ok);
    }

    .cl-log-line.warn {
      border-inline-start-color: var(--cl-warn);
    }

    .cl-log-line.bad {
      border-inline-start-color: var(--cl-bad);
    }

    /* ===== معمل التشفير ===== */
    .cl-sec {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--cl-line);
    }

    .cl-sec:first-of-type {
      margin-top: 6px;
    }

    .cl-sec>h3 {
      font-size: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
    }

    .cl-sec>h3 .no {
      font: 700 11px var(--font-mono);
      padding: 2px 9px;
      border: 1px solid var(--cl-line);
      border-radius: 99px;
      color: var(--cl-accent);
    }

    .cl-sec>.lead {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.95;
      margin-bottom: 12px;
      max-width: 80ch;
    }

    .cx-keybar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      background: var(--cl-surface);
    }

    .cx-keybar .cx-label {
      font: 700 11px var(--font-mono);
      color: var(--muted);
      letter-spacing: .05em;
    }

    .cx-key {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 220px;
    }

    .cx-key input[type=range] {
      flex: 1;
      accent-color: var(--cl-accent);
    }

    .cx-key output {
      font: 700 22px var(--font-mono);
      min-width: 38px;
      text-align: center;
      color: var(--cl-accent);
    }

    .cx-grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .cx-field>.cx-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font: 700 11.5px var(--font-main);
      color: var(--muted);
      margin-bottom: 6px;
      min-height: 30px;
    }

    .cx-input {
      width: 100%;
      min-height: 92px;
      font: 600 18px/1.7 var(--font-main) !important;
      resize: vertical;
      unicode-bidi: plaintext;
    }

    .cx-out {
      min-height: 92px;
      padding: 10px 14px;
      border: 1px solid var(--cl-accent-line);
      border-radius: 8px;
      background: var(--cl-accent-soft);
      font: 700 20px/1.7 var(--font-main);
      word-break: break-word;
      unicode-bidi: plaintext;
    }

    .cx-seg {
      display: inline-flex;
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      overflow: hidden;
    }

    .cx-seg button {
      font: 700 12.5px var(--font-main);
      padding: 6px 14px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .cx-seg button.on {
      background: var(--cl-accent-soft);
      color: var(--text);
      box-shadow: inset 0 -2px 0 var(--cl-accent);
    }

    .cx-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }

    .cx-chip {
      font: 600 12.5px var(--font-main);
      color: var(--text);
      cursor: pointer;
      padding: 3px 11px;
      border-radius: 99px;
      border: 1px solid var(--cl-line);
      background: var(--cl-surface);
    }

    .cx-chip:hover {
      border-color: var(--cl-accent);
    }

    .cx-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .cx-small {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.8;
    }

    .cx-strip-wrap {
      overflow-x: auto;
      padding: 2px 0 6px;
    }

    .cx-strip {
      display: grid;
      gap: 2px;
      min-width: 700px;
      font: 600 12.5px var(--font-mono);
      text-align: center;
    }

    .cx-c {
      padding: 5px 0;
      border: 1px solid var(--cl-line);
      background: var(--cl-surface);
      border-radius: 3px;
      transition: background .15s;
    }

    .cx-c.idx {
      border-color: transparent;
      background: none;
      color: var(--muted);
      font-size: 10px;
      padding: 2px 0;
    }

    .cx-c.cipher {
      background: var(--cl-accent-soft);
      border-color: var(--cl-accent-line);
    }

    .cx-c.used {
      box-shadow: inset 0 -2px 0 var(--cl-accent);
    }

    .cx-c.hit {
      background: rgba(251, 191, 36, .28);
      border-color: var(--cl-warn);
      color: var(--text);
    }

    .cx-rowlabel {
      display: flex;
      align-items: center;
      font: 700 11px var(--font-main);
      color: var(--muted);
    }

    .cx-steps {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 8px;
    }

    .cx-step {
      flex: 0 0 86px;
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      background: var(--cl-surface);
      text-align: center;
      font: 600 12.5px var(--font-mono);
      transition: .15s;
    }

    .cx-step>div {
      padding: 5px 4px;
      border-bottom: 1px solid var(--cl-line);
    }

    .cx-step>div:last-child {
      border-bottom: 0;
    }

    .cx-step .ch {
      font: 700 20px var(--font-main);
    }

    .cx-step .sm {
      font-size: 10.5px;
      color: var(--muted);
      font-family: var(--font-main);
    }

    .cx-step .calc {
      font-size: 11.5px;
      direction: ltr;
    }

    .cx-step .res {
      background: var(--cl-accent-soft);
      font: 700 20px var(--font-main);
    }

    .cx-step.hit {
      border-color: var(--cl-warn);
      box-shadow: 0 0 0 1px var(--cl-warn);
    }

    .cx-step.skip {
      opacity: .45;
    }

    .cx-details {
      margin-top: 14px;
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      background: var(--cl-surface);
    }

    .cx-details>summary {
      cursor: pointer;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 13.5px;
    }

    .cx-details .inner {
      padding: 0 14px 14px;
    }

    .cx-brute {
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      margin-top: 8px;
    }

    .cl-table tr.match td {
      background: var(--cl-accent-soft);
      font-weight: 700;
    }

    .cx-note {
      padding: 10px 14px;
      border: 1px solid var(--cl-line);
      border-inline-start: 3px solid var(--cl-warn);
      border-radius: 8px;
      background: var(--cl-surface);
      font-size: 13px;
      line-height: 1.95;
      margin-top: 12px;
    }

    .cx-compare {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .cx-compare>div {
      padding: 8px 12px;
      border: 1px solid var(--cl-line);
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.8;
    }

    .cx-compare b {
      display: block;
      font: 700 15px var(--font-mono);
      direction: ltr;
      text-align: start;
    }

    .cx-compare .weak b {
      color: var(--cl-bad);
    }

    .cx-compare .strong b {
      color: var(--cl-ok);
    }

    .cx-drop {
      border: 1px dashed var(--cl-line);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      background: var(--cl-surface);
      transition: .15s;
      font-size: 13px;
      line-height: 2;
    }

    .cx-drop.over {
      border-color: var(--cl-accent);
      background: var(--cl-accent-soft);
    }

    .cx-drop input[type=file] {
      display: none;
    }

    .cx-panes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .cx-pane {
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      background: var(--cl-surface);
      padding: 10px 12px;
      min-width: 0;
    }

    .cx-pane h4 {
      font-size: 13px;
      margin-bottom: 4px;
    }

    .cx-pane .meta {
      font: 600 11px var(--font-mono);
      color: var(--muted);
      direction: ltr;
      text-align: start;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .cx-pane .cap {
      font: 700 10.5px var(--font-mono);
      color: var(--muted);
      margin: 6px 0 3px;
      letter-spacing: .04em;
    }

    .cx-hex {
      font: 600 11px/1.7 var(--font-mono);
      direction: ltr;
      text-align: left;
      word-break: break-all;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--cl-surface-2);
      min-height: 44px;
    }

    .cx-txt {
      font: 600 12.5px/1.7 var(--font-main);
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--cl-surface-2);
      min-height: 44px;
      max-height: 96px;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      unicode-bidi: plaintext;
    }

    .cx-map {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      border: 1px solid var(--cl-line);
      border-radius: 4px;
      background: var(--cl-surface-2);
      display: block;
    }

    .cx-verdict {
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 8px;
      line-height: 1.8;
    }

    .cx-verdict.ok {
      color: var(--cl-ok);
    }

    .cx-verdict.bad {
      color: var(--cl-bad);
    }

    .cx-verdict.info {
      color: var(--muted);
      font-weight: 600;
    }

    .cx-empty {
      grid-column: 1 / -1;
      padding: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--cl-line);
      border-radius: 10px;
    }

    .cx-pane.ghost {
      opacity: .6;
    }

    @media (max-width: 900px) {
      .cl-steps {
        grid-template-columns: 1fr 1fr;
      }

      .cl-steps li:nth-child(3) {
        border-inline-start: 0;
      }

      .cl-steps li:nth-child(n+3) {
        border-top: 1px solid var(--cl-line);
      }

      .cl-stats {
        grid-template-columns: 1fr 1fr;
      }

      .cl-diagram {
        grid-template-columns: 1fr;
        direction: var(--cl-dir);
        gap: 10px;
      }

      .cl-wire {
        flex-direction: row;
        padding: 4px 0;
      }

      .cl-bottom,
      .cx-grid2,
      .cx-panes {
        grid-template-columns: minmax(0, 1fr);
      }

      .cl-diagram {
        grid-template-columns: minmax(0, 1fr);
      }

      .cl-glabel {
        min-width: 100%;
      }
    }

    @media (max-width: 560px) {
      .cl {
        padding: 14px;
      }

      .cl-regions {
        grid-template-columns: 1fr;
      }

      .cl-services,
      .cx-compare {
        grid-template-columns: 1fr;
      }

      .cl-steps {
        grid-template-columns: 1fr;
      }

      .cl-steps li {
        border-inline-start: 0;
        border-top: 1px solid var(--cl-line);
      }

      .cl-steps li:first-child {
        border-top: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .cl *,
      .cl-tabs * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* ===== محاكاة 3D الحقيقية (three.js) ===== */
    .sim-wrap {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 3;
      background: #9fd3ff;
    }

    .sim-wrap.on {
      display: block;
    }

    #sim-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #sim-canvas:active {
      cursor: grabbing;
    }

    .sim-markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .sim-marker {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px 3px 6px;
      border-radius: 99px;
      white-space: nowrap;
      font: 700 11.5px var(--font-main);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .6);
      background: rgba(8, 6, 28, .78);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .5);
      transition: background .2s, box-shadow .2s;
    }

    .sim-marker span {
      font-size: 15px;
    }

    .sim-marker:hover,
    .sim-marker.sel {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 0 18px rgba(219, 39, 119, .7);
    }

    .sim-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
      font-size: 15px;
      line-height: 2;
      color: #0b1020;
      background: rgba(159, 211, 255, .9);
    }

    .sim-hud {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      width: min(96%, 900px);
      display: grid;
      gap: 6px;
      justify-items: center;
    }

    .sim-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 100%;
      padding: 4px;
      scrollbar-width: none;
    }

    .sim-chips::-webkit-scrollbar {
      display: none;
    }

    .sim-chips .chip-btn {
      flex: none;
      background: rgba(8, 6, 28, .75);
      backdrop-filter: blur(6px);
    }

    .sim-tools {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .sim-tools .small-btn {
      background: rgba(8, 6, 28, .75);
      backdrop-filter: blur(6px);
    }

    .sim-tools .small-btn.accent {
      background: linear-gradient(135deg, #0891b2, #2563eb);
    }

    .sim-mode .layer-chips,
    .sim-mode .hud-buttons,
    .sim-mode .world-hint {
      display: none;
    }

    .sim-mode .world-title b {
      text-shadow: 0 0 20px rgba(0, 0, 0, .5);
    }

    .world-stage:not(.sim-mode) .sim-hud {
      display: none;
    }

    /* ===== لعبة 3D: ركّب حاسوبك ===== */
    .game-tabs button.hot {
      border-color: rgba(251, 191, 36, .7);
    }

    .story3d-wrap {
      position: relative;
    }

    .story3d-frame {
      display: block;
      width: 100%;
      height: 76vh;
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: radial-gradient(circle at 50% 30%, #141a3a, #070916);
      box-shadow: 0 18px 60px rgba(34, 211, 238, .12);
    }

    .story3d-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: var(--text);
      pointer-events: none;
    }

    .story3d-tools {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .pc3d {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 14px;
      direction: ltr;
    }

    .pc3d>* {
      direction: rtl;
    }

    .pc3d-stage {
      position: relative;
      min-height: 460px;
      height: 66vh;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: radial-gradient(circle at 50% 30%, #141a3a, #070916);
      box-shadow: 0 18px 60px rgba(34, 211, 238, .12);
    }

    #p3-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #p3-canvas:active {
      cursor: grabbing;
    }

    .pc3d-loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
      line-height: 2;
      background: rgba(8, 6, 28, .92);
    }

    .pc3d-hint {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 11.5px;
      color: var(--muted);
      pointer-events: none;
    }

    .pc3d-hud {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 3;
      font-size: 13px;
    }

    .pc3d-hud span {
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(8, 6, 28, .6);
      backdrop-filter: blur(6px);
    }

    .pc3d-hud b {
      font-family: var(--font-mono);
      color: var(--cyan);
    }

    .pc3d-views {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
      z-index: 3;
    }

    .pc3d-views .small-btn {
      background: rgba(8, 6, 28, .6);
      backdrop-filter: blur(6px);
    }

    .pc3d-marker {
      position: absolute;
      z-index: 2;
      transform: translate(-50%, -125%);
      pointer-events: none;
      white-space: nowrap;
      padding: 4px 12px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 99px;
      color: #04202a;
      background: linear-gradient(135deg, #67f3ff, #22d3ee);
      box-shadow: 0 6px 20px rgba(34, 211, 238, .55);
      animation: p3bob 1.2s ease-in-out infinite;
    }

    @keyframes p3bob {

      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: -8px;
      }
    }

    .pc3d-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 66vh;
      min-height: 460px;
      overflow: auto;
    }

    .pc3d-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .pc3d-bar {
      flex: 1;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }

    .pc3d-bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #22d3ee, #a855f7);
      transition: width .8s cubic-bezier(.2, .8, .2, 1);
    }

    .pc3d-task {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card-bg);
    }

    .pc3d-task.enter {
      animation: p3enter .45s ease both;
    }

    @keyframes p3enter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .pc3d-task h3 {
      font-size: 17px;
      color: var(--cyan);
    }

    .pc3d-task p {
      font-size: 13.5px;
      line-height: 1.9;
      margin: 4px 0 12px;
    }

    .pc3d-tray {
      display: grid;
      gap: 8px;
    }

    .p3-item {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 12px;
      font: 600 13.5px var(--font-main);
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
      transition: .2s;
    }

    .p3-item span {
      font-size: 24px;
      line-height: 1;
    }

    .p3-item:hover:not(:disabled) {
      border-color: var(--cyan);
      transform: translateX(-3px);
      background: rgba(34, 211, 238, .08);
    }

    .p3-item.done {
      opacity: .5;
      border-color: var(--ok);
      background: rgba(52, 211, 153, .1);
    }

    .p3-item.working {
      border-color: #fbbf24;
      animation: pulse 1s infinite;
    }

    .p3-item.hint {
      border-color: #fbbf24;
      box-shadow: 0 0 16px rgba(251, 191, 36, .6);
    }

    .p3-item.wrong {
      animation: p3shake .35s;
      border-color: var(--bad);
    }

    @keyframes p3shake {

      20%,
      60% {
        transform: translateX(6px);
      }

      40%,
      80% {
        transform: translateX(-6px);
      }
    }

    .pc3d-msg {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.8;
      min-height: 22px;
    }

    .pc3d-msg.ok {
      color: var(--ok);
    }

    .pc3d-msg.bad {
      color: var(--bad);
    }

    @media (max-width: 900px) {
      .pc3d {
        grid-template-columns: 1fr;
        direction: rtl;
      }

      .pc3d-panel {
        max-height: none;
        min-height: 0;
      }

      .pc3d-stage {
        height: 52vh;
        min-height: 340px;
      }
    }

    /* ===== معمل التخزين المبسّط (sl-) ===== */
    .sl {
      max-width: 640px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
      font-size: 15px;
      line-height: 1.7;
    }

    .sl h2 {
      font-size: 22px;
      margin: 0 0 4px;
    }

    .sl-intro {
      margin: 0;
      color: var(--muted);
    }

    .sl-stage {
      display: grid;
      gap: 8px;
      justify-items: center;
      padding: 16px 12px;
      border: 1px solid var(--cl-line);
      border-radius: 16px;
      background: var(--cl-surface);
    }

    .sl-dev {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--cl-surface-2);
      font-weight: 700;
      font-size: 16px;
    }

    .sl-dev small {
      font-weight: 400;
      color: var(--muted);
      font-size: 13px;
    }

    .sl-wire {
      display: grid;
      justify-items: center;
      min-height: 46px;
      color: var(--muted);
      font-size: 13px;
    }

    .sl-wire i {
      font-style: normal;
      font-size: 20px;
      line-height: 1.2;
      color: var(--cl-accent);
    }

    .sl-wire.down i {
      animation: sl-down 1s ease-in-out infinite;
    }

    .sl-wire.up i {
      animation: sl-up 1s ease-in-out infinite;
    }

    @keyframes sl-down {

      0%,
      100% {
        transform: translateY(-3px);
      }

      50% {
        transform: translateY(4px);
      }
    }

    @keyframes sl-up {

      0%,
      100% {
        transform: translateY(3px);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .sl-bs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .sl-b {
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: grid;
      gap: 2px;
      justify-items: center;
      align-content: center;
      min-height: 108px;
      padding: 10px 4px;
      border: 2px solid var(--cl-line);
      border-radius: 14px;
      background: var(--cl-surface-2);
      transition: border-color .2s, background .2s, filter .2s;
    }

    .sl-b .ic {
      font-size: 32px;
      line-height: 1.2;
    }

    .sl-b b {
      font-size: 15px;
    }

    .sl-b small {
      font-size: 13px;
      color: var(--muted);
    }

    .sl-b:hover:not(:disabled) {
      border-color: var(--cl-accent-line);
    }

    .sl-b.has {
      border-color: var(--cl-ok);
      background: rgba(52, 211, 153, .13);
    }

    .sl-b.has small {
      color: var(--cl-ok);
      font-weight: 700;
    }

    .sl-b.down {
      border-color: var(--cl-bad);
      background: rgba(251, 113, 133, .13);
      filter: grayscale(.7);
    }

    .sl-b.down small {
      color: var(--cl-bad);
      font-weight: 700;
    }

    .sl-b.pop {
      animation: sl-pop .55s ease;
    }

    @keyframes sl-pop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.07);
      }

      100% {
        transform: scale(1);
      }
    }

    .sl-b:disabled,
    .sl-act:disabled {
      cursor: progress;
      opacity: .7;
    }

    .sl-flow {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 13px;
    }

    .sl-flow span {
      padding: 3px 11px;
      border: 1px solid var(--cl-line);
      border-radius: 99px;
      color: var(--muted);
    }

    .sl-flow span.on {
      border-color: var(--cl-accent);
      background: var(--cl-accent-soft);
      color: var(--text);
      font-weight: 700;
    }

    .sl-flow span.done {
      border-color: var(--cl-ok);
      color: var(--text);
    }

    .sl-acts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sl-act {
      font: 700 14px/1.5 var(--font-main);
      color: var(--text);
      cursor: pointer;
      display: grid;
      gap: 4px;
      justify-items: center;
      align-content: center;
      min-height: 76px;
      padding: 8px 6px;
      border: 1px solid var(--cl-line);
      border-radius: 14px;
      background: var(--cl-surface-2);
      text-align: center;
      transition: border-color .2s, transform .2s;
    }

    .sl-act:hover:not(:disabled) {
      border-color: var(--cl-accent-line);
      transform: translateY(-2px);
    }

    .sl-act .n {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--cl-accent-soft);
      border: 1px solid var(--cl-accent-line);
      font-size: 12px;
    }

    .sl-act[data-next] {
      border-color: var(--cl-accent);
      box-shadow: 0 0 0 3px var(--cl-accent-soft);
    }

    .sl-msg {
      padding: 12px 14px;
      border: 1px solid var(--cl-line);
      border-radius: 12px;
      background: var(--cl-surface);
      font-size: 16px;
      min-height: 3.6em;
    }

    .sl-msg.ok {
      border-color: var(--cl-ok);
      background: rgba(52, 211, 153, .1);
    }

    .sl-msg.warn {
      border-color: var(--cl-warn);
      background: rgba(251, 191, 36, .1);
    }

    .sl-msg.bad {
      border-color: var(--cl-bad);
      background: rgba(251, 113, 133, .1);
    }

    .sl-count {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      color: var(--muted);
    }

    .sl-count b {
      color: var(--text);
    }

    .sl-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .sl-foot details {
      flex: 1 1 280px;
      font-size: 14px;
      color: var(--muted);
    }

    .sl-foot summary {
      cursor: pointer;
      color: var(--text);
    }

    .sl-foot details p {
      margin: 6px 0 0;
    }

    .sl-reset {
      font: inherit;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: 1px solid var(--cl-line);
      border-radius: 10px;
      padding: 6px 12px;
    }

    .sl-reset:hover {
      color: var(--text);
      border-color: var(--cl-accent-line);
    }

    .sl button:focus-visible {
      outline: 2px solid var(--cl-accent);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      .sl-acts {
        grid-template-columns: 1fr;
      }

      .sl-act {
        min-height: 56px;
        grid-auto-flow: column;
        justify-content: center;
        gap: 10px;
      }

      .sl-b {
        min-height: 96px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .sl-wire i,
      .sl-b.pop {
        animation: none;
      }
    }

    /* ===== معمل التشفير المبسّط (ce-) ===== */
    .ce {
      max-width: 640px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
      font-size: 15px;
      line-height: 1.7;
    }

    .ce h2 {
      font-size: 22px;
      margin: 0 0 4px;
    }

    .ce-intro {
      margin: 0;
      color: var(--muted);
    }

    .ce-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--cl-line);
      border-radius: 14px;
      background: var(--cl-surface);
    }

    .ce-seg {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--cl-line);
      border-radius: 12px;
    }

    .ce-seg button {
      font: 700 14px var(--font-main);
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: 0;
      border-radius: 9px;
      padding: 8px 14px;
      min-height: 40px;
    }

    .ce-seg button.on {
      color: var(--text);
      background: var(--cl-accent-soft);
      box-shadow: inset 0 0 0 1px var(--cl-accent-line);
    }

    .ce-key {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .ce-key output {
      min-width: 36px;
      text-align: center;
      font: 700 24px var(--font-mono);
      color: var(--cl-accent);
    }

    .ce-step {
      font: 700 20px/1 var(--font-main);
      color: var(--text);
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--cl-line);
      background: var(--cl-surface-2);
    }

    .ce-step:hover {
      border-color: var(--cl-accent-line);
    }

    .ce-io {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .ce-box {
      display: grid;
      gap: 6px;
      align-content: start;
      min-width: 0;
    }

    .ce-box>span:first-child {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .ce-box textarea {
      font: 600 18px/1.5 var(--font-main);
      color: var(--text);
      width: 100%;
      resize: none;
      padding: 10px 12px;
      border: 1px solid var(--cl-line);
      border-radius: 12px;
      background: var(--cl-surface-2);
      outline: none;
    }

    .ce-box textarea:focus {
      border-color: var(--cl-accent);
      box-shadow: 0 0 0 3px var(--cl-accent-soft);
    }

    .ce-out {
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid var(--cl-accent-line);
      border-radius: 12px;
      background: var(--cl-accent-soft);
      font: 700 18px/1.5 var(--font-mono);
      word-break: break-all;
    }

    .ce-ex {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ce-ex button,
    .ce-copy {
      font: 13px var(--font-main);
      color: var(--text);
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid var(--cl-line);
      background: var(--cl-surface);
    }

    .ce-copy {
      justify-self: start;
    }

    .ce-ex button:hover,
    .ce-copy:hover {
      border-color: var(--cl-accent-line);
    }

    .ce-map {
      display: grid;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid var(--cl-line);
      border-radius: 14px;
      background: var(--cl-surface);
      font-size: 14px;
      color: var(--muted);
