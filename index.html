    }

    .ce-pairs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ce-pair {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--cl-surface-2);
      border: 1px solid var(--cl-line);
      font: 700 18px var(--font-mono);
      color: var(--text);
    }

    .ce-pair i {
      font-style: normal;
      color: var(--muted);
      font-size: 15px;
    }

    .ce-pair b {
      color: var(--cl-accent);
    }

    .ce-more {
      font-size: 14px;
      color: var(--muted);
    }

    .ce-more summary {
      cursor: pointer;
      color: var(--text);
    }

    .ce-more p {
      margin: 6px 0 0;
    }

    .ce button:focus-visible,
    .ce textarea:focus-visible {
      outline: 2px solid var(--cl-accent);
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .ce-io {
        grid-template-columns: 1fr;
      }

      .ce-bar {
        justify-content: center;
      }
    }

    /* ===== مخططات بيانية ===== */
    .cc-chart {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
    }

    :root[data-theme="light"] .cc-chart {
      background: rgba(80, 60, 180, .045);
    }

    .cc-chart-t,
    .wb-split-t {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .cc-chart svg {
      width: 100%;
      height: auto;
      display: block;
      direction: ltr;
      overflow: visible;
    }

    .cc-chart svg .g {
      stroke: var(--border);
      stroke-width: 1;
      stroke-dasharray: 3 4;
    }

    .cc-chart svg .t {
      fill: var(--muted);
      font: 11px var(--font-mono);
    }

    .cc-chart svg .ln {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .cc-chart svg .ln.cl,
    .cc-chart-l i.cl {
      stroke: #22d3ee;
      background: #22d3ee;
    }

    .cc-chart svg .ln.lo,
    .cc-chart-l i.lo {
      stroke: #f43f8e;
      background: #f43f8e;
    }

    .cc-chart svg .you {
      stroke: var(--muted);
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
    }

    .cc-chart svg .you-t {
      fill: var(--text);
    }

    .cc-chart svg .be {
      fill: #fbbf24;
      stroke: var(--text);
      stroke-width: 2;
    }

    .cc-chart svg .be-t {
      fill: var(--text);
      font-weight: 700;
    }

    .cc-chart-l {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 6px;
      font-size: 14px;
    }

    .cc-chart-l span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cc-chart-l i {
      width: 18px;
      height: 5px;
      border-radius: 3px;
      display: inline-block;
    }

    .wb-split {
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
    }

    :root[data-theme="light"] .wb-split {
      background: rgba(80, 60, 180, .045);
    }

    .wb-split-bar {
      display: flex;
      gap: 3px;
      height: 26px;
      border-radius: 10px;
      overflow: hidden;
    }

    .wb-split-bar i {
      min-width: 6px;
      transition: flex .4s;
    }

    .wb-split-l {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 6px 14px;
      font-size: 14px;
    }

    .wb-split-l li {
      display: grid;
      grid-template-columns: 14px 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .wb-split-l li i {
      width: 12px;
      height: 12px;
      border-radius: 4px;
    }

    .wb-split-l small {
      color: var(--muted);
      font-family: var(--font-mono);
      direction: ltr;
    }

    .c-net {
      background: #22d3ee;
    }

    .c-hw {
      background: #a78bfa;
    }

    .c-sw {
      background: #fbbf24;
    }

    .c-svc {
      background: #34d399;
    }

    /* ===== عملة IT والمتجر والإحصائيات ===== */
    .it-pill {
      font: 700 14px var(--font-main);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid rgba(251, 191, 36, .55);
      background: rgba(251, 191, 36, .12);
      white-space: nowrap;
    }

    .it-pill b {
      font-family: var(--font-mono);
      color: #fbbf24;
    }

    :root[data-theme="light"] .it-pill b {
      color: #b45309;
    }

    .it-pill.pop {
      animation: it-pop .5s ease;
    }

    @keyframes it-pop {
      40% {
        transform: scale(1.12);
      }
    }

            .it-store {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 2, 10, .72);
      backdrop-filter: blur(6px);
    }

    .it-store.on {
      display: flex;
      animation: fade-up .25s;
    }

    .it-store[hidden] {
      display: none;
    }

    .store-panel {
      width: min(940px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 14px;
      border: 1px solid rgba(251, 191, 36, .45);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .6);
    }

    .st-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .st-head b {
      font-size: 18px;
      flex: 1;
    }

    .st-bal {
      font: 700 15px var(--font-mono);
      color: #fbbf24;
    }

    .st-sub {
      margin: 6px 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .st-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .st-item {
      display: grid;
      gap: 4px;
      align-content: start;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .st-item .ic {
      font-size: 26px;
    }

    .st-item small {
      color: var(--muted);
      line-height: 1.6;
    }

    .st-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin: 4px 0;
    }

    .st-item .small-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .chip {
      display: inline-block;
      padding: 2px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .chip.lv-سهل {
      border-color: #34d399;
      color: #34d399;
    }

    .chip.lv-متوسط {
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .chip.lv-صعب {
      border-color: #fb7185;
      color: #fb7185;
    }

    .q-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .pu {
      font: 13px var(--font-main);
      color: var(--text);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
    }

    .pu small {
      margin-inline-start: 4px;
      color: var(--muted);
    }

    .pu.on {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, .15);
    }

    .pu:disabled {
      opacity: .45;
      cursor: default;
    }

    .q-hint {
      margin: 6px 0 10px;
      padding: 8px 12px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a1-rgb), .1);
      border: 1px solid var(--a1);
      font-size: 14px;
    }

    .option.gone {
      opacity: .25;
      text-decoration: line-through;
    }

    .gain {
      color: #fbbf24;
    }

    .res-it {
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(251, 191, 36, .45);
      background: rgba(251, 191, 36, .1);
    }

    .alx-card {
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      text-align: start;
    }

    .alx-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .alx-row {
      display: grid;
      grid-template-columns: minmax(80px, 150px) 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 6px 0;
      font-size: 14px;
    }

    .alx-bar {
      height: 14px;
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
      display: flex;
    }

    .alx-bar i,
    .alx-leg i {
      display: block;
      height: 100%;
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
      transition: width .5s;
    }

    .alx-bar i.g,
    .alx-leg i.g {
      background: #34d399;
    }

    .alx-bar i.a,
    .alx-leg i.a {
      background: #fbbf24;
    }

    .alx-bar i.r,
    .alx-leg i.r {
      background: #fb7185;
    }

    .alx-stack i {
      border-radius: 0;
    }

    .alx-row b {
      font-family: var(--font-mono);
      direction: ltr;
    }

    .alx-row small {
      color: var(--muted);
    }

    .alx-sum {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin-top: 10px;
      font-size: 14px;
    }

    .alx-leg {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .alx-leg span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .alx-leg i {
      width: 14px;
      height: 10px;
    }

    .alx-empty {
      color: var(--muted);
      font-size: 14px;
    }

    .review .skipped {
      opacity: .7;
    }

    @media (max-width: 560px) {
      .alx-row {
        grid-template-columns: 90px 1fr auto;
      }
    }


    /* ===== ورشة العمل ===== */
    .ws-tabs {
      margin-bottom: 18px;
    }

    .ws-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .ws-card {
      position: relative;
      text-align: start;
      padding: 18px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ws-card:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      box-shadow: 0 8px 26px rgba(var(--a1-rgb), .18);
    }

    .ws-card .ic {
      font-size: 34px;
      line-height: 1.2;
    }

    .ws-card b {
      font-size: 17px;
    }

    .ws-card small {
      color: var(--muted);
      line-height: 1.7;
    }

    .ws-card .where {
      font-size: 11.5px;
      color: var(--cyan);
      margin-top: auto;
    }

    .ws-card em {
      position: absolute;
      top: 12px;
      inset-inline-end: 12px;
      font-style: normal;
      font-size: 11px;
      padding: 2px 9px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
    }

    .ws-vbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .ws-vbar b {
      font-size: 18px;
    }

    .ws-vwrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 14px;
    }

    @media (max-width: 900px) {
      .ws-vwrap {
        grid-template-columns: 1fr;
      }
    }

    .ws-stage {
      position: relative;
      height: 560px;
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 25%, var(--ink3), #070716 75%);
      border: 1px solid var(--border);
      touch-action: none;
    }

    @media (max-width: 600px) {
      .ws-stage {
        height: 430px;
      }
    }

    .ws-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    .ws-canvas:active {
      cursor: grabbing;
    }

    .ws-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ws-label {
      position: absolute;
      left: 0;
      top: 0;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: rgba(var(--ink-rgb), .8);
      border: 1px solid rgba(var(--a1-rgb), .5);
      padding: 3px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      pointer-events: none;
      font-family: inherit;
    }

    button.ws-label {
      pointer-events: auto;
      cursor: pointer;
    }

    .ws-label.zone {
      font-size: 13px;
      background: rgba(var(--a2-rgb), .88);
      border-color: transparent;
    }

    .ws-label.sw {
      background: rgba(var(--a3-rgb), .9);
      border-color: transparent;
    }

    .ws-label.ok {
      background: rgba(16, 185, 129, .92);
      border-color: transparent;
    }

    .ws-label.multi {
      white-space: nowrap;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      line-height: 1.7;
      text-align: start;
    }

    .ws-label.dim {
      font-weight: 600;
      font-size: 11px;
    }

    .ws-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: #f1e9ea;
      padding: 20px;
      line-height: 1.8;
    }

    .ws-hint {
      position: absolute;
      bottom: 10px;
      inset-inline-start: 12px;
      font-size: 11.5px;
      color: #efe6e7;
      background: rgba(0, 0, 0, .35);
      padding: 4px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      pointer-events: none;
    }

    .ws-side {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 560px;
      overflow: auto;
    }

    .ws-intro {
      margin: 0;
      line-height: 1.8;
    }

    .ws-steps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ws-steps li {
      padding: 9px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      cursor: pointer;
      transition: .2s;
    }

    .ws-steps li b {
      display: block;
      font-size: 14px;
    }

    .ws-steps li span {
      display: none;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75;
      margin-top: 4px;
    }

    .ws-steps li.on {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .1);
    }

    .ws-steps li.on span {
      display: block;
    }

    .ws-steps li.done b {
      color: var(--cyan);
    }

    .ws-prog {
      height: 4px;
      border-radius: min(calc(4px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a2l-rgb), .15);
      overflow: hidden;
    }

    .ws-prog i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
    }

    .ws-ctrl {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ws-ctrl .small-btn.on {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .ws-pick {
      font-size: 13px;
      line-height: 1.75;
      padding: 10px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a2-rgb), .12);
      border: 1px dashed var(--border);
    }

    .ws-pick b {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .ws-pick p {
      margin: 0 0 6px;
    }

    .ws-pick .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ws-pick .meta span {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a1-rgb), .12);
    }

    .ws-more summary {
      cursor: pointer;
      font-weight: 700;
    }

    .ws-more table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 8px;
    }

    .ws-more td,
    .ws-more th {
      border-bottom: 1px solid var(--border);
      padding: 6px;
      text-align: start;
      vertical-align: top;
    }

    .ws-more ul {
      margin: 8px 0 0;
      padding-inline-start: 18px;
      line-height: 1.8;
      font-size: 13px;
    }

    #ws-back {
      position: fixed;
      bottom: 22px;
      left: 22px;
      z-index: 80;
      padding: 11px 18px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 0;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 6px 22px rgba(var(--a2-rgb), .5);
    }

    /* صانع البنية التحتية */
    .wb-stepper {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .wb-stepper span {
      padding: 6px 14px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .wb-stepper span.on {
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border-color: transparent;
    }

    .wb-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 20px;
      margin-bottom: 14px;
    }

    .wb-card h3 {
      margin: 0 0 8px;
    }

    .wb-card>p {
      margin: 0 0 12px;
      color: var(--muted);
    }

    .wb-input,
    .wb-row select {
      width: 100%;
      padding: 11px 13px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, .25);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      box-sizing: border-box;
    }

    .wb-row select option {
      color: #111;
    }

    [data-theme="light"] .wb-input,
    [data-theme="light"] .wb-row select {
      background: #fff;
    }

    .wb-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .wb-chip {
      padding: 7px 13px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .wb-chip:hover,
    .wb-chip.on {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .1);
    }

    .wb-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin: 14px 0 4px;
    }

    .wb-row label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .wb-row label b {
      color: var(--text);
      font-size: 16px;
    }

    .wb-row input[type=range] {
      accent-color: var(--pink);
      width: 100%;
    }

    .wb-mods {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }

    .wb-mod {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      cursor: pointer;
      transition: .2s;
    }

    .wb-mod.on {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .08);
    }

    .wb-mod input {
      accent-color: var(--cyan);
      width: 18px;
      height: 18px;
      margin-top: 3px;
      flex: none;
    }

    .wb-mod .i {
      font-size: 24px;
    }

    .wb-mod b {
      display: block;
    }

    .wb-mod small {
      color: var(--muted);
      line-height: 1.6;
      display: block;
    }

    .wb-mod small.dev {
      color: var(--cyan);
      margin-top: 3px;
    }

    .wb-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .wb-btn {
      padding: 11px 20px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 0;
      font: inherit;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .wb-btn.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .wb-err {
      color: #f87171;
      font-size: 13px;
      margin-top: 8px;
      min-height: 1em;
    }

    .wb-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .wb-head h3 {
      margin: 0;
    }

    .wb-tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .wb-tile {
      padding: 14px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .wb-tile small {
      color: var(--muted);
      display: block;
    }

    .wb-tile b {
      font-size: 21px;
      display: block;
      margin-top: 4px;
    }

    .wb-tile em {
      font-style: normal;
      font-size: 12px;
      color: var(--muted);
    }

    .wb-layers {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .wb-layers button {
      padding: 7px 12px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .wb-layers button.on {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .wb-legend {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.8;
      margin: 0;
      padding-inline-start: 18px;
    }

    .wb-h {
      margin: 22px 0 10px;
    }

    .wb-tablewrap {
      overflow: auto;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: var(--card-bg);
    }

    .wb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 640px;
    }

    .wb-table th,
    .wb-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: start;
      vertical-align: top;
    }

    .wb-table th {
      font-size: 12.5px;
      color: var(--muted);
    }

    .wb-table tr.sec td {
      background: rgba(var(--a2-rgb), .16);
      font-weight: 800;
    }

    .wb-table tr.sum td {
      font-weight: 800;
      background: rgba(var(--a1-rgb), .08);
    }

    .wb-table td.num {
      white-space: nowrap;
    }

    .wb-table .desc {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.65;
    }

    .wb-table tr[data-id] {
      cursor: pointer;
    }

    .wb-table tr[data-id]:hover td {
      background: rgba(var(--a1-rgb), .06);
    }

    .wb-gantt {
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 14px;
    }

    .wb-grow {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .wb-grow {
        grid-template-columns: 1fr;
      }
    }

    .wb-grow small {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .wb-gtrack {
      position: relative;
      height: 26px;
      background: rgba(var(--a2l-rgb), .08);
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
    }

    .wb-gbar {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: min(calc(8px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
    }

    .wb-note {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.8;
      margin-top: 10px;
    }

    /* صانع البنية التحتية: الواجهة المبسطة والتجوّل */
    .wb-adv {
      margin-top: 12px;
    }

    .wb-adv summary,
    .wb-more summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--muted);
    }

    .wb-more {
      margin-top: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 12px 14px;
    }

    .wb-more[open] summary {
      margin-bottom: 10px;
    }

    .wb-modes {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .wb-modes button {
      flex: 1;
      min-width: 160px;
      padding: 12px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .wb-modes button.on {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .wb-stage {
      height: 620px;
    }

    .wb-side {
      max-height: 620px;
    }

    .wb-cats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .wb-cats button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 6px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .wb-cats button i {
      font-style: normal;
      font-size: 26px;
    }

    .wb-cats button.on {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .wb-explain {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13.5px;
      line-height: 1.8;
    }

    .wb-sum {
      padding: 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a2-rgb), .1);
      border: 1px solid var(--border);
    }

    .wb-sum h4 {
      margin: 0 0 6px;
      font-size: 15px;
    }

    .wb-sum ul,
    .wb-sum ol,
    .wb-swl {
      margin: 0;
      padding-inline-start: 18px;
    }

    .wb-sum p {
      margin: 0 0 6px;
    }

    .wb-tip {
      margin: 4px 0 0;
      font-weight: 700;
      color: var(--cyan);
    }

    .wb-dept {
      border: 1px solid var(--border);
      border-inline-start: 4px solid var(--zc, var(--cyan));
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 8px 12px;
    }

    .wb-dept summary {
      cursor: pointer;
      font-weight: 800;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      align-items: center;
    }

    .wb-dept summary em {
      font-style: normal;
      font-weight: 600;
      font-size: 12px;
      color: var(--muted);
    }

    .wb-dept p {
      margin: 8px 0 0;
    }

    .wb-devs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .wb-dev,
    .wb-zbtn {
      padding: 6px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }

    .wb-dev:hover,
    .wb-zbtn:hover {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .1);
    }

    .wb-zlist {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .wb-zbtn {
      border-inline-start: 4px solid var(--zc);
    }

    .wb-explain kbd,
    .wb-hud kbd,
    .wb-prompt kbd {
      display: inline-block;
      padding: 0 6px;
      border-radius: min(calc(5px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .12);
      font-family: inherit;
      font-size: 11.5px;
      line-height: 1.6;
    }

    .wb-ov {
      position: absolute;
      z-index: 5;
      inset-inline-end: 12px;
      top: 12px;
      width: min(360px, calc(100% - 24px));
      max-height: calc(100% - 24px);
      overflow: auto;
      background: rgba(var(--ink-rgb), .94);
      color: #eef;
      border: 1px solid rgba(var(--a1-rgb), .5);
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }

    .wb-ov h4 {
      margin: 0 0 6px;
      font-size: 17px;
      padding-inline-end: 26px;
    }

    .wb-ov p {
      margin: 6px 0 0;
    }

    .wb-ov-x {
      position: absolute;
      top: 8px;
      inset-inline-end: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .wb-where {
      display: inline-block;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .08);
      border-inline-start: 4px solid var(--zc);
    }

    .wb-cost {
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, .2);
    }

    .wb-hud {
      position: absolute;
      z-index: 3;
      top: 10px;
      inset-inline-start: 12px;
      max-width: calc(100% - 24px);
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, .55);
      padding: 6px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      line-height: 2;
    }

    .wb-loc {
      position: absolute;
      z-index: 3;
      top: 56px;
      inset-inline-start: 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(var(--a2-rgb), .85);
      padding: 6px 14px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
    }

    .wb-prompt {
      position: absolute;
      z-index: 4;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 200px);
      padding: 10px 18px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 0;
      color: #111;
      background: #facc15;
      font: inherit;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
      animation: wbPulse 1.2s ease-in-out infinite;
    }

    @keyframes wbPulse {
      50% {
        transform: translateX(-50%) scale(1.05);
      }
    }

    .wb-pad {
      position: absolute;
      z-index: 3;
      bottom: 14px;
      inset-inline-end: 14px;
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 4px;
    }

    .wb-pad button {
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .3);
      background: rgba(0, 0, 0, .5);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }

    .wb-pad button:active {
      background: rgba(var(--a2-rgb), .8);
    }

    @media (max-width: 600px) {
      .wb-stage {
        height: 480px;
      }

      .wb-prompt {
        max-width: calc(100% - 24px);
        bottom: 170px;
      }

      .wb-hud {
        display: none;
      }

      .wb-loc {
        top: 10px;
      }
    }

    /* ===== صانع البنية التحتية: نسخة اللعبة ===== */
    .wb-head h3 small {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-inline-start: 8px;
    }

    .wb-tiles {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    }

    .wb-tile {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .wb-tile>i {
      font-style: normal;
      font-size: 26px;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a2-rgb), .15);
      flex: none;
    }

    .wb-tile b {
      font-size: 19px;
    }

    .wb-tile b em {
      font-size: 12px;
      font-weight: 600;
    }

    .wb-stage {
      height: min(72vh, 680px);
      min-height: 460px;
      border-radius: min(calc(20px * var(--xrk, .7)), var(--xrmax, 999px));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    }

    .wb-stage:fullscreen,
    .wb-stage:-webkit-full-screen {
      height: 100vh;
      width: 100vw;
      border-radius: 0;
    }

    .wb-stage.walking::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 140px rgba(0, 0, 0, .55);
      z-index: 1;
    }

    .wb-load {
      flex-direction: column;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .wb-load b {
      font-size: 18px;
    }

    .wb-load small {
      color: #aab;
    }

    .wb-spin {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, .15);
      border-top-color: var(--a2l);
      animation: wbSpin 0.9s linear infinite;
    }

    @keyframes wbSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .wb-tb {
      position: absolute;
      z-index: 6;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      pointer-events: none;
    }

    .wb-seg {
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--ink-rgb), .72);
      border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .wb-seg button {
      padding: 7px 12px;
      border: 0;
      border-radius: min(calc(9px * var(--xrk, .7)), var(--xrmax, 999px));
      background: transparent;
      color: #f4eced;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .wb-seg button:hover {
      background: rgba(255, 255, 255, .08);
    }

    .wb-seg button.on {
      color: #fff;
      background: linear-gradient(135deg, var(--a2), var(--a3));
    }

    .wb-lenstip {
      position: absolute;
      z-index: 3;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: min(620px, calc(100% - 24px));
      text-align: center;
      font-size: 12.5px;
      color: #fff;
      background: rgba(var(--ink-rgb), .72);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 6px 12px;
      pointer-events: none;
    }

    .wb-stage .wb-ov {
      top: 58px;
      z-index: 7;
    }

    .wb-hud {
      top: auto;
      bottom: 12px;
      inset-inline-start: 12px;
      max-width: calc(100% - 200px);
      font-size: 11.5px;
      background: rgba(var(--ink-rgb), .65);
      border: 1px solid rgba(255, 255, 255, .1);
      z-index: 3;
    }

    .wb-loc {
      top: auto;
      bottom: 64px;
      inset-inline-start: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(var(--ink-rgb), .78);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 8px 14px;
      font-size: 13px;
    }

    .wb-loc i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .wb-loc span {
      color: var(--a1l);
      font-size: 12px;
    }

    .wb-prompt {
      bottom: 110px;
      animation: none;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .wb-prompt span {
      font-weight: 600;
      font-size: 12.5px;
      opacity: .85;
    }

    .wb-cross {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, .35);
      pointer-events: none;
    }

    .wb-stage .ws-hint {
      z-index: 3;
    }

    @media (max-width: 700px) {
      .wb-seg button {
        padding: 6px 8px;
        font-size: 12px;
      }

      .wb-lenstip {
        top: 96px;
      }

      .wb-stage .wb-ov {
        top: 96px;
      }

      .wb-loc {
        bottom: 170px;
      }

      .wb-prompt {
        bottom: 220px;
      }
    }

    /* لوحة الشرح أسفل اللعبة */
    .wb-info {
      margin-top: 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: min(calc(20px * var(--xrk, .7)), var(--xrmax, 999px));
      overflow: hidden;
    }

    .wb-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: rgba(var(--a2-rgb), .06);
    }

    .wb-tabs button {
      flex: 1;
      min-width: 120px;
      padding: 14px 10px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 800;
      font-size: 14.5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .wb-tabs button:hover {
      color: var(--text);
    }

    .wb-tabs button.on {
      color: var(--text);
      border-bottom-color: var(--pink);
      background: rgba(var(--a3-rgb), .08);
    }

    .wb-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      line-height: 1.85;
      font-size: 14px;
    }

    .wb-lead {
      margin: 0;
      font-size: 15px;
    }

    .wb-h4 {
      margin: 6px 0 0;
      font-size: 16px;
    }

    .wb-facts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 10px;
    }

    .wb-fact {
      display: flex;
      gap: 12px;
      padding: 14px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
    }

    .wb-fact>i {
      font-style: normal;
      font-size: 22px;
      width: 40px;
      height: 40px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a1-rgb), .1);
    }

    .wb-fact>div>b {
      display: block;
      font-size: 14.5px;
    }

    .wb-fact p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75;
    }

    .wb-big {
      font-size: 20px;
      color: var(--text);
    }

    .wb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }

    .wb-dc {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      border-top: 4px solid var(--zc);
      background: rgba(255, 255, 255, .02);
    }

    .wb-dc header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wb-dc header span {
      font-size: 20px;
    }

    .wb-dc header b {
      font-size: 15.5px;
    }

    .wb-badge {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: color-mix(in srgb, var(--zc) 22%, transparent);
    }

    .wb-dc dl {
      margin: 0;
      display: grid;
      gap: 4px;
    }

    .wb-dc dt {
      font-weight: 800;
      font-size: 13px;
    }

    .wb-dc dd {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75;
    }

    .wb-go {
      margin-top: auto;
      align-self: flex-start;
      padding: 7px 12px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: transparent;
      color: var(--cyan);
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .wb-go:hover {
      background: rgba(var(--a1-rgb), .1);
    }

    .wb-devl,
    .wb-dc .wb-swl {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wb-devl .wb-dev {
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr;
      grid-template-rows: auto auto;
      column-gap: 8px;
      text-align: start;
      padding: 8px 10px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .wb-devl .wb-dev:hover {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .06);
    }

    .wb-devl .wb-dev span {
      grid-row: span 2;
      font-size: 20px;
      align-self: center;
    }

    .wb-devl .wb-dev b {
      font-size: 13px;
    }

    .wb-devl .wb-dev small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .wb-dc .wb-swl li {
      padding: 8px 10px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
    }

    .wb-dc .wb-swl li b {
      display: block;
      font-size: 13px;
    }

    .wb-dc .wb-swl li span {
      color: var(--muted);
      font-size: 12.5px;
    }

    .wb-hero {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 18px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(135deg, rgba(var(--a2-rgb), .18), rgba(var(--a3-rgb), .12));
      border: 1px solid var(--border);
    }

    .wb-hero>i {
      font-style: normal;
      font-size: 38px;
    }

    .wb-hero b {
      font-size: 18px;
    }

    .wb-hero p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .wb-topo {
      padding: 16px;
      border-radius: min(calc(16px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, .12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .tchain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tchain b {
      color: var(--cyan);
    }

    .tn {
      padding: 7px 12px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: var(--card-bg);
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .tn.core {
      border-color: var(--a2l);
      box-shadow: 0 0 0 3px rgba(var(--a2l-rgb), .2);
    }

    .tn.sm {
      font-size: 12px;
      padding: 5px 9px;
    }

    .tbr {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding-top: 16px;
      border-top: 2px dashed rgba(var(--a2l-rgb), .5);
      width: 100%;
    }

    .tb {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border-top: 3px solid var(--zc);
      background: rgba(255, 255, 255, .03);
      min-width: 120px;
    }

    .tb::before {
      content: "";
      position: absolute;
      top: -17px;
      left: 50%;
      height: 14px;
      border-left: 2px solid var(--zc);
    }

    .tb small {
      color: var(--muted);
      font-size: 11px;
    }

    .tb em {
      font-style: normal;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .wb-panel .wb-gantt {
      background: transparent;
      border: 0;
      padding: 0;
    }

    /* ===== عناصر اللعبة الكاملة ===== */
    .wb-stage {
      height: min(80vh, 760px);
    }

    .ws-label.npc {
      background: rgba(250, 204, 21, .92);
      color: #1f2937;
      border-color: transparent;
      font-size: 11.5px;
    }

    .wb-quest {
      position: absolute;
      z-index: 4;
      top: 58px;
      inset-inline-start: 12px;
      max-width: min(380px, calc(100% - 260px));
      font-size: 12.5px;
      line-height: 1.8;
      color: #fff;
      background: rgba(var(--ink-rgb), .78);
      border: 1px solid rgba(250, 204, 21, .45);
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 8px 12px;
    }

    .wb-quest b {
      color: #facc15;
      margin-inline-end: 6px;
    }

    .wb-inv {
      display: inline-block;
      margin-top: 4px;
      padding: 1px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a1-rgb), .2);
      border: 1px solid rgba(var(--a1-rgb), .5);
    }

    .wb-mini {
      position: absolute;
      z-index: 4;
      top: 58px;
      inset-inline-end: 12px;
      width: 220px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .15);
    }

    .wb-stage .wb-lenstip {
      top: auto;
      bottom: 150px;
    }

    .wb-toast {
      position: absolute;
      z-index: 9;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 40px);
      padding: 10px 18px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--ink-rgb), .9);
      color: #fff;
      border: 1px solid rgba(var(--a2l-rgb), .6);
      font-size: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
    }

    .wb-fade {
      position: absolute;
      inset: 0;
      z-index: 12;
      background: #000;
      opacity: 0;
      transition: opacity .35s;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 22px;
      pointer-events: none;
    }

    .wb-fade.on {
      opacity: 1;
    }

    .wb-dlg {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 24px));
      background: rgba(var(--ink-rgb), .95);
      color: #eef;
      border: 1px solid rgba(var(--a2l-rgb), .55);
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 14px 16px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .5);
    }

    .wb-dlg-h {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wb-dlg-h b {
      display: block;
      font-size: 16px;
    }

    .wb-dlg-h small {
      color: var(--a2l);
    }

    .wb-ava {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--a2), var(--a3));
      flex: none;
    }

    .wb-dlg-x {
      margin-inline-start: auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      cursor: pointer;
    }

    .wb-dlg-t {
      margin: 10px 0;
      min-height: 3.4em;
      font-size: 14.5px;
      line-height: 1.9;
      max-height: 32vh;
      overflow: auto;
    }

    .wb-dlg-c {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 6px;
    }

    .wb-dlg-c button,
    .wb-elevm button,
    .wb-mapm-l button {
      text-align: start;
      padding: 8px 12px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .05);
      color: #eef;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .wb-dlg-c button:hover,
    .wb-dlg-c button.on,
    .wb-elevm button:hover,
    .wb-mapm-l button:hover {
      border-color: var(--a2l);
      background: rgba(var(--a2-rgb), .25);
    }

    .wb-dlg kbd,
    .wb-elevm kbd,
    .wb-quest kbd,
    .wb-insp kbd {
      display: inline-block;
      padding: 0 6px;
      border-radius: min(calc(5px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .12);
      font-family: inherit;
      font-size: 11px;
    }

    .wb-elevm {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(380px, calc(100% - 24px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(var(--ink-rgb), .95);
      color: #eef;
      border: 1px solid rgba(var(--a1-rgb), .5);
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 16px;
    }

    .wb-elevm>b {
      font-size: 18px;
    }

    .wb-elevm>small {
      color: var(--a2l);
    }

    .wb-elevm button {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 15px;
      font-weight: 700;
    }

    .wb-elevm button em {
      font-style: normal;
      font-size: 13px;
      opacity: .8;
    }

    .wb-elevm button:disabled {
      opacity: .45;
      cursor: default;
    }

    .wb-mapm {
      position: absolute;
      z-index: 10;
      inset: 54px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(var(--ink-rgb), .96);
      color: #eef;
      border: 1px solid rgba(var(--a2l-rgb), .5);
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 14px;
    }

    .wb-mapm-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wb-mapm-h b {
      font-size: 18px;
    }

    .wb-mapm-h button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      cursor: pointer;
    }

    .wb-mapm .wb-input {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .wb-mapm-l {
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .wb-mapm-l section {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .wb-mapm-l h5 {
      margin: 0 0 2px;
      font-size: 13px;
      color: var(--a2l);
    }

    .wb-mapm-l button small {
      display: block;
      color: #94a3b8;
      font-size: 11.5px;
    }

    .wb-insp-btn {
      margin-top: 10px;
      width: 100%;
      padding: 9px;
      border: 0;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(135deg, var(--a2), var(--a3));
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .wb-insp {
      position: absolute;
      inset: 0;
      z-index: 11;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 40% 30%, var(--ink2), var(--ink) 75%);
      color: #eef;
    }

    .wb-insp-h {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      flex-wrap: wrap;
    }

    .wb-insp-h b {
      font-size: 17px;
    }

    .wb-insp-h span {
      color: var(--a2l);
      font-size: 13px;
    }

    .wb-insp-h button {
      margin-inline-start: auto;
      padding: 7px 14px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .wb-insp-b {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
    }

    @media (max-width: 800px) {
      .wb-insp-b {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 45%;
      }
    }

    .wb-insp-v {
      position: relative;
      min-height: 0;
    }

    .wb-insp-v canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    .wb-insp-l {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .wb-insp-lab {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: auto;
      white-space: nowrap;
      font: inherit;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(var(--a1-rgb), .5);
      background: rgba(var(--ink-rgb), .8);
      color: #fff;
      cursor: pointer;
    }

    .wb-insp-lab.on {
      background: var(--a2);
      border-color: transparent;
    }

    .wb-insp-tools {
      position: absolute;
      bottom: 12px;
      inset-inline-start: 12px;
      display: flex;
      gap: 6px;
    }

    .wb-insp-tools button {
      padding: 8px 14px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(var(--ink-rgb), .75);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .wb-insp-tools button.on {
      background: linear-gradient(135deg, var(--a2), var(--a3));
      border-color: transparent;
    }

    .wb-insp-hint {
      position: absolute;
      top: 10px;
      inset-inline-start: 12px;
      color: #94a3b8;
      font-size: 11.5px;
    }

    .wb-insp-s {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-inline-start: 1px solid rgba(255, 255, 255, .1);
      background: rgba(var(--ink-rgb), .6);
    }

    .wb-insp-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .wb-insp-tabs button {
      padding: 10px 4px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--a2l);
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .wb-insp-tabs button.on {
      color: #fff;
      border-bottom-color: var(--a3);
    }

    .wb-insp-c {
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      line-height: 1.8;
    }

    .wb-part {
      text-align: start;
      padding: 9px 11px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .03);
      color: #eef;
      font: inherit;
      cursor: pointer;
    }

    .wb-part b {
      display: block;
      font-size: 13.5px;
    }

    .wb-part span {
      font-size: 12.5px;
      color: #cbd5e1;
    }

    .wb-part.on {
      border-color: var(--a2l);
      background: rgba(var(--a2-rgb), .22);
    }

    .wb-insp-p {
      margin: 0;
    }

    .wb-chain {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wb-chain li {
      position: relative;
      padding: 7px 12px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a1-rgb), .08);
      border: 1px solid rgba(var(--a1-rgb), .25);
    }

    .wb-chain li+li::before {
      content: "⬇";
      position: absolute;
      top: -13px;
      inset-inline-start: 14px;
      font-size: 11px;
      color: var(--a1);
    }

    .wb-cfg {
      width: 100%;
      border-collapse: collapse;
    }

    .wb-cfg th,
    .wb-cfg td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      text-align: start;
      font-size: 12.5px;
    }

    .wb-cfg td {
      font-family: ui-monospace, Consolas, monospace;
      color: var(--a1l);
    }

    .wb-swl2 {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wb-swl2 li {
      padding: 7px 10px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .wb-swl2 li b {
      display: block;
    }

    .wb-swl2 li span {
      color: #cbd5e1;
      font-size: 12.5px;
    }

    .wb-insp-c h5 {
      margin: 6px 0 0;
    }

    @media (max-width: 700px) {
      .wb-quest {
        display: none;
      }

      .wb-mini {
        width: 150px;
      }
    }


    /* ===== صانع البنية التحتية: هاتف المهام (T) + نافذة تنفيذ المهمة + علامات المهام ===== */
    .ws-label.task {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      border-color: transparent;
      font-size: 12px;
      box-shadow: 0 4px 14px rgba(234, 88, 12, .45);
      animation: wbBob 1.6s ease-in-out infinite;
    }

    @keyframes wbBob {
      50% {
        margin-top: -5px;
      }
    }

    .wb-seg .wb-phbtn {
      position: relative;
    }

    .wb-seg .wb-phbtn::after {
      content: "T";
      position: absolute;
      top: 1px;
      inset-inline-end: 2px;
      font-size: 9px;
      font-weight: 800;
      color: #facc15;
    }

    .wb-quest .wb-qt {
      display: block;
      margin-top: 4px;
      color: #fde68a;
    }

    .wb-phone {
      position: absolute;
      z-index: 8;
      top: 56px;
      inset-inline-end: 14px;
      width: 300px;
      height: min(610px, calc(100% - 120px));
      padding: 9px;
      border-radius: min(calc(40px * var(--xrk, .7)), var(--xrmax, 999px));
      direction: rtl;
      background: linear-gradient(145deg, var(--ink3), #0b0d18);
      box-shadow: 0 0 0 2px var(--ink3), 0 26px 60px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(255, 255, 255, .08);
      transform: translateX(-125%) rotate(-7deg);
      opacity: 0;
      transition: transform .38s cubic-bezier(.2, .9, .3, 1.15), opacity .25s;
    }

    :root[dir="ltr"] .wb-phone {
      transform: translateX(125%) rotate(7deg);
    }

    .wb-phone.on,
    :root[dir="ltr"] .wb-phone.on {
      transform: none;
      opacity: 1;
    }

    .wb-phone::before {
      content: "";
      position: absolute;
      inset-inline-start: -3px;
      top: 110px;
      width: 3px;
      height: 54px;
      border-radius: 3px;
      background: var(--ink3);
    }

    .wb-ph-in {
      position: relative;
      height: 100%;
      border-radius: min(calc(32px * var(--xrk, .7)), var(--xrmax, 999px));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #eef;
      background: radial-gradient(120% 55% at 50% 0%, var(--a2d) 0%, var(--ink2) 55%, #060814 100%);
    }

    .wb-ph-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 24px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: #000;
      z-index: 2;
    }

    .wb-ph-status {
      display: flex;
      justify-content: space-between;
      padding: 11px 24px 4px;
      font-size: 11.5px;
      font-weight: 800;
      direction: ltr;
    }

    .wb-ph-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 16px 16px 6px;
    }

    .wb-ph-head b {
      font-size: 19px;
      display: block;
    }

    .wb-ph-head small {
      color: var(--a2l);
      font-size: 11.5px;
      display: block;
      max-width: 190px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wb-ph-x {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      cursor: pointer;
    }

    .wb-ph-sum {
      padding: 4px 16px 10px;
      font-size: 12.5px;
      color: #cbd5e1;
    }

    .wb-ph-bar {
      height: 7px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .1);
      margin-top: 6px;
      overflow: hidden;
    }

    .wb-ph-bar i {
      display: block;
      height: 100%;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(90deg, var(--a1), var(--a2l), var(--a3l));
      transition: width .4s;
    }

    .wb-ph-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
    }

    .wb-ph-t {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 9px;
      padding: 10px;
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .wb-ph-t.next {
      border-color: rgba(250, 204, 21, .75);
      background: rgba(250, 204, 21, .09);
      box-shadow: 0 0 0 3px rgba(250, 204, 21, .12);
    }

    .wb-ph-t.done {
      opacity: .6;
    }

    .wb-ph-ic {
      width: 38px;
      height: 38px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      display: grid;
      place-items: center;
      font-size: 20px;
      background: linear-gradient(135deg, var(--a2), var(--a3));
    }

    .wb-ph-t.done .wb-ph-ic {
      background: rgba(34, 197, 94, .25);
    }

    .wb-ph-t b {
      display: block;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .wb-ph-t small {
      display: block;
      color: var(--a1l);
      font-size: 11.5px;
      margin-top: 2px;
    }

    .wb-ph-t p {
      margin: 4px 0 7px;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .wb-ph-go {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      font: inherit;
      font-weight: 800;
      font-size: 12.5px;
      color: #1c1917;
      background: linear-gradient(135deg, #facc15, #fb923c);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(251, 146, 60, .35);
    }

    .wb-ph-go:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .wb-ph-ok {
      font-size: 12px;
      color: #4ade80;
      font-weight: 800;
    }

    .wb-ph-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px 20px;
      font-size: 11.5px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, .08);
    }

    .wb-ph-foot button {
      border: 0;
      background: none;
      color: var(--a2l);
      font: inherit;
      cursor: pointer;
    }

    .wb-ph-homebar {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .55);
    }

    .wb-phone kbd,
    .wb-taskm kbd,
    .wb-toast kbd,
    .wb-loc kbd {
      display: inline-block;
      padding: 0 6px;
      border-radius: min(calc(5px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .12);
      font-family: inherit;
      font-size: 11px;
      line-height: 1.6;
    }

    .wb-taskm {
      z-index: 11;
      border-color: rgba(250, 204, 21, .6);
    }

    .wb-tbar {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .wb-tbar i {
      flex: 1;
      height: 5px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(255, 255, 255, .12);
    }

    .wb-tbar i.ok {
      background: #22c55e;
    }

    .wb-tbar i.on {
      background: #facc15;
    }

    .wb-taskm .wb-dlg-c button:disabled {
      cursor: default;
    }

    .wb-taskm .wb-dlg-c button.ok {
      border-color: #22c55e;
      background: rgba(34, 197, 94, .25);
    }

    .wb-taskm .wb-dlg-c button.bad {
      border-color: #ef4444;
      background: rgba(239, 68, 68, .16);
      opacity: .7;
      text-decoration: line-through;
    }

    .wb-tfb {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      font-size: 13.5px;
      line-height: 1.8;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .wb-tfb>span {
      flex: 1 1 260px;
    }

    .wb-tfb.ok {
      background: rgba(34, 197, 94, .14);
      border: 1px solid rgba(34, 197, 94, .5);
    }

    .wb-tfb.bad {
      background: rgba(239, 68, 68, .12);
      border: 1px solid rgba(239, 68, 68, .45);
    }

    .wb-tnext {
      margin-inline-start: auto;
      padding: 8px 14px;
      border: 0;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .wb-phone {
        width: min(290px, calc(100% - 24px));
        top: 96px;
        height: calc(100% - 200px);
      }
    }

    /* رمز QR في «ركّب حاسوبك 3D» */
    .pc3d-ar {
      display: block;
      margin: auto auto 0;
      width: 190px;
      max-width: 100%;
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      transition: transform .2s, box-shadow .2s;
    }

    .pc3d-ar img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
    }

    .pc3d-ar:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(var(--a1-rgb), .25);
    }

    .pc3d-panel>* {
      flex-shrink: 0;
    }

    [data-theme="light"] .game-tabs button.on {
      background: linear-gradient(135deg, var(--a2), var(--a3));
    }



    /* ===== استوديو الواجب (ورشة العمل) ===== */
    .hs {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hs-grow {
      flex: 1;
      min-width: 0;
    }

    .hs-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hs-between {
      justify-content: space-between;
    }

    .hs-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hs-muted {
      color: var(--muted);
    }

    .hs-small {
      font-size: 12.5px;
    }

    .hs-hero {
      position: relative;
      overflow: hidden;
      display: flex;
      gap: 18px;
      align-items: flex-start;
      padding: 22px;
      border-radius: min(calc(22px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: radial-gradient(120% 140% at 100% 0%, rgba(var(--a2-rgb), .28), transparent 55%), radial-gradient(90% 120% at 0% 100%, rgba(var(--a1-rgb), .16), transparent 60%), var(--card-bg);
    }

    .hs-hero::after {
      content: "A.P1 · B.M2 · C.D1";
      position: absolute;
      inset-inline-end: 18px;
      bottom: 10px;
      font: 700 12px var(--font-mono);
      letter-spacing: .12em;
      color: rgba(var(--a2l-rgb), .35);
      direction: ltr;
    }

    .hs-hero-ic {
      flex: none;
      width: 66px;
      height: 66px;
      border-radius: min(calc(20px * var(--xrk, .7)), var(--xrmax, 999px));
      display: grid;
      place-items: center;
      font-size: 34px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 10px 30px rgba(var(--a2-rgb), .45);
    }

    .hs-hero h2 {
      margin: 2px 0 6px;
      font-size: clamp(22px, 3vw, 30px);
    }

    .hs-hero p {
      margin: 0 0 12px;
      line-height: 1.9;
      color: var(--text);
      opacity: .92;
    }

    .hs-hero .tag {
      margin: 0;
    }

    .hs-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .hs-pills>span {
      padding: 5px 12px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
    }

    .hs-key {
      padding: 5px 12px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      font: 700 12.5px var(--font-main);
      border: 1px solid var(--border);
    }

    .hs-key.on {
      color: var(--ok);
      border-color: var(--ok);
      background: rgba(52, 211, 153, .1);
    }

    .hs-key.off {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, .6);
      background: rgba(251, 191, 36, .08);
      cursor: pointer;
    }

    .hs-call {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      line-height: 1.85;
      font-size: 14px;
      border: 1px solid var(--border);
      background: var(--card-bg);
    }

    .hs-call-i {
      font-size: 18px;
      line-height: 1.5;
    }

    .hs-call.shield,
    .hs-call.warn {
      border-color: rgba(251, 191, 36, .5);
      background: rgba(251, 191, 36, .08);
    }

    .hs-call.bad {
      border-color: rgba(251, 113, 133, .6);
      background: rgba(251, 113, 133, .1);
    }

    .hs-call.ok {
      border-color: rgba(52, 211, 153, .55);
      background: rgba(52, 211, 153, .1);
    }

    .hs-call.info,
    .hs-call.tip {
      border-color: rgba(var(--a1-rgb), .45);
      background: rgba(var(--a1-rgb), .07);
    }

    .hs-call-a {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .hs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .hs-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: min(calc(20px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 18px;
      backdrop-filter: blur(8px);
    }

    .hs-card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .hs-card-h {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .hs-card-h p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.8;
    }

    .hs-ic {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: min(calc(13px * var(--xrk, .7)), var(--xrmax, 999px));
      display: grid;
      place-items: center;
      font-size: 21px;
      background: rgba(var(--a2-rgb), .16);
      border: 1px solid var(--border);
    }

    .hs-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 0;
      cursor: pointer;
      font: 800 14px var(--font-main);
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      transition: transform .15s, filter .15s, opacity .15s;
      text-decoration: none;
    }

    .hs-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .hs-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hs-btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .hs-btn.ghost:hover:not(:disabled) {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .08);
    }

    .hs-btn.sm {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: min(calc(10px * var(--xrk, .7)), var(--xrmax, 999px));
    }

    .hs-btn.big {
      padding: 13px 22px;
      font-size: 15.5px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
    }

    .hs-btn.hs-glow {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, var(--a3) 55%, var(--a2));
      box-shadow: 0 10px 28px rgba(var(--a3-rgb), .35);
    }

    .hs-btn.danger:hover {
      border-color: var(--bad);
      color: var(--bad);
    }

    .hs-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .hs-drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 26px 16px;
      text-align: center;
      border-radius: min(calc(18px * var(--xrk, .7)), var(--xrmax, 999px));
      cursor: pointer;
      border: 2px dashed rgba(var(--a2l-rgb), .45);
      background: repeating-linear-gradient(135deg, rgba(var(--a2-rgb), .05) 0 12px, transparent 12px 24px);
      transition: border-color .2s, background .2s;
    }

    .hs-drop:hover,
    .hs-drop.over,
    .hs-drop:focus {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .08);
      outline: none;
    }

    .hs-drop-i {
      font-size: 34px;
    }

    .hs-drop b {
      font-size: 15px;
    }

    .hs-drop .hs-btn {
      margin-top: 6px;
      pointer-events: none;
    }

    .hs-paste {
      margin-top: 12px;
    }

    .hs-ta,
    .hs-in {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      color: var(--text);
      background: rgba(0, 0, 0, .22);
      border: 1px solid var(--border);
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      padding: 10px 12px;
      outline: none;
    }

    .hs-ta {
      min-height: 130px;
      resize: vertical;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .hs-in option {
      color: #111;
    }

    .hs-ta:focus,
    .hs-in:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(var(--a1-rgb), .15);
    }

    [data-theme="light"] .hs-ta,
    [data-theme="light"] .hs-in {
      background: #fff;
    }

    .hs-get {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      background: rgba(var(--a2-rgb), .07);
      border: 1px solid var(--border);
    }

    .hs-get h4 {
      margin: 0 0 6px;
    }

    .hs-ul {
      margin: 4px 0;
      padding-inline-start: 20px;
      line-height: 1.9;
      font-size: 14px;
    }

    .hs-ul li::marker {
      color: var(--cyan);
    }

    .hs-file {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: min(calc(14px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
    }

    .hs-file-i {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      display: grid;
      place-items: center;
      font-size: 22px;
      background: rgba(var(--a1-rgb), .12);
    }

    .hs-file-i.sm {
      width: 36px;
      height: 36px;
      font-size: 18px;
    }

    .hs-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .hs-tagc {
      display: inline-block;
      padding: 2px 10px;
      border-radius: min(calc(99px * var(--xrk, .7)), var(--xrmax, 999px));
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
      white-space: nowrap;
    }

    .hs-tagc.ai {
      color: var(--a2l);
      border-color: rgba(var(--a2l-rgb), .6);
    }

    .hs-okline {
      color: var(--ok);
      font-weight: 700;
      margin: 12px 0 6px;
    }

    .hs-pre {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow: auto;
      margin: 0;
      font: 12.5px/1.8 var(--font-main);
      color: var(--muted);
    }

    .hs-h4 {
      margin: 10px 0 6px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hs-h5 {
      margin: 10px 0 2px;
      font-size: 13.5px;
      color: var(--cyan);
    }

    .hs-stages {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hs-stages li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .hs-stages li small {
      color: var(--muted);
    }

    .hs-stages li.active {
      border-color: var(--cyan);
      background: rgba(var(--a1-rgb), .08);
    }

    .hs-stages li.active .hs-st-i {
      display: inline-block;
      animation: hsSpin 1.2s linear infinite;
    }

    .hs-stages li.done {
      border-color: rgba(52, 211, 153, .45);
    }

    .hs-stages li.error {
      border-color: var(--bad);
    }

    @keyframes hsSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* مولّد الواجب المبسّط */
    .hs-gen {
      border-color: rgba(var(--a3-rgb), .35);
      background: radial-gradient(110% 80% at 0% 0%, rgba(var(--a3-rgb), .12), transparent 60%), var(--card-bg);
    }

    .hs-topics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .hs-topic {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: start;
      padding: 9px 10px;
      border-radius: min(calc(12px * var(--xrk, .7)), var(--xrmax, 999px));
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      color: var(--text);
