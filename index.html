  <script id="alx-key-loader">
    /* الذكاء الاصطناعي يعمل عبر السيرفر: المفتاح محفوظ في متغير البيئة GEMINI_API_KEY على Render ولا يصل للمتصفح أبداً.
       Any request to generativelanguage.googleapis.com is routed to /api/gemini/ on this site. */
    (function () {
      function install(w, base) {
        if (w.__alxGeminiPatched) return; w.__alxGeminiPatched = true;
        var orig = w.fetch.bind(w);
        var RE = /^https:\/\/generativelanguage\.googleapis\.com\/v1beta\//;
        w.fetch = function (input, init) {
          try {
            var url = typeof input === "string" ? input : (input && input.url) || "";
            if (RE.test(url)) {
              var o = init ? Object.assign({}, init) : {};
              var h = new w.Headers(o.headers || {});
              h.delete("x-goog-api-key");
              var token = "";
              try { token = JSON.parse(w.localStorage.getItem("alx-sb-auth") || "{}").access_token || ""; } catch (e) { }
              if (token) h.set("Authorization", "Bearer " + token);
              o.headers = h;
              return orig(base + "/" + url.replace(RE, ""), o);
            }
          } catch (e) { }
          return orig(input, init);
        };
      }
      var base = (window.ALX_API_BASE || (location.protocol.indexOf("http") === 0 ? location.origin : "")) + "/api/gemini/v1beta";
      window.GEMINI_API_KEY = "server-managed"; /* قيمة شكلية فقط حتى لا تطلب الواجهة مفتاحاً */
      try {["gemini-key", "u1.geminiKey"].forEach(function (k) {localStorage.removeItem(k);});} catch (e) { }
      install(window, base);
      /* نص التثبيت يُحقن أيضاً داخل إطار قصة المختبر (له window خاص) */
      window.__alxGeminiInstallSrc = "(" + install.toString() + ")(window," + JSON.stringify(base) + ");";
    })();
  </script>
  <style id="platform-css">
    /* منصة Alpha LogicX — يعتمد على متغيرات الموقع الأصلي (--bg, --text, --cyan ...) */

      width: 100%;
      font: inherit;
      color: var(--text);

      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px
    }

    .pf-live-i {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(244, 63, 94, .55);
      background: linear-gradient(90deg, rgba(244, 63, 94, .14), rgba(124, 58, 237, .1))
    }

    .pf-live-i b {
      flex: 1
    }

    .pf-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f43f5e;
      box-shadow: 0 0 0 0 rgba(244, 63, 94, .7);
      animation: pfPulse 1.6s infinite
    }

    @keyframes pfPulse {
      70% {
        box-shadow: 0 0 0 8px rgba(244, 63, 94, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(244, 63, 94, 0)
      }
    }

    .pf-live-tag {
      color: #f43f5e;
      font-weight: 700
    }

    .pf-meet-new {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px
    }

    .pf-meet.live {
      border-color: rgba(244, 63, 94, .6)
    }

    .pf-meet-ic {
      font-size: 30px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(124, 58, 237, .35), rgba(34, 211, 238, .25))
    }

    .pf-mtabs {
      display: flex
    }

    /* زر الخروج: أيقونة فقط على الشاشات المتوسطة حتى لا يغطي تبويب «المنصة» */
    @media (max-width:1500px) {
      #pf-logout .pf-lo-t {
        display: none
      }
    }

    /* --- رنين المكالمات --- */
    .mt-ring {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10080;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: min(380px, 94vw);
      padding: 12px 14px;
      border-radius: 20px;
      color: #eef;
      background: linear-gradient(135deg, rgba(30, 27, 75, .97), rgba(17, 24, 39, .97));
      border: 1px solid rgba(124, 58, 237, .6);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 0 0 4px rgba(124, 58, 237, .15);
      animation: mtDrop .3s ease;
      font-family: var(--font-main)
    }

    .mt-ring-av {
      font-size: 34px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
      animation: mtRing 1.2s ease-in-out infinite
    }

    .mt-ring.out .mt-ring-av {
      animation-duration: 2s
    }

    @keyframes mtRing {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(34, 211, 238, .6)
      }

      50% {
        box-shadow: 0 0 0 10px rgba(34, 211, 238, 0)
      }
    }

    .mt-ring-t {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0
    }

    .mt-ring-t span {
      font-size: 13px;
      color: #a5b4fc
    }

    .mt-rb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      font-size: 19px;
      cursor: pointer;
      color: #fff;
      flex: none;
      transition: transform .15s
    }

    .mt-rb:hover {
      transform: scale(1.08)
    }

    .mt-rb.ok {
      background: #16a34a
    }

    .mt-rb.no {
      background: #dc2626
    }

    /* --- ما قبل الانضمام --- */
    .mt-pre {
      position: fixed;
      inset: 0;
      z-index: 10070;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(5, 4, 20, .82);
      backdrop-filter: blur(6px);
      font-family: var(--font-main);
      color: #eef
    }

    .mt-pre-box {
      width: min(520px, 100%);
      max-height: 100%;
      overflow: auto;
      padding: 18px;
      border-radius: 22px;
      background: #12122a;
      border: 1px solid rgba(124, 58, 237, .5);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6)
    }

    .mt-pre-h {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px
    }

    .mt-pre-h b {
      font-size: 18px
    }

    .mt-pre-h span {
      font-size: 13px;
      color: #a5b4fc
    }

    .mt-pre-v {
      position: relative;
      aspect-ratio: 16/9;
      border-radius: 16px;
      overflow: hidden;
      background: #1d1d36
    }

    .mt-pre-v video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1)
    }

    .mt-pre-v .mt-av {
      display: none
    }

    .mt-pre-v.novid video {
      visibility: hidden
    }

    .mt-pre-v.novid .mt-av {
      display: grid
    }

    .mt-pre-n {
      position: absolute;
      bottom: 8px;
      inset-inline-start: 10px;
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .55)
    }

    .mt-pre-lv {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, .08)
    }

    .mt-pre-lv i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #22c55e, #22d3ee);
      transition: width .1s
    }

    .mt-pre-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .mt-pre .pf-msg {
      margin: 10px 0 0;
      font-size: 13px
    }

    /* --- غرفة الاجتماع --- */
    body.mt-open {
      overflow: hidden
    }

    .mt-room {
      --mt-bg: #0c0c1d;
      --mt-tile: #1b1b33;
      --mt-line: rgba(255, 255, 255, .09);
      position: fixed;
      inset: 0;
      z-index: 10040;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 20% 0%, rgba(124, 58, 237, .18), transparent 55%), var(--mt-bg);
      color: #eef;
      font-family: var(--font-main)
    }

    .mt-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--mt-line)
    }

    .mt-ttl {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .mt-ttl b {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mt-live {
      color: #f43f5e;
      animation: pfPulseT 1.6s infinite
    }

    @keyframes pfPulseT {
      50% {
        opacity: .35
      }
    }

    .mt-time {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #a5b4fc;
      direction: ltr
    }

    .mt-tacts {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .mt-cnt {
      white-space: nowrap;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .07);
      cursor: pointer
    }

    .mt-ib {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--mt-line);
      background: rgba(255, 255, 255, .05);
      color: #eef;
      cursor: pointer;
      font-size: 15px
    }

    .mt-body {
      flex: 1;
      display: flex;
      min-height: 0
    }

    .mt-stage {
      position: relative;
      flex: 1;
      min-width: 0;
      padding: 12px
    }

    .mt-grid {
      display: grid;
      gap: 10px;
      height: 100%;
      grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr)
    }

    .mt-grid.spot {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      grid-template-rows: minmax(0, 1fr);
      grid-auto-rows: 110px;
      overflow-y: auto
    }

    .mt-grid.spot .mt-tile.big {
      grid-column: 1/-1;
      grid-row: 1
    }

    .mt-tile {
      position: relative;
      min-height: 0;
      border-radius: 16px;
      overflow: hidden;
      background: var(--mt-tile);
      border: 2px solid transparent;
      transition: border-color .15s, box-shadow .15s
    }

    .mt-tile video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000
    }

    .mt-tile.scr video {
      object-fit: contain
    }

    .mt-tile.mirror video {
      transform: scaleX(-1)
    }

    .mt-tile.novid video {
      visibility: hidden
    }

    .mt-av {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: radial-gradient(circle at 50% 40%, rgba(124, 58, 237, .35), transparent 65%)
    }

    .mt-av span {
      font-size: clamp(34px, 7vw, 74px);
      width: 1.7em;
      height: 1.7em;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .07);
      transition: box-shadow .15s
    }

    .mt-tile.novid .mt-av {
      display: grid
    }

    .mt-tile.talk {
      border-color: #22d3ee;
      box-shadow: 0 0 0 2px rgba(34, 211, 238, .35), 0 0 26px rgba(34, 211, 238, .35)
    }

    .mt-tile.talk .mt-av span {
      box-shadow: 0 0 0 6px rgba(34, 211, 238, .35)
    }

    .mt-tile.hand {
      border-color: #facc15
    }

    .mt-lbl {
      position: absolute;
      bottom: 8px;
      inset-inline-start: 8px;
      max-width: calc(100% - 16px);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .6);
      font-size: 12.5px
    }

    .mt-lbl b {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mt-hd {
      font-size: 15px;
      animation: mtWave 1s ease-in-out infinite
    }

    @keyframes mtWave {
      50% {
        transform: rotate(14deg)
      }
    }

    .mt-st {
      position: absolute;
      top: 8px;
      inset-inline-start: 8px;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .6)
    }

    .mt-st:empty {
      display: none
    }

    .mt-pin {
      position: absolute;
      top: 8px;
      inset-inline-end: 8px;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 0;
      background: rgba(0, 0, 0, .5);
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s
    }

    .mt-tile:hover .mt-pin,
    .mt-tile.pinned .mt-pin {
      opacity: 1
    }

    .mt-play {
      position: absolute;
      inset: auto 0 44px;
      margin: auto;
      width: max-content;
      padding: 7px 12px;
      border-radius: 10px;
      border: 0;
      background: #7c3aed;
      color: #fff;
      font: inherit;
      cursor: pointer
    }

    .mt-alone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 16px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .5);
      font-size: 14px;
      color: #c7d2fe;
      pointer-events: none
    }

    .mt-grid .mt-tile.self:only-child {
      border-radius: 20px
    }

    .mt-fly {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    .mt-emo {
      position: absolute;
      font-size: 38px;
      transform: translate(-50%, 0);
      animation: mtFly 2.5s ease-out forwards
    }

    @keyframes mtFly {
      0% {
        opacity: 0;
        transform: translate(-50%, 10px) scale(.6)
      }

      15% {
        opacity: 1;
        transform: translate(-50%, -10px) scale(1.15)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -170px) scale(1)
      }
    }

    .mt-side {
      width: 330px;
      flex: none;
      display: flex;
      flex-direction: column;
      border-inline-start: 1px solid var(--mt-line);
      background: rgba(10, 10, 28, .92)
    }

    .mt-side-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--mt-line)
    }

    .mt-stabs {
      display: flex;
      gap: 4px
    }

    .mt-stabs button {
      font: 700 13px var(--font-main);
      color: #cbd5e1;
      background: none;
      border: 0;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer
    }

    .mt-stabs button.on {
      background: rgba(124, 58, 237, .35);
      color: #fff
    }

    .mt-side-b {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: auto
    }

    .mt-msgs {
      flex: 1;
      overflow: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .mt-msg {
      display: flex;
      gap: 8px;
      align-items: flex-start
    }

    .mt-msg>span {
      font-size: 22px
    }

    .mt-msg b {
      display: block;
      font-size: 11.5px;
      color: #a5b4fc;
      font-weight: 600
    }

    .mt-msg p {
      margin: 2px 0 0;
      padding: 7px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .07);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13.5px;
      line-height: 1.7
    }

    .mt-msg.me p {
      background: rgba(124, 58, 237, .3)
    }

    .mt-empty {
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      padding: 20px 10px
    }

    .mt-cform {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid var(--mt-line)
    }

    .mt-cform input {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: #eef;
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--mt-line);
      border-radius: 10px;
      padding: 9px 11px;
      outline: none
    }

    .mt-cform input:focus {
      border-color: #22d3ee
    }

    .mt-cform button {
      width: 42px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      color: #fff;
      font-size: 16px;
      cursor: pointer
    }

    .mt-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--mt-line)
    }

    .mt-tools button,
    .mt-pp-a button {
      font: 600 12.5px var(--font-main);
      color: #eef;
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--mt-line);
      border-radius: 9px;
      padding: 6px 9px;
      cursor: pointer
    }

    .mt-tools button.bad,
    .mt-pp-a button.bad,
    .mt-menu .bad {
      background: rgba(220, 38, 38, .25);
      border-color: rgba(239, 68, 68, .5)
    }

    .mt-sub {
      padding: 10px 12px 4px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700
    }

    .mt-pp {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px
    }

    .mt-pp.hand {
      color: #fde68a;
      font-size: 13px;
      padding: 3px 14px
    }

    .mt-pp-av {
      font-size: 24px
    }

    .mt-pp-n {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .mt-pp-n b {
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mt-pp-n small {
      font-size: 11.5px;
      color: #94a3b8
    }

    .mt-pp-ic {
      font-size: 13px;
      letter-spacing: 2px
    }

    .mt-pp-a {
      display: flex;
      gap: 4px
    }

    .mt-pp-a button {
      padding: 4px 6px
    }

    .mt-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--mt-line);
      background: rgba(8, 8, 22, .85)
    }

    .mt-b {
      position: relative;
      min-width: 66px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 7px 8px;
      border-radius: 14px;
      border: 1px solid var(--mt-line);
      background: rgba(255, 255, 255, .06);
      color: #eef;
      font: 600 11.5px var(--font-main);
      cursor: pointer;
      transition: background .15s, transform .15s
    }

    .mt-b:hover {
      background: rgba(255, 255, 255, .12);
      transform: translateY(-1px)
    }

    .mt-b i {
      font-style: normal;
      font-size: 19px;
      line-height: 1
    }

    .mt-b.off {
      background: rgba(220, 38, 38, .22);
      border-color: rgba(239, 68, 68, .5)
    }

    .mt-b.on {
      background: rgba(124, 58, 237, .4);
      border-color: rgba(167, 139, 250, .7)
    }

    .mt-b.end {
      background: #dc2626;
      border-color: #dc2626
    }

    .mt-b.end i {
      transform: rotate(135deg)
    }

    .mt-b.end:hover {
      background: #b91c1c
    }

    .mt-badge {
      position: absolute;
      top: 2px;
      inset-inline-end: 8px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 99px;
      background: #f43f5e;
      color: #fff;
      font: 700 10.5px/17px var(--font-main);
      font-style: normal
    }

    .mt-b.show-mini {
      display: none
    }

    .mt-pop {
      position: absolute;
      z-index: 3;
      padding: 8px;
      border-radius: 16px;
      background: #1d1d3a;
      border: 1px solid rgba(124, 58, 237, .5);
      box-shadow: 0 14px 40px rgba(0, 0, 0, .5)
    }

    .mt-reacts {
      display: flex;
      gap: 4px
    }

    .mt-reacts button {
      font-size: 26px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: none;
      cursor: pointer;
      transition: transform .12s
    }

    .mt-reacts button:hover {
      transform: scale(1.25);
      background: rgba(255, 255, 255, .08)
    }

    .mt-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 190px
    }

    .mt-menu button {
      font: 700 13.5px var(--font-main);
      color: #eef;
      text-align: start;
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--mt-line);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer
    }

    /* وضع مصغّر: نافذة عائمة أثناء تصفّح الموقع */
    .mt-room.mini {
      inset: auto auto 16px 16px;
      width: min(340px, calc(100vw - 32px));
      height: auto;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(124, 58, 237, .6);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .55)
    }

    .mt-room.mini .mt-top {
      padding: 7px 10px
    }

    .mt-room.mini .mt-ttl b {
      font-size: 13px;
      max-width: 150px
    }

    .mt-room.mini .mt-cnt {
      display: none
    }

    .mt-room.mini .mt-stage {
      padding: 6px;
      height: 190px;
      flex: 1 1 auto;
      width: 100%
    }

    .mt-room.mini .mt-body {
      flex: none
    }

    .mt-room.mini .mt-grid {
      display: block;
      height: 100%
    }

    .mt-room.mini .mt-tile {
      display: none;
      height: 100%
    }

    .mt-room.mini .mt-tile.focus {
      display: block
    }

    .mt-room.mini .mt-alone {
      font-size: 12px
    }

    .mt-room.mini .mt-bar {
      padding: 6px;
      gap: 4px
    }

    .mt-room.mini .mt-b {
      min-width: 0;
      flex: 1;
      padding: 6px 4px
    }

    .mt-room.mini .mt-b span {
      display: none
    }

    .mt-room.mini .hide-mini,
    .mt-room.mini [data-m="mini"].mt-ib {
      display: none
    }

    .mt-room.mini .mt-b.show-mini {
      display: flex
    }

    @media (max-width:760px) {
      .mt-side {
        position: absolute;
        inset: 0;
        width: auto;
        z-index: 4
      }

      .mt-room.side .mt-bar {
        display: none
      }

      .mt-bar {
        flex-wrap: nowrap;
        gap: 4px;
        padding-inline: 8px
      }

      .mt-b {
        min-width: 0;
        flex: 1 1 0;
        padding: 9px 0;
        border-radius: 12px
      }

      .mt-b span {
        display: none
      }

      .mt-b i {
        font-size: 20px
