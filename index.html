        linear-gradient(rgba(124, 58, 237, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, .07) 1px, transparent 1px);
      background-size: 52px 52px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 78%);
      mask-image: radial-gradient(ellipse at center, #000 25%, transparent 78%);
    }

    /* وهج يتبع المؤشر */
    #cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 340px;
      height: 340px;
      margin: -170px 0 0 -170px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle, rgba(34, 211, 238, .13), transparent 65%);
      transition: transform .12s ease-out;
    }

    /* الشريط العلوي */
    nav {
      background: linear-gradient(180deg, rgba(14, 10, 40, .85), rgba(4, 4, 15, .6));
      box-shadow: 0 1px 0 rgba(34, 211, 238, .18), 0 10px 40px rgba(0, 0, 0, .4);
    }

    .logo {
      filter: drop-shadow(0 0 10px rgba(124, 58, 237, .6));
    }

    .tab:hover {
      color: #fff;
      border-color: var(--border);
    }

    .tab.on {
      background: linear-gradient(90deg, rgba(34, 211, 238, .18), rgba(124, 58, 237, .22));
    }

    /* بطاقة الشريحة: إطار نيون يدور حول الصورة */
    .slide-card {
      position: relative;
      padding: 2px;
      border-radius: 13px;
      background: conic-gradient(from var(--angle), var(--cyan), var(--purple), var(--pink), var(--cyan));
      animation: spin-border 6s linear infinite;
      box-shadow: 0 0 60px rgba(124, 58, 237, .35), 0 25px 80px rgba(0, 0, 0, .6);
    }

    .slide-card:hover {
      box-shadow: 0 0 90px rgba(34, 211, 238, .4), 0 30px 100px rgba(124, 58, 237, .5);
    }

    .slide-frame,
    .slide-card:hover .slide-frame {
      border: 0;
      border-radius: 11px;
      box-shadow: none;
    }

    @keyframes spin-border {
      to {
        --angle: 360deg;
      }
    }

    /* عنوان الشريحة */
    .slide-caption {
      padding: 8px 22px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(10, 8, 34, .7);
      backdrop-filter: blur(8px);
    }

    /* شريحة الغلاف */
    .intro {
      position: relative;
    }

    .intro::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(620px, 90vw);
      height: min(620px, 90vw);
      margin: calc(min(620px, 90vw) / -2) 0 0 calc(min(620px, 90vw) / -2);
      border-radius: 50%;
      border: 1px dashed rgba(34, 211, 238, .22);
      z-index: -1;
      animation: rotate-ring 40s linear infinite;
    }

    .intro h1 {
      background-size: 220% 100%;
      animation: shimmer 6s linear infinite, rise .9s both;
      filter: drop-shadow(0 0 28px rgba(124, 58, 237, .55));
    }

    .stat {
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }

    .stat:hover {
      transform: translateY(-6px);
      border-color: var(--cyan);
      box-shadow: 0 10px 30px rgba(34, 211, 238, .25);
    }

    @keyframes shimmer {
      to {
        background-position: -220% 0;
      }
    }

    @keyframes rotate-ring {
      to {
        transform: rotate(360deg);
      }
    }

    /* شريط التحكم والتقدم */
    .controls {
      background: rgba(8, 6, 28, .6);
      backdrop-filter: blur(10px);
    }

    #progress-bar i {
      box-shadow: 0 0 14px var(--cyan);
    }

    .small-btn {
      transition: .25s;
    }

    .small-btn:hover {
      box-shadow: 0 0 16px rgba(34, 211, 238, .35);
    }

    /* الاختبار */
    .quiz-card {
      background: linear-gradient(160deg, rgba(26, 20, 66, .75), rgba(10, 8, 32, .75));
      box-shadow: 0 20px 70px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
    }

    .progress-track i {
      box-shadow: 0 0 12px var(--pink);
    }

    .option:hover:not(:disabled) {
      box-shadow: 0 0 20px rgba(34, 211, 238, .25);
      background: rgba(34, 211, 238, .06);
    }

    .option.correct {
      box-shadow: 0 0 24px rgba(52, 211, 153, .3);
    }

    .option.wrong {
      animation: shake .45s;
    }

    @keyframes shake {
      20% {
        transform: translateX(8px);
      }

      40% {
        transform: translateX(-8px);
      }

      60% {
        transform: translateX(5px);
      }

      80% {
        transform: translateX(-3px);
      }
    }

    .btn {
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      box-shadow: 0 10px 40px rgba(244, 63, 142, .5);
    }

    /* فريق العمل */
    .member {
      position: relative;
      padding-top: 38px;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }

    .member:hover {
      transform: translateY(-6px);
      border-color: var(--purple);
      box-shadow: 0 14px 40px rgba(124, 58, 237, .35);
    }

    .avatar {
      position: absolute;
      top: -22px;
      left: 50%;
      margin-left: -26px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 900 22px var(--font-main);
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 0 22px rgba(124, 58, 237, .6);
      border: 2px solid var(--bg);
    }

    .member.lead .avatar {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      box-shadow: 0 0 30px rgba(34, 211, 238, .7);
    }

    /* شاشة البداية */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #14103a, var(--bg) 70%);
      transition: opacity .8s, visibility .8s;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      font: 700 clamp(34px, 8vw, 72px) var(--font-mono);
      letter-spacing: .12em;
      direction: ltr;
      animation: rise 1s both;
    }

    .splash-logo b {
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .splash-bar {
      width: 220px;
      height: 3px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
    }

    .splash-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      animation: load-bar 1.7s ease forwards;
    }

    #splash small {
      font: 700 11px var(--font-mono);
      letter-spacing: .3em;
      color: var(--muted);
    }

    @keyframes load-bar {
      to {
        width: 100%;
      }
    }

    /* نظرة عامة على كل الشرائح */
    #overview {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      padding: 70px 24px 24px;
      overflow: auto;
      background: rgba(4, 4, 15, .94);
      backdrop-filter: blur(12px);
    }

    #overview.on {
      display: block;
      animation: fade-up .4s;
    }

    .overview-head {
      position: fixed;
      top: 14px;
      right: 24px;
      left: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .thumb {
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }

    .thumb:hover,
    .thumb.current {
      transform: translateY(-5px) scale(1.02);
      border-color: var(--cyan);
      box-shadow: 0 10px 34px rgba(34, 211, 238, .3);
    }

    .thumb img {
      display: block;
      width: 100%;
    }

    .thumb div {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .thumb span {
      color: var(--cyan);
      font-family: var(--font-mono);
      margin-left: 6px;
    }

    .thumb-cover {
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      font: 700 22px var(--font-mono);
      background: linear-gradient(135deg, rgba(124, 58, 237, .4), rgba(34, 211, 238, .2));
    }

    #confetti {
      position: fixed;
      inset: 0;
      z-index: 70;
      pointer-events: none;
    }

    /* ================================================== */
    /* ===== ميزات إضافية: ثيم فاتح، بحث، طباعة، أدوات الاختبار ===== */
    /* ================================================== */

    .icon-btn {
      font-size: 16px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      transition: .25s;
    }

    .icon-btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(34, 211, 238, .4);
    }

    #overview-search {
      flex: 1;
      max-width: 340px;
      margin: 0 20px;
      font: 600 15px var(--font-main);
      color: var(--text);
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 9px 18px;
      outline: none;
    }

    #overview-search:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(34, 211, 238, .3);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      max-width: 90vw;
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid var(--cyan);
      background: rgba(10, 8, 34, .95);
      color: #fff;
      font-weight: 600;
      animation: fade-up .4s;
    }

    .quiz-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .quiz-tools select {
      font: 600 14px var(--font-main);
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      max-width: 100%;
    }

    .quiz-tools option {
      background: #14103a;
      color: #fff;
    }

    #quiz-status {
      font-size: 13px;
      color: var(--muted);
    }

    .small-btn:disabled {
      opacity: .5;
      cursor: wait;
    }

    /* ---------- الوضع الفاتح ---------- */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f1f2ff;
      --text: #161640;
      --muted: #565b86;
      --card-bg: rgba(255, 255, 255, .85);
      --border: rgba(100, 80, 210, .28);
      --cyan: #0891b2;
      --purple: #6d28d9;
      --pink: #db2777;
    }

    [data-theme="light"] .glow {
      opacity: .15;
    }

    [data-theme="light"] body::before {
      opacity: .5;
    }

    [data-theme="light"] #cursor-glow {
      background: radial-gradient(circle, rgba(124, 58, 237, .12), transparent 65%);
    }

    [data-theme="light"] nav {
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 1px 0 var(--border), 0 10px 30px rgba(80, 60, 180, .12);
    }

    [data-theme="light"] .tab.on {
      color: var(--text);
    }

    [data-theme="light"] .controls,
    [data-theme="light"] .slide-caption,
    [data-theme="light"] .arrow {
      background: rgba(255, 255, 255, .85);
      color: var(--text);
    }

    [data-theme="light"] .dots button {
      background: #c9c9ee;
    }

    [data-theme="light"] .small-btn {
      color: var(--text);
    }

    [data-theme="light"] #progress-bar,
    [data-theme="light"] .progress-track {
      background: rgba(80, 60, 180, .12);
    }

    [data-theme="light"] .quiz-card {
      background: linear-gradient(160deg, #fff, #ecebff);
      box-shadow: 0 16px 50px rgba(80, 60, 180, .15);
    }

    [data-theme="light"] .option {
      background: rgba(80, 60, 180, .05);
      color: var(--text);
    }

    [data-theme="light"] .explanation {
      background: rgba(8, 145, 178, .08);
    }

    [data-theme="light"] .about-card,
    [data-theme="light"] .member,
    [data-theme="light"] .stat,
    [data-theme="light"] .review div {
      background: rgba(255, 255, 255, .8);
    }

    [data-theme="light"] .bubble.bot {
      background: rgba(80, 60, 180, .08);
    }

    [data-theme="light"] #ai-panel {
      background: rgba(255, 255, 255, .97);
      color: var(--text);
    }

    [data-theme="light"] #ai-settings input,
    [data-theme="light"] #ai-input,
    [data-theme="light"] #overview-search {
      background: rgba(80, 60, 180, .06);
      color: var(--text);
    }

    [data-theme="light"] #overview {
      background: rgba(241, 242, 255, .96);
    }

    [data-theme="light"] .thumb {
      background: #fff;
    }

    [data-theme="light"] .intro h2,
    [data-theme="light"] .intro p {
      color: var(--text);
    }

    /* ---------- الطباعة (تصدير PDF) ---------- */
    #print-area {
      display: none;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 10mm;
      }

      body>*:not(#print-area) {
        display: none !important;
      }

      body {
        background: #fff !important;
        color: #111 !important;
        padding: 0;
      }

      #print-area {
        display: block;
        direction: rtl;
        font-family: var(--font-main);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .print-page {
        page-break-after: always;
        text-align: center;
        color: #111;
      }

      .print-page h1 {
        font-size: 44px;
        margin: 60px 0 10px;
      }

      .print-page h2 {
        font-size: 22px;
        margin-bottom: 8px;
      }

      .print-page img {
        max-width: 100%;
        max-height: 140mm;
        border-radius: 6px;
      }

      .print-page p {
        font-size: 15px;
        margin-top: 8px;
      }

      .print-quiz {
        color: #111;
      }

      .print-question {
        margin: 14px 0;
        page-break-inside: avoid;
        line-height: 1.8;
      }

      .print-question small {
        color: #444;
        display: block;
      }
    }

    /* ================================================== */
    /* ===== ترتيب الأزرار: الشريط العلوي وشريط التحكم ===== */
    /* ================================================== */

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      font: 700 14px var(--font-main);
      color: var(--text);
      background: rgba(34, 211, 238, .08);
      border: 1px solid rgba(34, 211, 238, .45);
      border-radius: 99px;
      padding: 7px 16px;
      cursor: pointer;
      transition: .25s;
    }

    .nav-btn:hover {
      box-shadow: 0 0 18px rgba(34, 211, 238, .4);
    }

    /* القائمة المنسدلة */
    .menu-wrap {
      position: relative;
    }

    .menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      z-index: 80;
      width: 300px;
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(12, 9, 38, .97);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    }

    .menu.open {
      display: flex;
      animation: fade-up .25s;
    }

    .menu-item {
      text-align: right;
      font-family: var(--font-main);
      color: var(--text);
      background: none;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
      transition: background .2s;
    }

    .menu-item:hover {
      background: rgba(124, 58, 237, .22);
    }

    .menu-item b {
      display: block;
      font-size: 14px;
    }

    .menu-item small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    /* شريط التحكم: أدوات يمين، نقاط وسط، عدّاد يسار */
    .controls {
      padding: 8px 18px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      font: 600 13px var(--font-main);
      color: var(--text);
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      transition: .2s;
    }

    .tool-btn:hover {
      border-color: var(--border);
      background: rgba(34, 211, 238, .08);
    }

    .divider {
      width: 1px;
      height: 20px;
      margin: 0 4px;
      background: var(--border);
    }

    /* نافذة الملخص */
    #summary-modal {
      position: fixed;
      inset: 0;
      z-index: 65;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 2, 10, .75);
      backdrop-filter: blur(8px);
    }

    #summary-modal.on {
      display: flex;
      animation: fade-up .3s;
    }

    .summary-box {
      width: min(860px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      border: 1px solid var(--cyan);
      background: #0c0926;
      box-shadow: 0 30px 100px rgba(0, 0, 0, .7), 0 0 50px rgba(34, 211, 238, .2);
      overflow: hidden;
    }

    .summary-box header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      font-weight: 900;
      border-bottom: 1px solid var(--border);
    }

    .summary-box footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }

    #summary-body {
      flex: 1;
      overflow: auto;
      padding: 22px 26px;
    }

    .btn-secondary {
      font: 700 14px var(--font-main);
      color: var(--text);
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      transition: .2s;
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(34, 211, 238, .3);
    }

    .summary-box button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .summary-loading {
      text-align: center;
      padding: 70px 0;
      color: var(--muted);
    }

    .spinner {
      width: 46px;
      height: 46px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .1);
      border-top-color: var(--cyan);
      animation: rotate-ring 1s linear infinite;
    }

    .summary-error {
      padding: 40px 10px;
      text-align: center;
      color: var(--bad);
      line-height: 1.8;
    }

    /* مستند الملخص */
    .summary-doc h1 {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .summary-doc h2 {
      margin: 22px 0 8px;
      font-size: 19px;
      color: var(--cyan);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .summary-doc .doc-sub {
      color: var(--muted);
      margin-bottom: 14px;
    }

    .summary-doc p,
    .summary-doc li {
      line-height: 1.95;
      font-size: 15px;
    }

    .summary-doc li {
      margin-bottom: 4px;
    }

    .summary-doc ul {
      padding-right: 22px;
    }

    .doc-meta {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 14px;
    }

    .doc-meta td {
      border: 1px solid var(--border);
      padding: 8px 12px;
    }

    .doc-meta td:first-child {
      width: 26%;
      font-weight: 700;
      background: rgba(124, 58, 237, .15);
    }

    /* الوضع الفاتح */
    [data-theme="light"] .menu,
    [data-theme="light"] .summary-box {
      background: #fff;
    }

    [data-theme="light"] .btn-secondary,
    [data-theme="light"] .tool-btn {
      color: var(--text);
    }

    /* الطباعة: المستند بألوان بسيطة */
    @media print {
      .summary-doc h1 {
        color: #4c1d95;
        -webkit-text-fill-color: #4c1d95;
        background: none;
      }

      .summary-doc h2 {
        color: #0e7490;
        border-color: #bbb;
      }

      .summary-doc .doc-sub {
        color: #555;
      }

      .doc-meta td {
        border-color: #bbb;
      }

      .doc-meta td:first-child {
        background: #eee;
      }

      .summary-doc p,
      .summary-doc li {
        font-size: 13px;
      }
    }

    /* الشاشات الصغيرة */
    @media (max-width: 860px) {
      nav {
        flex-wrap: wrap;
        gap: 8px;
      }

      .tabs {
        order: 3;
        width: 100%;
        justify-content: center;
      }

      .tool-btn .label {
        display: none;
      }

      .menu {
        left: auto;
        right: 0;
      }
    }

    /* ================================================== */
    /* ===== تصغير الواجهة وترتيبها ===== */
    /* ================================================== */

    nav {
      padding: 6px 16px;
    }

    .logo {
      font-size: 15px;
    }

    .tabs {
      gap: 4px;
    }

    .tab {
      font-size: 12.5px;
      padding: 5px 13px;
    }

    .nav-actions {
      gap: 8px;
    }

    .nav-btn {
      font-size: 12.5px;
      padding: 5px 13px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      font-size: 14px;
    }

    #ai-toggle {
      font-size: 12.5px;
      padding: 5px 13px;
    }

    #deck {
      height: calc(100vh - var(--nav-h, 44px));
      min-height: 440px;
    }

    .slide {
      padding: 8px 56px;
    }

    .slide-card .slide-frame img,
    .slide-frame img {
      max-height: calc(100vh - 150px + var(--nav-off, 0px));
    }

    .slide-caption {
      font-size: 14px;
      padding: 5px 16px;
      margin-top: 8px;
    }

    .arrow {
      width: 34px;
      height: 34px;
      font-size: 15px;
    }

    #next-btn {
      left: 10px;
    }

    #prev-btn {
      right: 10px;
    }

    .controls {
      padding: 4px 12px;
    }

    .tool-btn {
      font-size: 14px;
      padding: 4px 9px;
    }

    .tool-btn .label {
      display: none;
      font-size: 12.5px;
    }

    .tool-btn.primary {
      padding: 4px 13px;
      border-color: rgba(244, 63, 142, .6);
      background: linear-gradient(90deg, rgba(124, 58, 237, .3), rgba(244, 63, 142, .25));
    }

    .tool-btn.primary .label {
      display: inline;
    }

    .tool-btn.primary:hover {
      box-shadow: 0 0 16px rgba(244, 63, 142, .45);
    }

    .controls-end {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .counter {
      font-size: 12px;
    }

    .dots button {
      width: 7px;
      height: 7px;
    }

    .dots {
      gap: 6px;
    }

    .container {
      padding: 22px 18px 50px;
    }

    .container h1 {
      font-size: clamp(24px, 3.6vw, 36px);
    }

    .container.wide {
      max-width: 1120px;
    }

    .quiz-card {
      padding: 18px;
    }

    .quiz-question {
      font-size: 17px;
    }

    .option {
      font-size: 14.5px;
      padding: 10px 14px;
    }

    .hero h1,
    .intro h1 {
      font-size: clamp(38px, 7vw, 82px);
    }

    .intro h2 {
      font-size: clamp(17px, 2.6vw, 28px);
    }

    /* ---------- لوحة الشرح الموسّع ---------- */
    #explain-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 64;
      width: min(680px, 100vw);
      display: flex;
      flex-direction: column;
      background: rgba(8, 6, 28, .97);
      border-left: 1px solid var(--cyan);
      box-shadow: -20px 0 80px rgba(0, 0, 0, .6);
      transform: translateX(105%);
      transition: transform .45s cubic-bezier(.22, 1, .36, 1);
    }

    #explain-panel.on {
      transform: none;
    }

    #explain-panel header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
      font-size: 15px;
    }

    #explain-title {
      flex: 1;
    }

    .explain-nav {
      display: flex;
      gap: 6px;
    }

    #explain-body {
      flex: 1;
      overflow: auto;
      padding: 18px 22px 40px;
    }

    .ex-overview {
      padding: 14px 16px;
      margin-bottom: 14px;
      border-right: 3px solid var(--cyan);
      border-radius: 8px;
      background: rgba(34, 211, 238, .07);
      line-height: 2;
      font-size: 15px;
    }

    .ex-section {
      margin: 20px 0 6px;
    }

    .ex-section h3,
    .ex-h {
      font-size: 17px;
      color: var(--cyan);
      margin: 18px 0 8px;
    }

    .ex-section p {
      line-height: 2;
      font-size: 14.5px;
      margin-bottom: 8px;
    }

    .ex-section ul {
      padding-right: 20px;
    }

    .ex-section li {
      line-height: 1.9;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .ex-section li::marker {
      color: var(--pink);
    }

    .ex-terms {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
    }

    .ex-terms div {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
    }

    .ex-terms b {
      display: block;
      color: var(--pink);
      font-family: var(--font-mono);
      margin-bottom: 3px;
    }

    .ex-terms span {
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    .ex-takeaway {
      margin: 20px 0 14px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px dashed var(--pink);
      background: rgba(244, 63, 142, .08);
      line-height: 1.9;
      font-weight: 700;
    }

    /* ---------- المخططات ---------- */
    .chart {
      margin: 14px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(124, 58, 237, .12), rgba(34, 211, 238, .05));
    }

    .chart h4 {
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .chart-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .flow-step {
      flex: 1 1 120px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--cyan);
      background: rgba(34, 211, 238, .08);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .flow-step b {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin: 0 auto 5px;
      border-radius: 50%;
      background: var(--purple);
      font: 700 12px var(--font-mono);
      color: #fff;
    }

    .flow-arrow {
      color: var(--pink);
      font-size: 14px;
    }

    .chart-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cmp-col {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .cmp-col.a {
      border-color: var(--pink);
      background: rgba(244, 63, 142, .07);
    }

    .cmp-col.b {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, .07);
    }

    .cmp-col h5 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .cmp-col ul {
      padding-right: 18px;
    }

    .cmp-col li {
      font-size: 13px;
      line-height: 1.8;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 110px 1fr 42px;
      gap: 8px;
      align-items: center;
      margin: 7px 0;
      font-size: 13px;
    }

    .bar-track {
      height: 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      float: right;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      animation: bar-grow 1s ease both;
    }

    @keyframes bar-grow {
      from {
        width: 0 !important;
      }
    }

    .bar-row b {
      font: 700 12px var(--font-mono);
      direction: ltr;
    }

    .chart-note {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .mindmap {
      width: 100%;
      height: auto;
    }

    .mm-line {
      stroke: var(--purple);
      stroke-width: 1.5;
      opacity: .6;
    }

    .mm-node {
      fill: rgba(124, 58, 237, .22);
      stroke: var(--cyan);
      stroke-width: 1;
    }

    .mm-text {
      fill: var(--text);
      font: 600 11.5px var(--font-main);
    }

    .mm-center {
      fill: rgba(244, 63, 142, .25);
      stroke: var(--pink);
      stroke-width: 2;
    }

    .mm-center-text {
      fill: var(--text);
      font: 800 13px var(--font-main);
    }

    /* ---------- قاموس الاختصارات ---------- */
    .acr-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    #acr-search {
      flex: 1;
      max-width: 420px;
      font: 600 14px var(--font-main);
      color: var(--text);
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 8px 16px;
      outline: none;
    }

    #acr-search:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(34, 211, 238, .3);
    }

    #acr-count {
      font: 700 12px var(--font-mono);
      color: var(--muted);
    }

    .acr-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .chip-btn {
      font: 600 12.5px var(--font-main);
      color: var(--text);
      background: none;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
      cursor: pointer;
      transition: .2s;
    }

    .chip-btn small {
      color: var(--muted);
      margin-right: 3px;
    }

    .chip-btn:hover {
      border-color: var(--cyan);
    }

    .chip-btn.on {
      background: linear-gradient(90deg, rgba(34, 211, 238, .22), rgba(124, 58, 237, .25));
      border-color: var(--cyan);
    }

    .acr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 12px;
    }

    .acr-card {
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      animation: rise .5s both;
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }

    .acr-card:hover {
      transform: translateY(-4px);
      border-color: var(--purple);
      box-shadow: 0 10px 30px rgba(124, 58, 237, .3);
    }

    .acr-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .acr-abbr {
      font: 700 22px var(--font-mono);
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      direction: ltr;
    }

    .acr-cat {
      font-size: 10.5px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 1px 8px;
    }

    .acr-formation {
      direction: ltr;
      text-align: left;
      font: 500 13px var(--font-mono);
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .acr-formation i {
      font-style: normal;
      font-weight: 700;
      color: var(--cyan);
      font-size: 15px;
    }

    .acr-card p {
      font-size: 13px;
      line-height: 1.8;
      margin-top: 4px;
    }

    .acr-card em {
      font-style: normal;
      font-weight: 700;
      font-size: 11px;
      color: var(--pink);
      margin-left: 6px;
    }

    .acr-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    /* ---------- شريط حالة الملخص ---------- */
    #summary-banner {
      font-size: 13px;
      padding: 0 20px;
    }

    #summary-banner:not(:empty) {
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
    }

    #summary-banner.working {
      color: var(--cyan);
      background: rgba(34, 211, 238, .06);
    }

    #summary-banner.done {
      color: var(--ok);
      background: rgba(52, 211, 153, .07);
    }

    #summary-banner.warn {
      color: #fbbf24;
      background: rgba(251, 191, 36, .07);
      line-height: 1.7;
    }

    #summary-banner button {
      margin-right: 10px;
      font: 600 12px var(--font-main);
      color: var(--text);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 10px;
      cursor: pointer;
    }

    .spinner.small {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin: 0 0 -2px 6px;
      border-width: 2px;
    }

    /* الوضع الفاتح للعناصر الجديدة */
    [data-theme="light"] #explain-panel {
      background: rgba(255, 255, 255, .98);
    }

    [data-theme="light"] #acr-search {
      background: rgba(80, 60, 180, .06);
      color: var(--text);
    }

    [data-theme="light"] .acr-card,
    [data-theme="light"] .ex-terms div {
      background: #fff;
    }

    [data-theme="light"] .mm-text,
    [data-theme="light"] .mm-center-text {
      fill: #161640;
    }

    [data-theme="light"] .tool-btn.primary {
      color: var(--text);
    }

    @media (max-width: 860px) {
      #deck {
        height: auto;
        min-height: calc(100vh - var(--nav-h, 90px));
      }

      .tool-btn.primary .label {
        display: none;
      }

      .chart-compare {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- مصادر الاختصارات ---------- */
    .acr-sources {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      align-items: center;
    }

    .acr-sources span {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-left: 2px;
    }

    .acr-sources a {
      font-size: 11px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 9px;
      transition: .2s;
    }

    .acr-sources a:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(34, 211, 238, .08);
    }

    /* ---------- صفحة ملخص الكتاب ---------- */
    #book-search {
      flex: 1;
      max-width: 380px;
      font: 600 14px var(--font-main);
      color: var(--text);
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 8px 16px;
      outline: none;
    }

    #book-search:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(34, 211, 238, .3);
    }

    #book-count {
      font: 700 12px var(--font-mono);
      color: var(--muted);
    }

    .book-section {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      overflow: hidden;
    }

    .book-section summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      list-style: none;
      background: linear-gradient(90deg, rgba(124, 58, 237, .18), transparent);
    }

    .book-section summary::-webkit-details-marker {
      display: none;
    }

    .book-section summary span {
      flex: 1;
    }

    .book-section summary em {
      font: 700 11px var(--font-mono);
      font-style: normal;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      border-radius: 99px;
      padding: 1px 9px;
    }

    .book-section ul {
      list-style: none;
      padding: 6px 16px 14px;
    }

    .book-section li {
      padding: 8px 0 8px 4px;
      border-bottom: 1px dashed var(--border);
      font-size: 14px;
      line-height: 1.95;
    }

    .book-section li:last-child {
      border-bottom: 0;
    }

    [data-theme="light"] .book-section {
      background: #fff;
    }

    [data-theme="light"] #book-search {
      background: rgba(80, 60, 180, .06);
      color: var(--text);
    }

    /* ================================================== */
    /* ===== حجم الشريحة وتأثيرات الأزرار ===== */
    /* ================================================== */

    /* شريحة أصغر قليلاً */
    .slide-card .slide-frame img,
    .slide-frame img {
      max-width: min(1000px, calc(100vw - 190px));
      max-height: calc(100vh - 190px + var(--nav-off, 0px));
    }

    @media (max-width: 860px) {

      .slide-card .slide-frame img,
      .slide-frame img {
        max-width: calc(100vw - 96px);
        max-height: 60vh;
      }
    }

    /* تهيئة الأزرار لتأثير الموجة */
    .btn,
    .btn-secondary,
    .nav-btn,
    .tool-btn,
    .small-btn,
    .tab,
    .icon-btn,
    .chip-btn,
    .menu-item,
    .option,
    #ai-toggle {
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform .2s cubic-bezier(.22, 1, .36, 1), box-shadow .25s, border-color .25s, background .25s, color .25s;
    }

    .arrow {
      overflow: hidden;
    }

    /* موجة الضغط */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .35);
      transform: scale(0);
      animation: ripple .65s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(1);
        opacity: 0;
      }
    }

    [data-theme="light"] .ripple {
      background: rgba(80, 60, 180, .25);
    }

    /* رفع عند التمرير وضغط عند النقر */
    .nav-btn:hover,
    .tool-btn:hover,
    .small-btn:hover,
    .icon-btn:hover,
    .btn-secondary:hover:not(:disabled),
    .chip-btn:hover,
    #ai-toggle:hover {
      transform: translateY(-2px);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .nav-btn:active,
    .tool-btn:active,
    .small-btn:active,
    .icon-btn:active,
    .btn:active,
    .btn-secondary:active,
    .chip-btn:active,
    .tab:active,
    #ai-toggle:active,
    .menu-item:active {
      transform: scale(.94);
    }

    .arrow:hover {
      transform: translateY(-50%) scale(1.12);
    }

    .arrow:active {
      transform: translateY(-50%) scale(.92);
    }

    /* لمعة تعبر الأزرار الرئيسية */
    .btn::after,
    .tool-btn.primary::after,
    #ai-toggle::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      left: -60%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .35), transparent);
      transform: skewX(-20deg);
      transition: left .6s ease;
      pointer-events: none;
    }

    .btn:hover::after,
    .tool-btn.primary:hover::after,
    #ai-toggle:hover::after {
      left: 130%;
    }

    /* أيقونات تتحرك */
    .icon-btn:hover {
      transform: translateY(-2px) rotate(18deg);
    }

    #theme-toggle:hover {
      transform: rotate(180deg) scale(1.1);
    }

    .tool-btn:hover {
      background: rgba(34, 211, 238, .12);
      border-color: rgba(34, 211, 238, .4);
    }

    #export-toggle {
      transition: transform .2s, box-shadow .25s;
    }

    .menu.open~#export-toggle,
    .menu-wrap:has(.menu.open) #export-toggle {
      background: rgba(34, 211, 238, .22);
    }

    /* التبويبات: خط سفلي متحرك */
    .tab::before {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 50%;
      width: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      transition: width .3s, left .3s;
    }

    .tab:hover::before {
      width: 60%;
      left: 20%;
    }

    .tab.on::before {
      width: 0;
    }

    /* عناصر القائمة تظهر بالتتابع */
    .menu.open .menu-item {
      animation: rise .35s both;
    }

    .menu.open .menu-item:nth-child(2) {
      animation-delay: .07s;
    }

    .menu-item:hover {
      padding-right: 20px;
    }

    /* خيارات الاختبار وبطاقات التصفية */
    .option:active:not(:disabled) {
      transform: scale(.98);
    }

    .chip-btn.on {
      box-shadow: 0 0 14px rgba(34, 211, 238, .3);
    }

    /* نقاط التنقل */
    .dots button {
      transition: transform .25s, background .25s, box-shadow .25s;
    }

    .dots button:hover {
      transform: scale(1.7);
      background: var(--purple);
    }

    /* حلقة تركيز واضحة للكيبورد */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    /* ---------- تحسين عرض ملخص الكتاب ---------- */
    #book-list {
      counter-reset: section;
    }

    .book-section summary::before {
      counter-increment: section;
      content: counter(section);
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      flex: none;
      border-radius: 8px;
      font: 700 13px var(--font-mono);
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .book-intro {
      margin: 12px 16px 4px;
      padding: 10px 14px;
      border-right: 3px solid var(--cyan);
      border-radius: 8px;
      background: rgba(34, 211, 238, .07);
      font-size: 14px;
      line-height: 1.95;
    }

    .lead-term {
      color: var(--cyan);
      font-weight: 800;
    }

    .book-section li {
      font-size: 14.5px;
      line-height: 2.05;
    }

    .book-section li::before {
      content: "◆ ";
      color: var(--purple);
      font-size: 10px;
    }

    /* ================================================== */
    /* ===== شكل وألوان الأزرار (النسخة الثانية) ===== */
    /* ================================================== */

    /* التبويبات داخل حاوية واحدة */
    .tabs {
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: rgba(255, 255, 255, .04);
    }

    .tab {
      border: 0;
      border-radius: 99px;
      color: var(--muted);
    }

    .tab:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .06);
    }

    .tab.on {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      box-shadow: 0 4px 18px rgba(124, 58, 237, .5);
    }

    .tab::before {
      display: none;
    }

    /* زر التصدير: أزرق */
    .nav-btn {
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #0891b2, #2563eb);
      box-shadow: 0 4px 16px rgba(37, 99, 235, .4);
    }

    .nav-btn:hover {
      box-shadow: 0 6px 24px rgba(37, 99, 235, .65);
    }

    /* مساعد AI: وردي بنفسجي */
    #ai-toggle {
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #db2777, #7c3aed);
      box-shadow: 0 4px 16px rgba(219, 39, 119, .45);
    }

    /* الوضع الفاتح/الداكن: ذهبي */
    #theme-toggle {
      border-color: rgba(251, 191, 36, .55);
      background: rgba(251, 191, 36, .13);
      box-shadow: 0 0 12px rgba(251, 191, 36, .2);
    }

    #theme-toggle:hover {
      box-shadow: 0 0 20px rgba(251, 191, 36, .55);
    }

    /* أدوات العرض: كل واحدة بلونها */
    .tool-btn {
      --c: 34, 211, 238;
      min-width: 34px;
      border: 1px solid rgba(var(--c), .35);
      background: rgba(var(--c), .12);
    }

    #search-btn {
      --c: 96, 165, 250;
    }

    #fullscreen-btn {
      --c: 167, 139, 250;
    }

    #autoplay-btn {
      --c: 52, 211, 153;
    }

    .tool-btn:hover {
      background: rgba(var(--c), .26);
      border-color: rgba(var(--c), .8);
      box-shadow: 0 0 16px rgba(var(--c), .4);
    }

    .tool-btn.primary {
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 4px 16px rgba(219, 39, 119, .45);
    }

    .tool-btn.primary:hover {
      box-shadow: 0 6px 24px rgba(219, 39, 119, .7);
    }

    /* أسهم الشرائح */
    .arrow {
      border: 1px solid rgba(34, 211, 238, .45);
      background: rgba(8, 6, 28, .75);
      box-shadow: 0 0 14px rgba(34, 211, 238, .2);
    }

    .arrow:hover {
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      border-color: transparent;
    }

    /* الأزرار الثانوية */
    .small-btn,
    .btn-secondary {
      border: 1px solid rgba(34, 211, 238, .4);
      background: rgba(34, 211, 238, .08);
    }

    .small-btn:hover,
    .btn-secondary:hover:not(:disabled) {
      background: rgba(34, 211, 238, .2);
      border-color: var(--cyan);
    }

    /* الأزرار الرئيسية */
    .btn {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 6px 22px rgba(219, 39, 119, .4);
    }

    #generate-quiz {
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      box-shadow: 0 4px 16px rgba(124, 58, 237, .45);
    }

    #summary-word {
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 4px 16px rgba(37, 99, 235, .45);
    }

    #summary-pdf {
      background: linear-gradient(135deg, #ef4444, #db2777);
      box-shadow: 0 4px 16px rgba(239, 68, 68, .45);
    }

    #reset-quiz {
      border-color: rgba(251, 191, 36, .5);
      background: rgba(251, 191, 36, .1);
    }

    #reset-quiz:hover {
      background: rgba(251, 191, 36, .22);
      border-color: #fbbf24;
    }

    /* بطاقات التصفية */
    .chip-btn {
      background: rgba(255, 255, 255, .03);
    }

    .chip-btn.on {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      border-color: transparent;
    }

    .chip-btn.on small {
      color: rgba(255, 255, 255, .8);
    }

    /* الوضع الفاتح */
    [data-theme="light"] .tabs {
      background: rgba(80, 60, 180, .06);
    }

    [data-theme="light"] .tab:hover {
      background: rgba(80, 60, 180, .08);
    }

    [data-theme="light"] .tab.on {
      color: #fff;
    }

    [data-theme="light"] .small-btn,
    [data-theme="light"] .btn-secondary {
      background: rgba(8, 145, 178, .08);
    }

    [data-theme="light"] .arrow {
      background: rgba(255, 255, 255, .9);
    }

    /* ================================================== */
    /* ===== ملخص الكتاب: الفكرة ← الشرح ← النقاط ===== */
    /* ================================================== */

    .book-idea {
      margin: 12px 16px 6px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(251, 191, 36, .45);
      background: linear-gradient(90deg, rgba(251, 191, 36, .12), transparent);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.9;
    }

    .book-idea b {
      display: block;
      font-size: 11.5px;
      color: #fbbf24;
      margin-bottom: 2px;
    }

    .book-block {
      margin: 10px 16px 4px;
    }

    .book-block h4 {
      font-size: 13.5px;
      color: var(--cyan);
      margin-bottom: 4px;
    }

    .book-block p {
      font-size: 14.5px;
      line-height: 2.05;
    }

    .book-block ul {
      padding: 0;
    }

    .book-block .acr-sources {
      margin-top: 2px;
      padding-top: 0;
      border-top: 0;
    }

    .book-section {
      padding-bottom: 12px;
    }

    /* ================================================== */
    /* ===== صفحة 3D ===== */
    /* ================================================== */

    .world-wrap {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - var(--nav-h, 46px));
      min-height: 520px;
    }

    .world-info {
      overflow: auto;
      padding: 16px 18px 30px;
      border-left: 1px solid var(--border);
      background: rgba(8, 6, 28, .72);
      backdrop-filter: blur(8px);
    }

    .wi-layer {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .wi-layer i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    .world-info h2 {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.4;
    }

    .world-info h2 small {
      display: block;
      font: 600 12px var(--font-mono);
      color: var(--cyan);
      direction: ltr;
      text-align: right;
    }

    .wi-idea {
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(251, 191, 36, .45);
      background: linear-gradient(90deg, rgba(251, 191, 36, .12), transparent);
      font-weight: 700;
      line-height: 1.9;
    }

    .wi-idea b {
      display: block;
      font-size: 11.5px;
      color: #fbbf24;
    }

    .world-info h4 {
      margin: 14px 0 4px;
      font-size: 13.5px;
      color: var(--cyan);
    }

    .world-info p {
      font-size: 14px;
      line-height: 2;
    }

    .world-info ul {
      padding-right: 20px;
    }

    .world-info li {
      font-size: 14px;
      line-height: 1.95;
    }

    .world-info li::marker {
      color: var(--pink);
    }

    .world-info .acr-sources {
      border-top: 0;
      padding-top: 0;
      margin-top: 2px;
    }

    .world-stage {
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      background: radial-gradient(ellipse at 50% 40%, rgba(124, 58, 237, .18), transparent 65%);
    }

    .world-stage:active {
      cursor: grabbing;
    }

    .world-title {
      position: absolute;
      top: 12px;
      left: 22px;
      z-index: 5;
      pointer-events: none;
      direction: ltr;
    }

    .world-title b {
      display: block;
      font: 700 64px/1 var(--font-mono);
      letter-spacing: .08em;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(124, 58, 237, .6));
    }

    .world-title span {
      font: 600 12px var(--font-main);
      color: var(--muted);
      direction: rtl;
      display: block;
    }

    .world-hint {
      position: absolute;
      top: 14px;
      right: 18px;
      z-index: 5;
      font-size: 11.5px;
      color: var(--muted);
      pointer-events: none;
    }

    .world-scene {
      position: absolute;
      inset: 0;
      perspective: 1500px;
      perspective-origin: 50% 40%;
    }

    .world {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      transform: translateY(calc((var(--i) - 1.5) * var(--gap)));
      transition: transform .7s cubic-bezier(.22, 1, .36, 1);
    }

    .layer.hidden {
      display: none;
    }

    .slab,
    .part {
      position: absolute;
      left: 0;
      top: 0;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .box {
      position: absolute;
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      border: 1px solid rgba(var(--c), .85);
      background: rgba(var(--c), .16);
    }

    .face.top {
      background: rgba(var(--c), .34);
    }

    .face.left,
    .face.right {
      background: rgba(var(--c), .1);
    }

    .slab:hover .face,
    .part:hover .face {
      background: rgba(var(--c), .42);
    }

    .part.sel .face,
    .slab.sel .face {
      border-color: #fff;
      background: rgba(var(--c), .6);
    }

    .tag3d {
      position: absolute;
      left: 0;
      top: 0;
      padding: 2px 10px;
      border-radius: 99px;
      white-space: nowrap;
      font: 700 11.5px var(--font-main);
      color: #fff;
      background: rgba(var(--c), .85);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
      pointer-events: none;
      transform: rotateY(calc(var(--ry) * -1)) rotateX(calc(var(--rx) * -1)) translate(-50%, calc(var(--lift) * -1));
    }

    .part.sel .tag3d {
      background: #fff;
      color: #111;
    }

    .layer-tag {
      left: -222px;
      font-size: 13px;
      padding: 3px 14px;
      transform: rotateY(calc(var(--ry) * -1)) rotateX(calc(var(--rx) * -1)) translate(-100%, 0);
    }

    .pillar {
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: calc(3 * var(--gap) + 30px);
      transform-style: preserve-3d;
      transition: height .7s cubic-bezier(.22, 1, .36, 1);
    }

    .pillar i {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, .9), transparent) 0 0 / 100% 60px repeat-y;
      animation: pillar-flow 2.4s linear infinite;
      animation-delay: var(--delay);
    }

    .pillar i:nth-child(2) {
      transform: rotateY(90deg);
    }

    @keyframes pillar-flow {
      to {
        background-position: 0 60px;
      }
    }

    .floor {
      position: absolute;
      left: -380px;
      top: -380px;
      width: 760px;
      height: 760px;
      transform: translateY(calc(2 * var(--gap) + 60px)) rotateX(90deg);
      transition: transform .7s cubic-bezier(.22, 1, .36, 1);
      background-image: linear-gradient(rgba(34, 211, 238, .25) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, .25) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 68%);
      mask-image: radial-gradient(circle, #000 25%, transparent 68%);
    }

    .globe {
      position: absolute;
      left: -45px;
      top: -45px;
      width: 90px;
      height: 90px;
      transform-style: preserve-3d;
    }

    .globe-spin {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: globe-spin 9s linear infinite;
    }

    .globe-spin i {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgb(var(--c));
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(var(--c), .6);
    }

    @keyframes globe-spin {
      to {
        transform: rotateY(360deg);
      }
    }

    .world-hud {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 14px;
      max-width: 96%;
      border: 1px solid var(--border);
      background: rgba(8, 6, 28, .72);
      backdrop-filter: blur(8px);
    }

    .layer-chips,
    .hud-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .layer-chip {
      font: 600 12px var(--font-main);
      color: var(--text);
      cursor: pointer;
      padding: 3px 12px;
      border-radius: 99px;
      opacity: .55;
      border: 1px solid rgba(var(--c), .6);
      background: transparent;
    }

    .layer-chip.on {
      opacity: 1;
      background: rgba(var(--c), .28);
      box-shadow: 0 0 12px rgba(var(--c), .35);
    }

    .small-btn.off {
      opacity: .55;
    }

    [data-theme="light"] .world-info,
    [data-theme="light"] .world-hud {
      background: rgba(255, 255, 255, .85);
    }

    [data-theme="light"] .tag3d {
      color: #fff;
    }

    @media (max-width: 860px) {
      .world-wrap {
        display: block;
        height: auto;
      }

      .world-stage {
        height: 62vh;
      }

      .world-info {
        border-left: 0;
        border-top: 1px solid var(--border);
      }

      .world-title b {
        font-size: 44px;
      }
    }

    /* ================================================== */
    /* ===== 3D: شكلان، وإخفاء المجموعات ===== */
    /* ================================================== */

    .mode-switch {
      display: flex;
      padding: 3px;
      gap: 3px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
    }

    .mode-switch button {
      font: 700 12.5px var(--font-main);
      color: var(--muted);
      cursor: pointer;
      padding: 4px 16px;
      border-radius: 99px;
      border: 0;
      background: none;
      transition: .25s;
    }

    .mode-switch button.on {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      box-shadow: 0 3px 14px rgba(124, 58, 237, .5);
    }

    .hide-net [data-group="net"],
    .hide-sw [data-group="sw"],
    .hide-hw [data-group="hw"],
    .hide-io [data-group="io"] {
      display: none;
    }

    .part.mini .tag3d {
      opacity: 0;
      transition: opacity .2s;
    }

    .part.mini:hover .tag3d,
    .part.mini.sel .tag3d {
      opacity: 1;
    }

    .slab.desk {
      cursor: default;
    }

    .slab.desk .face {
      background: rgba(var(--c), .2);
    }

    .slab.desk .face.top {
      background: rgba(var(--c), .3);
    }

    /* ================================================== */
    /* ===== صفحة الحماية ===== */
    /* ================================================== */

    .def-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 14px 6px;
    }

    .def-node {
      flex: 1 1 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 12px 8px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      animation: node-pulse 3.6s infinite;
    }

    .def-icon {
      font-size: 26px;
    }

    .def-node b {
      font-size: 13px;
    }

    .def-node small {
      font: 600 10.5px var(--font-mono);
      color: var(--cyan);
    }

    .flow-link {
      color: var(--pink);
      font-size: 15px;
    }

    @keyframes node-pulse {

      0%,
      60%,
      100% {
        box-shadow: none;
        border-color: var(--border);
      }

      20% {
        box-shadow: 0 0 22px rgba(34, 211, 238, .6);
        border-color: var(--cyan);
      }
    }

    .def-caption {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .fw-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .fw-card {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
    }

    .fw-card.sw {
      border-color: rgba(139, 92, 246, .7);
      background: rgba(139, 92, 246, .08);
    }

    .fw-card.hw {
      border-color: rgba(244, 63, 142, .7);
      background: rgba(244, 63, 142, .07);
    }

    .fw-card h3 {
      font-size: 17px;
    }

    .fw-card>small {
      font: 700 11px var(--font-mono);
      color: var(--cyan);
      direction: ltr;
      display: block;
      margin-bottom: 6px;
      text-align: right;
    }

    .fw-card p {
      font-size: 14px;
      line-height: 1.95;
    }

    .fw-card h5 {
      margin: 10px 0 2px;
      font-size: 13px;
    }

    .fw-card ul {
      padding-right: 18px;
    }

    .fw-card li {
      font-size: 13.5px;
      line-height: 1.9;
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ex-chip {
      font: 600 12px var(--font-mono);
      direction: ltr;
      padding: 2px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .05);
    }

    .method-grid,
    .av-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .av-grid.wide {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    .method-grid>div,
    .av-grid>div {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
    }

    .method-grid b,
    .av-grid b {
      display: block;
      color: var(--cyan);
      font-size: 14px;
      margin-bottom: 3px;
    }

    .method-grid span,
    .av-grid span {
      font-size: 13px;
      line-height: 1.85;
      color: var(--muted);
    }

    .av-grid em {
      display: block;
      margin-top: 4px;
      font-style: normal;
      font-size: 11px;
      color: var(--pink);
    }

    .muted-note {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .book-idea.tip {
      border-color: rgba(52, 211, 153, .5);
      background: linear-gradient(90deg, rgba(52, 211, 153, .12), transparent);
    }

    .book-idea.tip b {
      color: var(--ok);
    }

    .flow-step strong {
      color: var(--cyan);
    }

    .type-badge {
      display: inline-block;
      padding: 1px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
    }

    .type-badge.sw {
      background: rgba(139, 92, 246, .25);
      color: #c4b5fd;
    }

    .type-badge.hw {
      background: rgba(244, 63, 142, .22);
      color: #fda4c8;
    }

    .type-badge.mix {
      background: rgba(251, 191, 36, .2);
      color: #fcd34d;
    }

    .cmp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .cmp-table th,
    .cmp-table td {
      padding: 9px 12px;
      border: 1px solid var(--border);
      text-align: right;
      line-height: 1.8;
      vertical-align: top;
    }

    .cmp-table thead th {

    }

    .cmp-table small {
      color: var(--muted);

    /* ================================================== */
    /* ===== صفحة المقارنات ===== */
    /* ================================================== */

    .cmp-picker {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .cmp-picker select {
      flex: 1 1 200px;
      font: 700 14.5px var(--font-main);
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
    }

    .cmp-picker select option,
    .cmp-picker select optgroup {
      background: #14103a;
      color: #fff;
    }

    .cmp-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .cmp-heads {
      display: grid;
      grid-template-columns: 130px 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cmp-head {
      padding: 12px 14px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .cmp-head.a {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, .09);
    }

    .cmp-head.b {
      border-color: var(--pink);
      background: rgba(244, 63, 142, .09);
    }

    .cmp-head small {
      font-size: 11px;
      color: var(--muted);
    }

    .cmp-head h3 {
      font-size: 18px;
      margin: 2px 0;
    }

    .cmp-head span {
      font: 600 12px var(--font-mono);
      color: var(--muted);
      direction: ltr;
      display: block;
    }

    .cmp-same {
      font-size: 13px;
      color: var(--muted);
      margin: 4px 0 12px;
    }

    .cmp-main {
      margin: 8px 0 14px;
    }

    .cmp-main th {
      width: 130px;
      background: rgba(124, 58, 237, .18);
      font-size: 13px;
    }

    .cmp-ai {
      margin: 6px 0 16px;
    }

    .cmp-ai-text {
      margin-top: 10px;
      padding: 12px 16px;
      border-right: 3px solid var(--cyan);
      border-radius: 8px;
      background: rgba(34, 211, 238, .07);
    }

    .cmp-ai-text p {
      font-size: 14.5px;
      line-height: 2;
    }

    .cmp-sources {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .cmp-sources>div>b {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--cyan);
    }

    [data-theme="light"] .def-node,
    [data-theme="light"] .method-grid>div,
    [data-theme="light"] .av-grid>div {
      background: #fff;
    }

    [data-theme="light"] .cmp-picker select {
      color: var(--text);
    }

    [data-theme="light"] .type-badge.sw {
      color: #5b21b6;
    }

    [data-theme="light"] .type-badge.hw {
      color: #9d174d;
    }

    [data-theme="light"] .type-badge.mix {
      color: #92400e;
    }

    @media (max-width: 1180px) {
      .tab {
        font-size: 11.5px;
        padding: 5px 9px;
      }
    }

    @media (max-width: 860px) {

      .fw-grid,
      .cmp-sources {
        grid-template-columns: 1fr;
      }

      .cmp-heads {
        grid-template-columns: 1fr 1fr;
      }

      .cmp-heads>div:first-child {
        display: none;
      }

      .cmp-main th {
        width: 80px;
      }
    }

    /* ================================================== */
    /* ===== 3D: رحلة البيانات واختبار المجسم ===== */
    /* ================================================== */

    .small-btn.accent {
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #0891b2, #2563eb);
    }

    .small-btn.accent2 {
      color: #fff;
      border: 0;
      background: linear-gradient(135deg, #7c3aed, #db2777);
    }

    .world-card {
      display: none;
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 7;
      width: min(440px, 92%);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--cyan);
      background: rgba(8, 6, 28, .92);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .55), 0 0 30px rgba(34, 211, 238, .25);
      backdrop-filter: blur(10px);
      cursor: default;
    }

    .world-card.on {
      display: block;
      animation: fade-up .35s;
    }

    .wc-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .wc-head span {
      font: 700 12px var(--font-mono);
      color: var(--muted);
    }

    .world-card h4 {
      font-size: 16px;
      color: var(--cyan);
      margin-bottom: 2px;
    }

    .world-card p {
      font-size: 14px;
      line-height: 1.9;
    }

    .wc-question {
      font-size: 15px !important;
      font-weight: 700;
    }

    .wc-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .packet .face {
      background: rgba(255, 255, 255, .95);
      border-color: #fff;
      box-shadow: 0 0 18px #22d3ee, 0 0 40px rgba(34, 211, 238, .8);
      animation: packet-glow 1s ease-in-out infinite alternate;
    }

    @keyframes packet-glow {
      to {
        box-shadow: 0 0 28px #f43f8e, 0 0 60px rgba(244, 63, 142, .8);
      }
    }

    .part.good .face,
    .slab.good .face {
      background: rgba(52, 211, 153, .75) !important;
      border-color: #fff !important;
    }

    .part.bad .face,
    .slab.bad .face {
      background: rgba(251, 113, 133, .75) !important;
      border-color: #fff !important;
    }

    /* ================================================== */
    /* ===== صفحة الألعاب ===== */
    /* ================================================== */

    .game-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .game-tabs button {
      font: 700 13.5px var(--font-main);
      color: var(--text);
      cursor: pointer;
      padding: 8px 18px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
      transition: .25s;
    }

    .game-tabs button:hover {
      border-color: var(--cyan);
    }

    .game-tabs button.on {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 4px 18px rgba(219, 39, 119, .45);
    }

    .game-card {
      min-height: 360px;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
    }

    .game-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .game-top span {
      padding: 4px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .04);
    }

    .game-top b {
      font-family: var(--font-mono);
      color: var(--cyan);
    }

    .game-hint {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
    }

    .game-hint.big {
      font-size: 14.5px;
      color: var(--text);
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(34, 211, 238, .07);
    }

    .game-sub {
      margin: 18px 0 8px;
      font-size: 15px;
      color: var(--cyan);
    }

    .game-over {
      text-align: center;
      padding: 24px 10px;
    }

    .game-over h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .game-over p {
      font-size: 15px;
      line-height: 2;
    }

    .game-over h4 {
      margin-top: 12px;
      color: var(--pink);
    }

    .game-over ul {
      text-align: right;
      max-width: 560px;
      margin: 4px auto;
      padding-right: 20px;
      font-size: 14px;
      line-height: 1.9;
    }

    .game-over .btn {
      margin-top: 14px;
    }

    /* 🧠 مطابقة الذاكرة */
    .mem-intro {
      text-align: center;
      padding: 22px 10px 12px;
    }

    .mem-hero {
      font-size: 58px;
      line-height: 1;
      filter: drop-shadow(0 0 20px rgba(34, 211, 238, .55));
      animation: mem-float 3s ease-in-out infinite;
    }

    .mem-intro h2 {
      margin: 10px 0 6px;
      font-size: 26px;
    }

    .mem-intro p {
      max-width: 560px;
      margin: 0 auto 16px;
      font-size: 14.5px;
      line-height: 2;
      color: var(--muted);
    }

    .mem-intro p b {
      color: var(--pink);
    }

    .mem-intro .game-hint b {
      color: var(--cyan);
      font-family: var(--font-mono);
    }

    .mem-banner {
      text-align: center;
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14.5px;
    }

    .mem-banner b {
      font-family: var(--font-mono);
      font-size: 17px;
    }

    .mem-banner.peek {
      color: #fff;
      border: 1px solid rgba(244, 63, 142, .6);
      background: rgba(244, 63, 142, .16);
      box-shadow: 0 0 20px rgba(244, 63, 142, .25);
      animation: mem-pulse 1s ease-in-out infinite;
    }

    .mem-banner.go {
      color: var(--ok);
      border: 1px solid rgba(52, 211, 153, .5);
      background: rgba(52, 211, 153, .1);
    }

    .mem-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .mem-card {
      position: relative;
      aspect-ratio: 1.1;
      min-height: 112px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      perspective: 800px;
      font-family: var(--font-main);
      color: var(--text);
    }

    .mem-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      padding: 8px;
      border-radius: 14px;
      text-align: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: transform .5s ease, border-color .25s, box-shadow .25s, background .25s;
    }

    .mem-back {
      font-size: 34px;
      color: var(--cyan);
      border: 1px solid var(--border);
      background: radial-gradient(circle at 30% 20%, rgba(124, 58, 237, .5), rgba(8, 6, 28, .9));
    }

    .mem-front {
      transform: rotateY(180deg);
      border: 1px solid rgba(34, 211, 238, .55);
      background: linear-gradient(160deg, rgba(34, 211, 238, .14), rgba(124, 58, 237, .16));
    }

    .mem-card.def .mem-front {
      border-color: rgba(244, 63, 142, .6);
      background: linear-gradient(160deg, rgba(244, 63, 142, .15), rgba(124, 58, 237, .16));
    }

    .mem-card.shown .mem-back {
      transform: rotateY(180deg);
    }

    .mem-card.shown .mem-front {
      transform: rotateY(0);
    }

    .mem-card:not(.shown):hover .mem-back {
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(34, 211, 238, .4);
    }

    .mem-emoji {
      font-size: 34px;
      line-height: 1;
    }

    .mem-front b {
      font: 700 16px var(--font-mono);
      direction: ltr;
      color: var(--cyan);
    }

    .mem-def {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.5;
    }

    .mem-card.matched {
      pointer-events: none;
    }

    .mem-card.matched .mem-front {
      border-color: var(--ok);
      background: rgba(52, 211, 153, .17);
      box-shadow: 0 0 18px rgba(52, 211, 153, .3);
    }

    .mem-card.wrong .mem-front {
      border-color: var(--bad);
      background: rgba(251, 113, 133, .2);
      animation: mem-shake .45s;
    }

    @keyframes mem-shake {

      0%,
      100% {
        transform: rotateY(0);
      }

      25% {
        transform: rotateY(0) translateX(-6px);
      }

      75% {
        transform: rotateY(0) translateX(6px);
      }
    }

    @keyframes mem-pulse {
      50% {
        box-shadow: 0 0 30px rgba(244, 63, 142, .5);
      }
    }

    @keyframes mem-float {
      50% {
        transform: translateY(-8px);
      }
    }

    @media (max-width: 600px) {
      .mem-board {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }

      .mem-card {
        min-height: 104px;
      }

      .mem-emoji {
        font-size: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mem-face {
        transition: none;
      }

      .mem-hero,
      .mem-banner.peek {
        animation: none;
      }
    }

    /* 🎬 الفيديوهات القصيرة (ريلز) */
    .rl-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 4px 0 8px;
    }

    .rl-navs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rl-nav {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(124, 58, 237, .18);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }

    .rl-nav:hover {
      border-color: var(--cyan);
      transform: scale(1.08);
    }

    .rl-phone {
      position: relative;
      width: min(100%, 380px);
      height: min(78vh, 700px);
      min-height: 560px;
      border-radius: 28px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #05030f;
      box-shadow: 0 0 44px rgba(124, 58, 237, .35);
    }

    .rl-top {
      position: absolute;
      z-index: 6;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 13px;
      color: #fff;
      background: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent);
      pointer-events: none;
    }

    .rl-top span {
      font: 700 11px var(--font-mono);
      opacity: .85;
    }

    .rl-feed {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      overscroll-behavior: contain;
    }

    .rl-feed::-webkit-scrollbar {
      display: none;
    }

    .rl-reel {
      position: relative;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(165deg, var(--c1), var(--c2));
    }

    .rl-bg i {
      position: absolute;
      border-radius: 50%;
      filter: blur(34px);
      opacity: .45;
      animation: rl-float 9s ease-in-out infinite;
    }

    .rl-bg i:nth-child(1) {
      width: 190px;
      height: 190px;
      top: 6%;
      right: -50px;
      background: #22d3ee;
    }

    .rl-bg i:nth-child(2) {
      width: 170px;
      height: 170px;
      bottom: 22%;
      left: -50px;
      background: #f43f8e;
      animation-delay: -3s;
    }

    .rl-bg i:nth-child(3) {
      width: 130px;
      height: 130px;
      top: 44%;
      right: 30%;
      background: #7c3aed;
      animation-delay: -6s;
    }

    .rl-poster {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 20px;
      transition: opacity .3s;
    }

    .rl-poster span {
      font-size: 72px;
    }

    .rl-poster h3 {
      margin: 0;
      font-size: 20px;
    }

    .rl-poster small {
      font: 700 12px var(--font-mono);
      opacity: .8;
    }

    .rl-reel.playing .rl-poster {
      opacity: 0;
      pointer-events: none;
    }

    .rl-stage {
      position: absolute;
      inset: 56px 12px 214px 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rl-tap {
      position: absolute;
      inset: 0 60px 160px 0;
      z-index: 2;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .rl-state {
      position: absolute;
      z-index: 4;
      top: 40%;
      left: 50%;
      translate: -50% -50%;
      font-size: 54px;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(0, 0, 0, .6);
    }

    .rl-state.on {
      animation: rl-state .7s ease-out;
    }

    .rl-actions {
      position: absolute;
      z-index: 5;
      left: 8px;
      bottom: 150px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rl-act {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      border: 0;
      background: rgba(0, 0, 0, .35);
      border-radius: 14px;
      padding: 6px 4px;
      width: 46px;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: transform .12s, background .15s;
    }

    .rl-act:hover {
      background: rgba(255, 255, 255, .2);
      transform: scale(1.06);
    }

    .rl-act span {
      font-size: 21px;
      line-height: 1.2;
    }

    .rl-act small {
      font-size: 9.5px;
      opacity: .9;
    }

    .rl-act.off {
      opacity: .5;
    }

    .rl-bottom {
      position: absolute;
      z-index: 3;
      right: 14px;
      left: 62px;
      bottom: 22px;
      pointer-events: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
    }

    .rl-acc {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .rl-acc em {
      margin-inline-start: auto;
      font: 700 10.5px var(--font-mono);
      font-style: normal;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .4);
    }

    .rl-av {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 16px;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 0 0 2px #fff;
    }

    .rl-bottom h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .rl-cap {
      margin: 0 0 6px;
      min-height: 66px;
      padding: 9px 11px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.8;
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(3px);
    }

    .rl-cap.in {
      animation: rl-cap .45s ease-out;
    }

    .rl-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11.5px;
      color: #7dd3fc;
    }

    .rl-prog {
      position: absolute;
      z-index: 6;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, .22);
    }

    .rl-prog i {
      display: block;
      height: 100%;
      width: 0;
      margin-inline-start: auto;
